name: Check Production Runtime Clean
on:
  push:
    paths:
      - 'index.html'
      - 'gm-clean-click-guard.js'
      - 'gm-clean-router-v1.js'
      - 'party-room-stable-v2.js'
      - 'session-log-delete-fix.js'
      - '.github/workflows/check-production-runtime-clean.yml'
  workflow_dispatch:
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Clean architecture static checks
        run: |
          set -euo pipefail
          node --check gm-clean-click-guard.js
          node --check gm-clean-router-v1.js
          node --check party-room-stable-v2.js
          node --check session-log-delete-fix.js
          grep -Fq 'gm-clean-click-v2' index.html
          grep -Fq 'gm-clean-router-v1.js' index.html
          grep -Fq 'party-room-stable-v2.js' index.html
          ! grep -Fq 'gm-center-router-core.js' index.html
          ! grep -Fq 'gm-hub-v2-patch.js' index.html
          ! grep -Fq 'gm-center-party-integration.js' index.html
          ! grep -Fq 'party-eeliot-runtime-hotfix.js' index.html
          grep -Fq 'e.isTrusted&&nav' gm-clean-click-guard.js
          grep -Fq 'catlak_generate_character_reconnect' gm-clean-router-v1.js
          grep -Fq 'catlak_generate_character_claim' gm-clean-router-v1.js
          grep -Fq "window.__catlakGmCleanRouter.route('logs')" session-log-delete-fix.js
          echo CLEAN_RUNTIME_STATIC_OK
      - name: Install browser driver
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright-core
      - name: GM navigation and action smoke
        run: |
          cat > clean-router-smoke.cjs <<'JS'
          const {chromium}=require('playwright-core');const {execFileSync}=require('child_process');const path=require('path');
          (async()=>{let exe='';for(const c of ['google-chrome','google-chrome-stable','chromium']){try{exe=execFileSync('bash',['-lc',`command -v ${c}`],{encoding:'utf8'}).trim();if(exe)break}catch{}}if(!exe)throw new Error('Chrome missing');const b=await chromium.launch({headless:true,executablePath:exe,args:['--no-sandbox']});try{const p=await b.newPage();const errors=[];p.on('pageerror',e=>errors.push(String(e.message||e)));await p.setContent(`<!doctype html><style>.hidden{display:none}</style><div id="app"><span class="role">GM</span><nav class="nav"><button data-tab="gm" class="on">Canlı Oyun</button><button data-tab="items">Eşya</button><button data-tab="races">Irk</button><button data-tab="builder">Builder</button><button data-tab="characters">Karakterler</button><button data-cc-stats-tab>Stat</button><button data-gmt-open>Old GM</button></nav><main>BASE</main></div><div id="toast" class="hidden"></div>`);await p.evaluate(()=>{
            window.__native=[];window.__rpc=[];
            document.querySelectorAll('.nav [data-tab],.nav [data-cc-stats-tab]').forEach(x=>x.addEventListener('click',()=>{window.__native.push(x.dataset.tab||'stats');document.querySelector('main').textContent='NATIVE '+(x.dataset.tab||'stats')}));
            const chars=[{id:'c1',name:'Hazır Test',species_name:'İnsan',background_name:'Gezgin',class_name:'Savaşçı',level:2,hp_current:10,hp_max:12,base_ac:13,owner_id:null,play_status:'prepared',data:{},created_at:'1'},{id:'c2',name:'Bağlı Test',species_name:'Elf',background_name:'Bilgin',class_name:'Büyücü',level:3,hp_current:9,hp_max:9,base_ac:11,owner_id:'u1',play_status:'active',data:{},created_at:'2'}];
            const abilities=[];const assignments=[];
            function from(table){const o={_table:table,_filters:{},select(){return o},order(){return o},in(){return o},eq(k,v){o._filters[k]=v;return o},update(){return o},delete(){return o},maybeSingle(){let rows=table==='catlak_characters'?chars:table==='catlak_abilities'?abilities:assignments;return Promise.resolve({data:rows.find(x=>Object.entries(o._filters).every(([k,v])=>String(x[k])===String(v)))||null,error:null})},then(ok,bad){let rows=table==='catlak_characters'?chars:table==='catlak_abilities'?abilities:table==='catlak_character_abilities'?assignments:[];return Promise.resolve({data:rows,error:null}).then(ok,bad)}};return o}
            const ch={on(){return ch},subscribe(){return ch}};window.__catlakSupabase={from,rpc:async(name,args)=>{window.__rpc.push({name,args});if(name==='catlak_generate_character_claim')return{data:'CLAIM123',error:null};if(name==='catlak_generate_character_reconnect')return{data:'RECONNECT123',error:null};if(name==='catlak_gm_save_ability'){abilities.push({id:'a1',name:args.p_name,ability_type:args.p_ability_type,effect_type:args.p_effect_type,target_type:args.p_target_type,formula:args.p_formula,requires_attack:args.p_requires_attack,attack_bonus:args.p_attack_bonus,description:args.p_description});return{data:'a1',error:null}}return{data:true,error:null}},channel:()=>ch};window.__catlakGmTools={close(){},open(){}};window.__catlakQualityOfLifeTest={closeCreatureLibrary(){}};window.__catlakCampaignStateTest={close(){}};
          });await p.addScriptTag({path:path.resolve('gm-clean-click-guard.js')});await p.addScriptTag({path:path.resolve('gm-clean-router-v1.js')});await p.waitForFunction(()=>!!window.__catlakGmCleanRouter&&!!document.querySelector('[data-gmc-open]'));
          await p.click('[data-gmc-open]');await p.waitForSelector('[data-gmc-centerbar]');
          await p.click('[data-gmc-route="items"]');await p.waitForTimeout(50);let s=await p.evaluate(()=>({open:window.__catlakGmCleanRouter.isOpen(),route:window.__catlakGmCleanRouter.current(),native:window.__native.slice(),bar:!!document.querySelector('[data-gmc-centerbar]')}));if(!s.open||s.route!=='items'||!s.bar||!s.native.includes('items'))throw new Error('Items reset regression '+JSON.stringify(s));
          await p.click('[data-gmc-route="races"]');await p.waitForTimeout(50);s=await p.evaluate(()=>({open:window.__catlakGmCleanRouter.isOpen(),route:window.__catlakGmCleanRouter.current(),bar:!!document.querySelector('[data-gmc-centerbar]')}));if(!s.open||s.route!=='races'||!s.bar)throw new Error('Races reset regression '+JSON.stringify(s));
          await p.click('[data-gmc-route="ability"]');await p.waitForSelector('[data-gmc-owned="ability"]');await p.fill('#gmc-ab-name','Test Güç');await p.click('[data-gmc-action="ability-save"]');await p.waitForFunction(()=>document.body.textContent.includes('1 Yetenek'));s=await p.evaluate(()=>({open:window.__catlakGmCleanRouter.isOpen(),route:window.__catlakGmCleanRouter.current(),saved:window.__rpc.some(x=>x.name==='catlak_gm_save_ability')}));if(!s.open||s.route!=='ability'||!s.saved)throw new Error('Ability action reset '+JSON.stringify(s));
          await p.click('[data-gmc-route="characters"]');await p.waitForSelector('[data-gmc-owned="characters"]');await p.click('[data-gmc-action="char-invite"][data-id="c1"]');await p.waitForFunction(()=>document.querySelector('[data-gmc-char="c1"] .gmc-invite'));s=await p.evaluate(()=>({open:window.__catlakGmCleanRouter.isOpen(),route:window.__catlakGmCleanRouter.current(),claim:window.__rpc.some(x=>x.name==='catlak_generate_character_claim')}));if(!s.open||s.route!=='characters'||!s.claim)throw new Error('Invite action reset '+JSON.stringify(s));
          if(errors.length)throw new Error('Page errors '+errors.join(' | '));console.log('CLEAN_GM_NAV_ACTIONS_OK',JSON.stringify(s));
          }finally{await b.close()}})().catch(e=>{console.error(e);process.exit(1)});
          JS
          node clean-router-smoke.cjs
      - name: Party room must stay isolated
        run: |
          cat > party-smoke.cjs <<'JS'
          const {chromium}=require('playwright-core');const {execFileSync}=require('child_process');const path=require('path');
          (async()=>{let exe='';for(const c of ['google-chrome','google-chrome-stable','chromium']){try{exe=execFileSync('bash',['-lc',`command -v ${c}`],{encoding:'utf8'}).trim();if(exe)break}catch{}}const b=await chromium.launch({headless:true,executablePath:exe,args:['--no-sandbox']});try{const p=await b.newPage();await p.setContent('<div id="app"><span class="role">GM</span><nav class="nav"><button data-tab="gm">Canlı Oyun</button><button data-gmc-open>GM Merkezi</button></nav><main>BASE</main></div><div id="toast" class="hidden"></div>');await p.evaluate(()=>{const chars=[{id:'c1',name:'Test',species_name:'İnsan',class_name:'Savaşçı',level:1,hp_current:10,hp_max:10,base_ac:12,base_speed:30,data:{},owner_id:null,play_status:'prepared',created_at:'1'}];function from(){const o={select(){return o},in(){return o},order(){return o},eq(){return o},update(){return o},maybeSingle(){return Promise.resolve({data:chars[0],error:null})},then(ok,bad){return Promise.resolve({data:chars,error:null}).then(ok,bad)}};return o}const ch={on(){return ch},subscribe(){return ch}};window.__catlakSupabase={from,rpc:async()=>({data:true,error:null}),channel:()=>ch};window.__catlakGmTools={close(){}};window.__catlakCampaignStateTest={close(){}};window.__catlakQualityOfLifeTest={closeCreatureLibrary(){}}});await p.addScriptTag({path:path.resolve('party-room-stable-v2.js')});await p.waitForSelector('[data-prh-manager]');await p.click('[data-prh-manager]');await p.waitForSelector('[data-prsv2-page]');await p.waitForTimeout(100);const s=await p.evaluate(()=>({pages:document.querySelectorAll('[data-prsv2-page]').length,open:window.__catlakPartyEeliotHotfix.isOpen(),text:document.querySelector('main').textContent}));if(s.pages!==1||!s.open||!s.text.includes('Parti Yönetimi'))throw new Error('Party room regression '+JSON.stringify(s));console.log('PARTY_ROOM_OK',JSON.stringify(s));}finally{await b.close()}})().catch(e=>{console.error(e);process.exit(1)});
          JS
          node party-smoke.cjs
      - name: Wait for current Pages deployment
        env:
          LIVE_URL: https://axionblooder.github.io/catlak-cagi-online/
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 40); do
            curl -fsSL --retry 2 "${LIVE_URL}?clean=$(date +%s%N)" -o /tmp/live.html || true
            if grep -Fq 'clean-gm-runtime-v2' /tmp/live.html 2>/dev/null && grep -Fq 'gm-clean-click-v2' /tmp/live.html 2>/dev/null; then ok=1; break; fi
            sleep 3
          done
          test "$ok" = 1
          echo CLEAN_PRODUCTION_VERSION_OK
