name: Check Public Site
on:
  push:
    paths:
      - '.github/workflows/check-public-site.yml'
      - 'browser-app.js'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Open live PageShare in Chrome
        run: |
          URL='https://blue-anchor-1448.hosted.pageshare.ai/?smoke=github-actions'
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            echo 'Chrome binary missing'
            exit 1
          fi
          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=15000 --dump-dom "$URL" >/tmp/live-dom.html 2>/tmp/live-chrome.log || true
          echo '--- Chrome diagnostics ---'
          cat /tmp/live-chrome.log || true
          echo '--- Rendered application checks ---'
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          dom=Path('/tmp/live-dom.html').read_text(encoding='utf-8',errors='replace')

          class AppText(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.depth=0
                  self.parts=[]
              def handle_starttag(self,tag,attrs):
                  attrs=dict(attrs)
                  if self.depth:
                      self.depth+=1
                  elif attrs.get('id')=='app':
                      self.depth=1
              def handle_startendtag(self,tag,attrs):
                  pass
              def handle_endtag(self,tag):
                  if self.depth:
                      self.depth-=1
              def handle_data(self,data):
                  if self.depth:
                      self.parts.append(data)

          p=AppText(); p.feed(dom)
          app_text=' '.join(' '.join(p.parts).split())
          print('APP_TEXT:',app_text[:2500])
          bad=[
            'Site yüklenemedi',
            'Missing } in template expression',
            'Invalid or unexpected token',
            'Uygulama başlatılamadı',
            'Uygulama dosyası yüklenemedi',
            'Tarayıcı yükleme hatası'
          ]
          found=[x for x in bad if x.lower() in app_text.lower()]
          if found:
              raise SystemExit('Live app error text found: '+', '.join(found))
          auth_markers=['Giriş Yap','Hesap Aç','TEK EVREN • ONLINE FRP']
          if not any(x in app_text for x in auth_markers):
              raise SystemExit('Live app did not reach the expected auth UI')
          print('LIVE PAGE OK: public PageShare rendered the real auth UI')
          PY
          if grep -Eqi '(Missing \} in template expression|Invalid or unexpected token|Uncaught SyntaxError)' /tmp/live-chrome.log; then
            exit 1
          fi
