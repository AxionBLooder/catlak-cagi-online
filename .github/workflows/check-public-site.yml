name: Check Public Site
on:
  push:
    paths:
      - '.github/workflows/check-public-site.yml'
  workflow_dispatch:
concurrency:
  group: catlak-pages-live-smoke
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - name: Install browser driver
        run: npm install --no-save --package-lock=false --no-audit --no-fund playwright-core

      - name: Verify GitHub Pages static production
        env:
          LIVE_URL: https://axionblooder.github.io/catlak-cagi-online/
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 --retry-delay 2 "$LIVE_URL?verify=$(date +%s)" -o /tmp/index.html
          grep -q 'browser-app.js' /tmp/index.html
          grep -q 'gm-controls-patch.js' /tmp/index.html
          grep -q 'presence-patch.js?v=presence-v3' /tmp/index.html
          grep -q 'dice-ux-patch.js?v=dice-v1' /tmp/index.html
          curl -fsSL --retry 4 --retry-delay 2 "${LIVE_URL}browser-app.js?verify=$(date +%s)" -o /tmp/app.js
          node --check /tmp/app.js
          test "$(wc -c < /tmp/app.js)" -gt 300000
          grep -q 'axionblooder.github.io/catlak-cagi-online/?join=' /tmp/app.js
          grep -q 'catlak_generate_character_reconnect' /tmp/app.js
          grep -q 'Yeniden Bağlama Linki Oluştur' /tmp/app.js
          grep -q '__catlakPreparedOwner' /tmp/app.js
          grep -q 'cc-h-prepared-grid' /tmp/app.js
          grep -q 'GM • KİŞİYE ÖZEL DURUM' /tmp/app.js
          grep -q 'Aktif Etki / Debuff' /tmp/app.js
          grep -q 'catlak_update_vampire_kp' /tmp/app.js
          grep -q 'cc-hotfix-live' /tmp/app.js
          grep -q 'cnl-player-party-style' /tmp/app.js
          grep -q 'max-height:72vh' /tmp/app.js
          grep -q '#app \[data-cc-world-tab\]' /tmp/app.js
          ! grep -q 'hidden-spring-7923.hosted.pageshare.ai/?join=' /tmp/app.js
          ! grep -q 'catlak-cagi-online.netlify.app/?join=' /tmp/app.js
          ! grep -q 'catlak-transfer-session' /tmp/app.js
          curl -fsSL --retry 4 --retry-delay 2 "${LIVE_URL}gm-controls-patch.js?verify=$(date +%s)" -o /tmp/gm-controls.js
          node --check /tmp/gm-controls.js
          grep -q "KP yalnız Vampir ırkına özeldir" /tmp/gm-controls.js
          grep -q 'catlak_gm_set_character_note' /tmp/gm-controls.js
          grep -q 'Oyuncuya Gönder / Kaydet' /tmp/gm-controls.js
          curl -fsSL --retry 4 --retry-delay 2 "${LIVE_URL}presence-patch.js?verify=$(date +%s)" -o /tmp/presence.js
          node --check /tmp/presence.js
          grep -q 'catlak-online-presence' /tmp/presence.js
          grep -q 'ÇEVRİMİÇİ' /tmp/presence.js
          grep -q 'ÇEVRİMDIŞI' /tmp/presence.js
          grep -q "ccPrIsVampire" /tmp/presence.js
          grep -q 'VAMPİR • KP' /tmp/presence.js
          grep -q 'grid-template-columns:minmax(0,1.35fr) minmax(260px,.65fr)!important' /tmp/presence.js
          grep -q 'ccPresenceCompact' /tmp/presence.js
          grep -q 'setInterval' /tmp/presence.js
          ! grep -q 'MutationObserver' /tmp/presence.js
          curl -fsSL --retry 4 --retry-delay 2 "${LIVE_URL}dice-ux-patch.js?verify=$(date +%s)" -o /tmp/dice-ux.js
          node --check /tmp/dice-ux.js
          grep -q 'KRİTİK BAŞARISIZLIK' /tmp/dice-ux.js
          grep -q 'catlak_gm_roll_d20' /tmp/dice-ux.js
          grep -q 'catlak_gm_roll_d100' /tmp/dice-ux.js
          grep -q 'catlak_gm_clear_private_rolls' /tmp/dice-ux.js
          grep -q 'GM Zarlarını Temizle' /tmp/dice-ux.js
          grep -q 'dxRememberScroll' /tmp/dice-ux.js
          echo 'PAGES_STATIC_PRODUCTION_OK'

      - name: Verify reconnect edge rejection safely
        run: |
          set -euo pipefail
          CODE=$(curl -sS -o /tmp/recon.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            -d '{"token":"RECON-INVALID-SMOKE-ONLY"}' \
            'https://ygbereitlhjvoqgqlwfe.supabase.co/functions/v1/catlak-guest-join')
          cat /tmp/recon.json
          test "$CODE" = '409'
          grep -Eqi 'Yeniden bağlama.*(geçersiz|kullanılmış|süresi dolmuş)' /tmp/recon.json
          echo 'RECONNECT_EDGE_REJECTION_OK'

      - name: Open permanent site with Chrome
        env:
          LIVE_URL: https://axionblooder.github.io/catlak-cagi-online/
        run: |
          cat > .pages-smoke.cjs <<'JS'
          const { chromium }=require('playwright-core');
          const { execFileSync }=require('child_process');
          (async()=>{
            let exe='';
            for(const cmd of ['google-chrome','google-chrome-stable','chromium']){
              try{exe=execFileSync('bash',['-lc',`command -v ${cmd}`],{encoding:'utf8'}).trim();if(exe)break}catch{}
            }
            if(!exe)throw new Error('Chrome binary missing');
            const browser=await chromium.launch({headless:true,executablePath:exe,args:['--no-sandbox','--disable-gpu']});
            try{
              async function runRoot(){
                const page=await browser.newPage();
                const errors=[];
                page.on('pageerror',e=>errors.push(String(e.message||e)));
                const response=await page.goto(process.env.LIVE_URL+'?smoke=dice-v1-'+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});
                if(response?.status()!==200)throw new Error(`Root status ${response?.status()}`);
                await page.waitForFunction(()=>{
                  const app=document.querySelector('#app')?.textContent||'';
                  return app.includes('E-posta')&&!app.includes('Uygulama yükleniyor');
                },{timeout:25000});
                await page.waitForFunction(()=>{
                  const p=document.querySelector('script[data-cc-presence-loader]');
                  const d=document.querySelector('script[data-cc-dice-ux-loader]');
                  return !!p&&String(p.src||'').includes('presence-v3')&&!!d&&String(d.src||'').includes('dice-v1')&&!!window.__catlakDiceUxTest;
                },{timeout:10000});
                const critical=await page.evaluate(()=>{
                  const test=document.createElement('div');
                  test.id='cc-smoke-critical';
                  test.className='roll';
                  test.innerHTML='<div class="die">0</div><div><b>Smoke</b></div>';
                  document.querySelector('#app').appendChild(test);
                  window.__catlakDiceUxTest.criticalize();
                  const ok=test.textContent.includes('KRİTİK BAŞARISIZLIK');
                  test.remove();
                  return ok;
                });
                if(!critical)throw new Error('Critical failure badge did not render for total 0');
                await page.evaluate(()=>{
                  const spacer=document.createElement('div');spacer.id='cc-smoke-spacer';spacer.style.height='2200px';document.body.appendChild(spacer);
                  window.scrollTo(0,700);window.__catlakDiceUxTest.rememberScroll();window.scrollTo(0,0);window.__catlakDiceUxTest.restoreScroll();
                });
                await page.waitForTimeout(120);
                const y=await page.evaluate(()=>window.scrollY);
                if(y<600)throw new Error('Scroll preservation failed: '+y);
                await page.evaluate(()=>document.querySelector('#cc-smoke-spacer')?.remove());
                const before=await page.locator('#app').innerText();
                await page.waitForTimeout(3500);
                const after=await page.locator('#app').innerText();
                if(!after.includes('E-posta')||after.includes('Uygulama yükleniyor'))throw new Error('Root became unstable after add-ons loaded');
                if(errors.length)throw new Error('Root page errors: '+errors.join(' | '));
                console.log('DICE_UX_BROWSER_OK',JSON.stringify({critical,scrollY:y,before:before.slice(0,300),after:after.slice(0,300)}));
                await page.close();
              }
              async function runInvite(token,marker){
                const page=await browser.newPage();
                const errors=[];
                page.on('pageerror',e=>errors.push(String(e.message||e)));
                const response=await page.goto(process.env.LIVE_URL+'?join='+encodeURIComponent(token),{waitUntil:'domcontentloaded',timeout:30000});
                if(response?.status()!==200)throw new Error(`Root status ${response?.status()} for ${token}`);
                await page.waitForFunction((expected)=>{
                  const toast=document.querySelector('#toast')?.textContent||'';
                  const app=document.querySelector('#app')?.textContent||'';
                  return toast.includes(expected)&&app.includes('E-posta')&&!app.includes('Uygulama yükleniyor');
                },marker,{timeout:25000});
                if(errors.length)throw new Error('Invite page errors: '+errors.join(' | '));
                await page.close();
              }
              await runRoot();
              await runInvite('CHAR-INVALID-SMOKE-ONLY','Karakter daveti kullanılmış veya süresi dolmuş');
              await runInvite('RECON-INVALID-SMOKE-ONLY','Yeniden bağlama bağlantısı kullanılmış veya süresi dolmuş');
              console.log('GITHUB_PAGES_BROWSER_SMOKE_OK');
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node .pages-smoke.cjs
