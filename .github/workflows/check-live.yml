# LEGACY CHECK QUARANTINED: current playable runtime is guarded by Check Playable Hardening.
name: Source Sanity Check
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - name: Check active JavaScript syntax
        run: |
          set -euo pipefail
          for f in browser-app.js gm-tools-patch.js gm-hub-v2-patch.js gm-center-router-core.js gm-management-room-patch.js gm-nav-cleanup-patch.js class-bonus-patch.js visual-archive-map-flow-patch.js room-guard-patch.js room-system-patch.js player-sheet-patch.js player-live-actions-patch.js stat-roll-patch.js; do node --check "$f"; done
      - name: Check current runtime wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          required=[
            'browser-app.js','gm-tools-patch.js','gm-hub-v2-patch.js','gm-center-router-core.js',
            'gm-management-room-patch.js','gm-nav-cleanup-patch.js','class-bonus-patch.js','visual-archive-map-flow-patch.js',
            'room-guard-patch.js','room-system-patch.js','player-sheet-patch.js',
            'player-live-actions-patch.js','stat-roll-patch.js'
          ]
          for name in required:
              if name not in html:
                  raise SystemExit('Aktif runtime index içinde yüklenmiyor: '+name)
          retired=['gm-hub-patch.js','gm-hub-route-fix-patch.js','gm-center-live-runtime.js','gm-center-tools-integration-patch.js','ability-system-patch.js','ability-workshop-state-patch.js']
          for name in retired:
              if name in html:
                  raise SystemExit('Eski/çakışan runtime yeniden yüklenmiş: '+name)
          if html.index('gm-tools-patch.js') > html.index('gm-hub-v2-patch.js'):
              raise SystemExit('GM araçları merkez motorundan önce yüklenmeli')
          if html.index('gm-hub-v2-patch.js') > html.index('gm-center-router-core.js'):
              raise SystemExit('GM merkez motoru yönlendiriciden önce yüklenmeli')
          if html.index('gm-center-router-core.js') > html.index('gm-management-room-patch.js'):
              raise SystemExit('Yönetim Odası yönlendiriciden sonra yüklenmeli')
          artifact=Path('browser-app.js').read_text(encoding='utf-8')
          for marker in ['Görsel Dosyası Seç','Hızlı Karakter Düzenleme','Toplu Zar Sil','__catlakStableLiveOwner']:
              if marker not in artifact:
                  raise SystemExit('browser-app.js üretim işareti eksik: '+marker)
          router=Path('gm-center-router-core.js').read_text(encoding='utf-8')
          if "'combat'" in router.split('GMCR_ROUTES',1)[1].split(']);',1)[0]:
              raise SystemExit('Savaş rotası GM Merkezi yönlendiricisine geri dönmüş')
          management=Path('gm-management-room-patch.js').read_text(encoding='utf-8')
          for marker in ['__catlakManagementRoom','data-gmr-page','catlak_generate_character_claim']:
              if marker not in management:
                  raise SystemExit('Yönetim Odası işareti eksik: '+marker)
          bonus=Path('class-bonus-patch.js').read_text(encoding='utf-8')
          for marker in ['class_bonus_v1','base_stats','hp_max','base_ac']:
              if marker not in bonus:
                  raise SystemExit('Sınıf bonusu işareti eksik: '+marker)
          visual=Path('visual-archive-map-flow-patch.js').read_text(encoding='utf-8')
          for marker in ['__catlakVisualArchiveMapFlowV1','data-vamf-places','Partiye Yansıt']:
              if marker not in visual:
                  raise SystemExit('Görsel/Harita akışı işareti eksik: '+marker)
          print('SOURCE_SANITY_CURRENT_OK')
          PY
