name: Source Sanity Check
on:
  push:
    paths:
      - 'live_*.txt'
      - 'main.js'
      - 'ui-patch.js'
      - 'stability-patch.js'
      - 'gallery-quality-patch.js'
      - 'ux-patch.js'
      - 'nav-lite-patch.js'
      - 'simple-world-upload-patch.js'
      - 'weapon-slot-patch.js'
      - 'gm-item-slot-patch.js'
      - 'room-guard-patch.js'
      - 'room-system-patch.js'
      - 'battle-room-v3-patch.js'
      - 'player-enemy-privacy-patch.js'
      - 'battle-room-compact-patch.js'
      - 'gm-nav-cleanup-patch.js'
      - 'gm-combat-v3-patch.js'
      - 'battle-creature-patch.js'
      - 'combat-enhancements-patch.js'
      - 'ability-player-patch.js'
      - 'gm-hub-v2-patch.js'
      - 'player-sheet-equipment-abilities-patch.js'
      - 'dice-ux-patch.js'
      - 'event-rolls-patch.js'
      - 'index.html'
      - 'browser-app.js'
      - 'browser-build.json'
      - '.github/workflows/check-live.yml'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild legacy source for parser check
        run: cat live_00.txt live_01.txt live_02.txt live_03.txt live_04.txt live_05.txt live_06.txt live_07.txt live_08.txt > /tmp/catlak-live.js
      - name: Check JavaScript syntax
        run: |
          node --check /tmp/catlak-live.js
          node --check main.js
          node --check ui-patch.js
          node --check stability-patch.js
          node --check gallery-quality-patch.js
          node --check ux-patch.js
          node --check nav-lite-patch.js
          node --check simple-world-upload-patch.js
          node --check weapon-slot-patch.js
          node --check gm-item-slot-patch.js
          node --check room-guard-patch.js
          node --check room-system-patch.js
          node --check battle-room-v3-patch.js
          node --check player-enemy-privacy-patch.js
          node --check battle-room-compact-patch.js
          node --check gm-nav-cleanup-patch.js
          node --check gm-combat-v3-patch.js
          node --check battle-creature-patch.js
          node --check combat-enhancements-patch.js
          node --check ability-player-patch.js
          node --check gm-hub-v2-patch.js
          node --check player-sheet-equipment-abilities-patch.js
          node --check dice-ux-patch.js
          node --check event-rolls-patch.js
          node --check browser-app.js
      - name: Check source invariants
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          src=Path('/tmp/catlak-live.js').read_text(encoding='utf-8')
          if src.count("const app=document.querySelector('#app');") != 1:
              raise SystemExit('Legacy kaynakta app tanımı tam olarak bir kez olmalı')
          manifest=json.loads(Path('browser-build.json').read_text(encoding='utf-8'))
          if manifest.get('format') not in ('iife-es2018-browser-verified','iife-es2018-browser-verified-single-owner','iife-es2018-browser-verified-single-owner-minified'):
              raise SystemExit('Doğrulanmış browser build manifesti bulunamadı')
          artifact=Path('browser-app.js').read_text(encoding='utf-8')
          if not artifact:
              raise SystemExit('browser-app.js boş')
          for marker in ['Görsel Dosyası Seç','catlak-world-media','Hızlı Karakter Düzenleme','Toplu Zar Sil']:
              if marker not in artifact:
                  raise SystemExit('browser-app.js yeni üretim özelliğini içermiyor: '+marker)
          for stale in ['ccx-unified-world','GM • HARİTA EKLE','EVREN GÖRSELİ EKLE']:
              if stale in artifact:
                  raise SystemExit('Eski Evren rendererı artifact içinde kaldı: '+stale)
          html=Path('index.html').read_text(encoding='utf-8')
          if 'browser-app.js' not in html or 'bundle.js' in html:
              raise SystemExit('index.html yalnız doğrulanmış browser-app.js üretim yolunu kullanmalı')
          for runtime in ['room-guard-patch.js','room-system-patch.js','battle-room-v3-patch.js','player-enemy-privacy-patch.js','battle-room-compact-patch.js','gm-nav-cleanup-patch.js','gm-combat-v3-patch.js','gm-item-slot-patch.js','battle-creature-patch.js','combat-enhancements-patch.js','ability-player-patch.js','gm-hub-v2-patch.js','player-sheet-equipment-abilities-patch.js']:
              if runtime not in html:
                  raise SystemExit(runtime+' index.html içinde yüklenmiyor')
          for retired in ['ability-system-patch.js','ability-workshop-state-patch.js','gm-hub-patch.js','gm-hub-route-fix-patch.js']:
              if retired in html:
                  raise SystemExit('Eski çakışan runtime hâlâ index.html içinde: '+retired)
          hub=Path('gm-hub-v2-patch.js').read_text(encoding='utf-8')
          for marker in ['__catlakGmHubOwnsMain','catlak_gm_update_ability','data-gm2-centerbar']:
              if marker not in hub:
                  raise SystemExit('GM Hub v2 stabilite işareti eksik: '+marker)
          guard=Path('room-guard-patch.js').read_text(encoding='utf-8')
          for marker in ['__catlakBattleInnerHtmlStabilityInstalled','crg-gm-center-scope-style','__catlakBattleRenderSuppressed']:
              if marker not in guard:
                  raise SystemExit('Savaş/GM Merkezi stabilite işareti eksik: '+marker)
          battle=Path('battle-room-v3-patch.js').read_text(encoding='utf-8')
          for marker in ['__catlakBattleRoomV3','data-br3-creatures','data-br3-abilities','data-br3-clear-log','catlak_player_use_ability','catlak_player_weapon_strike']:
              if marker not in battle:
                  raise SystemExit('Savaş Odası v3 işareti eksik: '+marker)
          privacy=Path('player-enemy-privacy-patch.js').read_text(encoding='utf-8')
          for marker in ['__catlakEnemyHpPrivacy','data-br3-creatures','data-br3-ability-target']:
              if marker not in privacy:
                  raise SystemExit('Oyuncu yaratık HP gizlilik işareti eksik: '+marker)
          compact=Path('battle-room-compact-patch.js').read_text(encoding='utf-8')
          for marker in ['brc-compact-battle','brc-quick-card','brc-creatures-card','brc-abilities-card']:
              if marker not in compact:
                  raise SystemExit('Kompakt Savaş Odası işareti eksik: '+marker)
          navclean=Path('gm-nav-cleanup-patch.js').read_text(encoding='utf-8')
          for marker in ['data-ccr-hub','__catlakGmNavCleanupTest']:
              if marker not in navclean:
                  raise SystemExit('GM navigasyon temizliği işareti eksik: '+marker)
          gmcombat=Path('gm-combat-v3-patch.js').read_text(encoding='utf-8')
          for marker in ['data-cex-template-add','catlak_gm_combat_add_template','data-bcc-add-creature','catlak_gm_save_creature_template','Kütüphaneye Kaydet','gcv3-compact-gm-combat']:
              if marker not in gmcombat:
                  raise SystemExit('GM savaş v3/kütüphane/panel işareti eksik: '+marker)
          psea=Path('player-sheet-equipment-abilities-patch.js').read_text(encoding='utf-8')
          for marker in ['psea-equipment-grid','grid-template-columns:repeat(2,minmax(0,1fr))','gmt-slot:nth-child(5)']:
              if marker not in psea:
                  raise SystemExit('Oyuncu ekipman 2 sütun işareti eksik: '+marker)
          if 'room-guard-patch.js?v=guard-v3' not in html:
              raise SystemExit('room-guard cache sürümü guard-v3 olmalı')
          if 'battle-room-v3-patch.js?v=battleroom-v1' not in html:
              raise SystemExit('battle-room-v3 cache sürümü battleroom-v1 olmalı')
          if 'player-enemy-privacy-patch.js?v=privacy-v1' not in html:
              raise SystemExit('player-enemy-privacy cache sürümü privacy-v1 olmalı')
          if 'battle-room-compact-patch.js?v=battlecompact-v4' not in html:
              raise SystemExit('battle-room-compact cache sürümü battlecompact-v4 olmalı')
          if 'gm-nav-cleanup-patch.js?v=gmnav-v1' not in html:
              raise SystemExit('gm-nav-cleanup cache sürümü gmnav-v1 olmalı')
          if 'gm-combat-v3-patch.js?v=gmcombat-v3' not in html:
              raise SystemExit('gm-combat-v3 cache sürümü gmcombat-v3 olmalı')
          if 'player-sheet-equipment-abilities-patch.js?v=psea-v2' not in html:
              raise SystemExit('player-sheet equipment cache sürümü psea-v2 olmalı')
          print('Source invariants OK')
          PY