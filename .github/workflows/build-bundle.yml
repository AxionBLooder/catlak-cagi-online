name: Build Browser App
on:
  push:
    paths:
      - 'live_*.txt'
      - 'ui-patch.js'
      - 'world-patch.js'
      - 'catalog.b64'
      - '.github/workflows/build-bundle.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install browser build dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund esbuild@0.25.9 @supabase/supabase-js@2.115.0

      - name: Normalize legacy source and prepare isolated browser source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          # Eski parçalı kaynakta aynı scope içinde iki kez tanımlanan app değişkenini kalıcı olarak temizle.
          p=Path('live_05.txt')
          s=p.read_text(encoding='utf-8')
          duplicate="\nconst app=document.querySelector('#app');\nasync function refresh()"
          if duplicate in s:
              s=s.replace(duplicate,"\nasync function refresh()",1)
              p.write_text(s,encoding='utf-8')

          files=[f'live_{i:02d}.txt' for i in range(9)]
          base=''.join(Path(name).read_text(encoding='utf-8') for name in files)
          ui=Path('ui-patch.js').read_text(encoding='utf-8')
          world=Path('world-patch.js').read_text(encoding='utf-8')

          remote="import{createClient}from'https://esm.sh/@supabase/supabase-js@2.115.0?bundle';"
          remote_spaced="import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.115.0?bundle';"
          sha=os.environ['SOURCE_SHA']
          catalog='https://cdn.jsdelivr.net/gh/AxionBLooder/catlak-cagi-online@'+sha+'/catalog.b64'

          def clean(src):
              src=src.replace(remote,'').replace(remote_spaced,'')
              src=src.replace('https://raw.githubusercontent.com/AxionBLooder/catlak-cagi-online/main/catalog.b64?raw=1',catalog)
              src=src.replace('https://raw.githubusercontent.com/AxionBLooder/catlak-cagi-online/main/catalog.b64',catalog)
              src=src.replace('https://cdn.jsdelivr.net/gh/AxionBLooder/catlak-cagi-online@main/catalog.b64',catalog)
              return src

          base=clean(base)
          ui=clean(ui)
          world=clean(world)

          Path('.build').mkdir(exist_ok=True)
          entry=(
              "import {createClient} from '@supabase/supabase-js';\n"
              "const __catlakBaseReady=(async()=>{\n"+base+"\n})();\n"
              "const __catlakUiReady=(async()=>{await __catlakBaseReady;\n"+ui+"\n})();\n"
              "const __catlakWorldReady=(async()=>{await __catlakUiReady;\n"+world+"\n})();\n"
              "__catlakWorldReady.catch((e)=>{console.error('CATLAK_BOOT',e);const a=document.querySelector('#app');if(a)a.innerHTML='<main style=\"padding:30px\"><h1>Çatlak Çağı</h1><p>Uygulama başlatılamadı.</p></main>';});\n"
          )
          Path('.build/entry.mjs').write_text(entry,encoding='utf-8')
          PY

      - name: Build single classic browser script
        run: |
          ./node_modules/.bin/esbuild .build/entry.mjs \
            --bundle \
            --platform=browser \
            --format=iife \
            --target=es2018 \
            --supported:template-literal=false \
            --charset=utf8 \
            --legal-comments=none \
            --outfile=browser-app.js

      - name: Static verification
        run: |
          node --check browser-app.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('browser-app.js').read_text(encoding='utf-8')
          checks={
            'template literal/backtick': '`' not in s,
            'esm.sh dependency': 'esm.sh/' not in s,
            'dynamic import': 'import(' not in s,
            'source module import': "from '@supabase" not in s and 'from "@supabase' not in s,
          }
          failed=[k for k,v in checks.items() if not v]
          if failed:
              raise SystemExit('Browser build verification failed: '+', '.join(failed))
          print('Static browser verification OK; bytes=',len(s.encode('utf-8')))
          PY

      - name: Browser smoke test
        run: |
          cat > smoke.html <<'EOF'
          <!doctype html><html lang="tr"><head><meta charset="utf-8"><title>Smoke</title></head><body><div id="app"></div><div id="toast" class="hidden"></div><script>window.addEventListener('error',function(e){document.documentElement.setAttribute('data-smoke-error',String(e.message||'error'));});</script><script src="./browser-app.js"></script></body></html>
          EOF
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/catlak-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            echo "Chrome binary not present on runner; static checks already passed."
            exit 0
          fi
          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=9000 --dump-dom http://127.0.0.1:4173/smoke.html >/tmp/catlak-dom.html 2>/tmp/catlak-chrome.log || true
          cat /tmp/catlak-chrome.log || true
          if grep -Eqi 'data-smoke-error="[^"]*(Missing \}|template expression|Invalid or unexpected token|Unexpected token|SyntaxError)' /tmp/catlak-dom.html; then
            cat /tmp/catlak-dom.html
            exit 1
          fi
          if grep -Eqi '(Missing \} in template expression|Invalid or unexpected token|Uncaught SyntaxError)' /tmp/catlak-chrome.log; then
            exit 1
          fi
          echo "Browser smoke test OK"

      - name: Write build manifest
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          b=Path('browser-app.js').read_bytes()
          Path('browser-build.json').write_text(json.dumps({
            'source_sha':os.environ['SOURCE_SHA'],
            'sha256':hashlib.sha256(b).hexdigest(),
            'bytes':len(b),
            'format':'iife-es2018-no-template-literals'
          },ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Commit verified browser artifacts and normalized source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live_05.txt browser-app.js browser-build.json
          if git diff --cached --quiet; then
            echo "Verified browser artifacts already up to date"
            exit 0
          fi
          git commit -m "Doğrulanmış browser app güncelle"
          git push
