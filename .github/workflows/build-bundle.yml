name: Build Browser App
on:
  push:
    paths:
      - 'live_*.txt'
      - 'ui-patch.js'
      - 'stability-patch.js'
      - 'gallery-quality-patch.js'
      - 'ux-patch.js'
      - 'nav-lite-patch.js'
      - 'simple-world-upload-patch.js'
      - 'catalog.b64'
      - '.github/workflows/build-bundle.yml'
  workflow_dispatch:
concurrency:
  group: catlak-browser-build-main
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Install browser build dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund esbuild@0.25.9 @supabase/supabase-js@2.115.0

      - name: Normalize source and prepare single-owner browser app
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          p=Path('live_05.txt')
          s=p.read_text(encoding='utf-8')
          duplicate="\nconst app=document.querySelector('#app');\nasync function refresh()"
          if duplicate in s:
              s=s.replace(duplicate,"\nasync function refresh()",1)
              p.write_text(s,encoding='utf-8')

          base=''.join(Path(f'live_{i:02d}.txt').read_text(encoding='utf-8') for i in range(9))
          ui=Path('ui-patch.js').read_text(encoding='utf-8')
          stability=Path('stability-patch.js').read_text(encoding='utf-8')
          quality=Path('gallery-quality-patch.js').read_text(encoding='utf-8')
          ux=Path('ux-patch.js').read_text(encoding='utf-8')
          nav=Path('nav-lite-patch.js').read_text(encoding='utf-8')
          simple=Path('simple-world-upload-patch.js').read_text(encoding='utf-8')

          remote="import{createClient}from'https://esm.sh/@supabase/supabase-js@2.115.0?bundle';"
          remote_spaced="import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.115.0?bundle';"
          sha=os.environ['SOURCE_SHA']
          catalog='https://cdn.jsdelivr.net/gh/AxionBLooder/catlak-cagi-online@'+sha+'/catalog.b64'

          def clean(src):
              src=src.replace(remote,'').replace(remote_spaced,'')
              src=src.replace('https://raw.githubusercontent.com/AxionBLooder/catlak-cagi-online/main/catalog.b64?raw=1',catalog)
              src=src.replace('https://raw.githubusercontent.com/AxionBLooder/catlak-cagi-online/main/catalog.b64',catalog)
              src=src.replace('https://cdn.jsdelivr.net/gh/AxionBLooder/catlak-cagi-online@main/catalog.b64',catalog)
              return src

          base,ui,stability,quality,ux,nav,simple=map(clean,(base,ui,stability,quality,ux,nav,simple))

          # Eski ayrıntılı GM canlı masa rendererını kapat.
          needle='async function renderLiveTable(){'
          if ui.count(needle)!=1:
              raise SystemExit('renderLiveTable beklenen biçimde bulunamadı')
          ui=ui.replace(needle,"async function renderLiveTable(){if(window.__catlakStableLiveOwner)return;",1)

          # Hazır Karakterler cevabı geç gelirse başka sekmenin üstüne yazmasın.
          prepared="if(error){main.dataset.ccPage='';toast(error.message);return}\n  main.innerHTML="
          if prepared not in ui:
              raise SystemExit('Hazır Karakterler async render kalıbı bulunamadı')
          ui=ui.replace(prepared,"if(error){main.dataset.ccPage='';toast(error.message);return}\n  if(!isGM()||tabId()!=='characters'){main.dataset.ccPage='';return}\n  main.innerHTML=",1)

          # Harita'ya geçerken eski GM ekranını ara kare olarak çizme.
          old="if(worldOn){const gm=CC_APP.querySelector('.nav [data-tab=\"gm\"]');if(gm)gm.click()}"
          new="if(worldOn){worldOn.classList.remove('on')}"
          if old not in stability:
              raise SystemExit('Harita geçişindeki eski gm.click kalıbı bulunamadı')
          stability=stability.replace(old,new,1)

          map_open="requestAnimationFrame(()=>{ccMapActive=true;ccEnsureMapNav();ccRenderMapPage(true)});return;"
          if map_open not in stability:
              raise SystemExit('Harita açılış kalıbı bulunamadı')
          stability=stability.replace(map_open,"window.__catlakRouteLoading?.('Harita');"+map_open,1)

          map_rows="if(mr.error)throw mr.error;if(nr.error)throw nr.error;\n    const maps=mr.data||[],npcs=nr.data||[],party=pr.data;"
          if map_rows not in stability:
              raise SystemExit('Harita sonuç kalıbı bulunamadı')
          stability=stability.replace(map_rows,"if(mr.error)throw mr.error;if(nr.error)throw nr.error;\n    if(!ccMapActive)return;\n    const maps=mr.data||[],npcs=nr.data||[],party=pr.data;",1)

          live_rows="if(cr.error)throw cr.error;if(rr.error)throw rr.error;\n    const chars=cr.data||[],ids=new Set(chars.map(c=>c.id)),rolls=(rr.data||[]).filter(r=>ids.has(r.character_id));"
          if live_rows not in stability:
              raise SystemExit('Canlı masa sonuç kalıbı bulunamadı')
          stability=stability.replace(live_rows,"if(cr.error)throw cr.error;if(rr.error)throw rr.error;\n    if(!ccIsGM()||ccMapActive||ccTab()!=='gm')return;\n    const chars=cr.data||[],ids=new Set(chars.map(c=>c.id)),rolls=(rr.data||[]).filter(r=>ids.has(r.character_id));",1)

          party_fetch="const {data,error}=await CC_S.from('catlak_party_visual').select('*').eq('singleton',true).maybeSingle();if(error||!data?.image_url)return;\n  const s=document.createElement('section');"
          if party_fetch not in stability:
              raise SystemExit('Parti görseli async kalıbı bulunamadı')
          stability=stability.replace(party_fetch,"const {data,error}=await CC_S.from('catlak_party_visual').select('*').eq('singleton',true).maybeSingle();if(error||!data?.image_url)return;\n  if(ccMapActive||ccTab()!=='sheet'||ccIsGM())return;\n  const currentMain=CC_APP.querySelector('main');if(!currentMain||currentMain!==main||currentMain.querySelector('[data-cc-party-visual-card]'))return;\n  const s=document.createElement('section');",1)

          Path('.build').mkdir(exist_ok=True)
          entry=(
              "import {createClient} from '@supabase/supabase-js';\n"
              "const __catlakBaseReady=(async()=>{\n"+base+"\nwindow.__catlakSupabase=S;\nwindow.__catlakStableLiveOwner=true;\n})();\n"
              "const __catlakUiReady=(async()=>{await __catlakBaseReady;\n"+ui+"\n})();\n"
              "const __catlakStabilityReady=(async()=>{await __catlakUiReady;\n"+stability+"\n})();\n"
              "const __catlakQualityReady=(async()=>{await __catlakStabilityReady;\n"+quality+"\n})();\n"
              "const __catlakUxReady=(async()=>{await __catlakQualityReady;\n"+ux+"\n})();\n"
              "const __catlakNavReady=(async()=>{await __catlakUxReady;\n"+nav+"\n})();\n"
              "const __catlakWorldReady=(async()=>{await __catlakNavReady;\n"+simple+"\n})();\n"
              "__catlakWorldReady.catch((e)=>{console.error('CATLAK_BOOT',e);const a=document.querySelector('#app');if(a)a.innerHTML='<main style=\"padding:30px\"><h1>Çatlak Çağı</h1><p>Uygulama başlatılamadı.</p></main>';});\n"
          )
          Path('.build/entry.mjs').write_text(entry,encoding='utf-8')
          PY

      - name: Build single classic browser script
        run: |
          ./node_modules/.bin/esbuild .build/entry.mjs \
            --bundle \
            --platform=browser \
            --format=iife \
            --target=es2018 \
            --supported:template-literal=false \
            --charset=utf8 \
            --legal-comments=none \
            --outfile=browser-app.js

      - name: Static verification
        run: |
          node --check browser-app.js
          node --check ui-patch.js
          node --check stability-patch.js
          node --check gallery-quality-patch.js
          node --check ux-patch.js
          node --check nav-lite-patch.js
          node --check simple-world-upload-patch.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('browser-app.js').read_text(encoding='utf-8')
          required=['Toplu Zar Sil','Partiye Yansıt','Stat Atölyesi','Hızlı Karakter Düzenleme','catlak_gm_update_character_sheet','Görsel Dosyası Seç','catlak-world-media','data-sw-upload','data-sw-delete','data-cc-world-tab','data-cc-map-tab','__catlakStableLiveOwner','__catlakRouteLoading']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('Üretim artifact özellikleri eksik: '+', '.join(missing))
          forbidden=['https://esm.sh/','GM • HARİTA EKLE','EVREN GÖRSELİ EKLE','ccx-unified-world',"if(gm)gm.click()"]
          found=[x for x in forbidden if x in s]
          if found: raise SystemExit('Eski/çakışan renderer üretimde kaldı: '+', '.join(found))
          print('Single-owner static verification OK; bytes=',len(s.encode('utf-8')))
          PY

      - name: Browser smoke test
        run: |
          cat > smoke.html <<'EOF'
          <!doctype html><html lang="tr"><head><meta charset="utf-8"><title>Smoke</title></head><body><div id="app"></div><div id="toast" class="hidden"></div><script>window.addEventListener('error',function(e){document.documentElement.setAttribute('data-smoke-error',String(e.message||'error'));});</script><script src="./browser-app.js"></script><script>setTimeout(function(){var a=document.querySelector('#app');if(!a)return;a.innerHTML='<div class="role">GM</div><div class="nav"><button class="on" data-tab="gm">Canlı Oyun Masası</button><button data-tab="characters">Hazır Karakterler</button><button data-tab="rules">Kaynaklar</button></div><main></main>';},2500);</script></body></html>
          EOF
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/catlak-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME" ]; then echo "Chrome binary missing; static checks passed."; exit 0; fi
          set +e
          timeout 35s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-background-networking --virtual-time-budget=7000 --dump-dom http://127.0.0.1:4173/smoke.html >/tmp/catlak-dom.html 2>/tmp/catlak-chrome.log
          STATUS=$?
          set -e
          cat /tmp/catlak-chrome.log || true
          if [ "$STATUS" -eq 124 ]; then echo 'Chrome smoke test zaman aşımına uğradı'; exit 1; fi
          if grep -Eqi 'data-smoke-error="[^"]*(Missing \}|template expression|Invalid or unexpected token|Unexpected token|SyntaxError)' /tmp/catlak-dom.html; then cat /tmp/catlak-dom.html; exit 1; fi
          grep -q 'data-cc-world-tab' /tmp/catlak-dom.html || { echo 'Görsel Arşivi nav oluşmadı'; exit 1; }
          grep -q 'data-cc-stats-tab' /tmp/catlak-dom.html || { echo 'Stat Atölyesi nav oluşmadı'; exit 1; }
          grep -q 'data-cc-map-tab' /tmp/catlak-dom.html || { echo 'Harita nav oluşmadı'; exit 1; }
          grep -q 'Görsel Arşivi' /tmp/catlak-dom.html || { echo 'Yeni Evren etiketi oluşmadı'; exit 1; }
          if grep -Eqi '(Missing \} in template expression|Invalid or unexpected token|Uncaught SyntaxError)' /tmp/catlak-chrome.log; then exit 1; fi
          echo "Browser smoke test OK"

      - name: Write build manifest
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          b=Path('browser-app.js').read_bytes()
          Path('browser-build.json').write_text(json.dumps({'source_sha':os.environ['SOURCE_SHA'],'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b),'format':'iife-es2018-browser-verified-single-owner'},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Commit verified browser artifacts and normalized source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live_05.txt browser-app.js browser-build.json
          if git diff --cached --quiet; then echo "Verified browser artifacts already up to date"; exit 0; fi
          git commit -m "Tek sahipli doğrulanmış browser app güncelle"
          git pull --rebase origin main
          git push
