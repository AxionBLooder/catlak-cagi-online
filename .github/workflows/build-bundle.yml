name: Build Browser App
on:
  push:
    paths:
      - 'live_*.txt'
      - 'ui-patch.js'
      - 'fixes-patch.js'
      - 'stability-patch.js'
      - 'world-extra-patch.js'
      - 'catalog.b64'
      - '.github/workflows/build-bundle.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install browser build dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund esbuild@0.25.9 @supabase/supabase-js@2.115.0

      - name: Normalize legacy source and prepare browser source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          p=Path('live_05.txt')
          s=p.read_text(encoding='utf-8')
          duplicate="\nconst app=document.querySelector('#app');\nasync function refresh()"
          if duplicate in s:
              s=s.replace(duplicate,"\nasync function refresh()",1)
              p.write_text(s,encoding='utf-8')

          files=[f'live_{i:02d}.txt' for i in range(9)]
          base=''.join(Path(name).read_text(encoding='utf-8') for name in files)
          ui=Path('ui-patch.js').read_text(encoding='utf-8')
          fixes=Path('fixes-patch.js').read_text(encoding='utf-8')
          stability=Path('stability-patch.js').read_text(encoding='utf-8')
          extra=Path('world-extra-patch.js').read_text(encoding='utf-8')

          remote="import{createClient}from'https://esm.sh/@supabase/supabase-js@2.115.0?bundle';"
          remote_spaced="import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.115.0?bundle';"
          sha=os.environ['SOURCE_SHA']
          catalog='https://cdn.jsdelivr.net/gh/AxionBLooder/catlak-cagi-online@'+sha+'/catalog.b64'

          def clean(src):
              src=src.replace(remote,'').replace(remote_spaced,'')
              src=src.replace('https://raw.githubusercontent.com/AxionBLooder/catlak-cagi-online/main/catalog.b64?raw=1',catalog)
              src=src.replace('https://raw.githubusercontent.com/AxionBLooder/catlak-cagi-online/main/catalog.b64',catalog)
              src=src.replace('https://cdn.jsdelivr.net/gh/AxionBLooder/catlak-cagi-online@main/catalog.b64',catalog)
              return src

          base,ui,fixes,stability,extra=map(clean,(base,ui,fixes,stability,extra))

          # GM canlı masasının tek sahibi stability katmanı olsun.
          needle='async function renderLiveTable(){'
          if ui.count(needle)!=1:
              raise SystemExit('renderLiveTable beklenen biçimde bulunamadı')
          ui=ui.replace(needle,"async function renderLiveTable(){if(window.__catlakStableLiveOwner)return;",1)

          # Harita'ya geçerken eski ara GM tıklamasını tamamen kaldır.
          old="if(worldOn){const gm=CC_APP.querySelector('.nav [data-tab=\"gm\"]');if(gm)gm.click()}"
          new="if(worldOn){worldOn.classList.remove('on')}"
          if old not in stability:
              raise SystemExit('Harita geçişindeki eski gm.click kalıbı bulunamadı')
          stability=stability.replace(old,new,1)

          Path('.build').mkdir(exist_ok=True)
          entry=(
              "import {createClient} from '@supabase/supabase-js';\n"
              "const __catlakBaseReady=(async()=>{\n"+base+"\nwindow.__catlakSupabase=S;\nwindow.__catlakStableLiveOwner=true;\n})();\n"
              "const __catlakUiReady=(async()=>{await __catlakBaseReady;\n"+ui+"\n})();\n"
              "const __catlakFixesReady=(async()=>{await __catlakUiReady;\n"+fixes+"\n})();\n"
              "const __catlakStabilityReady=(async()=>{await __catlakFixesReady;\n"+stability+"\n})();\n"
              "const __catlakExtraReady=(async()=>{await __catlakStabilityReady;\n"+extra+"\n})();\n"
              "__catlakExtraReady.catch((e)=>{console.error('CATLAK_BOOT',e);const a=document.querySelector('#app');if(a)a.innerHTML='<main style=\"padding:30px\"><h1>Çatlak Çağı</h1><p>Uygulama başlatılamadı.</p></main>';});\n"
          )
          Path('.build/entry.mjs').write_text(entry,encoding='utf-8')
          PY

      - name: Build single classic browser script
        run: |
          ./node_modules/.bin/esbuild .build/entry.mjs \
            --bundle \
            --platform=browser \
            --format=iife \
            --target=es2018 \
            --supported:template-literal=false \
            --charset=utf8 \
            --legal-comments=none \
            --outfile=browser-app.js

      - name: Static verification
        run: |
          node --check browser-app.js
          node --check fixes-patch.js
          node --check stability-patch.js
          node --check world-extra-patch.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('browser-app.js').read_text(encoding='utf-8')
          if 'https://esm.sh/' in s:
              raise SystemExit('Harici esm.sh bağımlılığı browser artifact içinde kaldı')
          required=['Toplu Zar Sil','Partiye Yansıt','Stat Atölyesi','catlak_gm_update_character_sheet','EVREN GÖRSELLERİ','data-ccx-delete','ccx-media-frame','__catlakStableLiveOwner']
          missing=[x for x in required if x not in s]
          if missing:
              raise SystemExit('Yeni özellikler artifact içinde eksik: '+', '.join(missing))
          if "if(gm)gm.click()" in s:
              raise SystemExit('Eski çift-render gm.click kalıbı artifact içinde kaldı')
          if 'GM • HARİTA EKLE' in s:
              raise SystemExit('Eski world-patch rendererı hâlâ artifact içinde')
          print('Static browser verification OK; bytes=',len(s.encode('utf-8')))
          PY

      - name: Browser smoke test
        run: |
          cat > smoke.html <<'EOF'
          <!doctype html><html lang="tr"><head><meta charset="utf-8"><title>Smoke</title></head><body><div id="app"></div><div id="toast" class="hidden"></div><script>window.addEventListener('error',function(e){document.documentElement.setAttribute('data-smoke-error',String(e.message||'error'));});</script><script src="./browser-app.js"></script><script>setTimeout(function(){var a=document.querySelector('#app');if(!a)return;a.innerHTML='<div class="role">GM</div><div class="nav"><button class="on" data-tab="gm">Canlı Oyun Masası</button><button data-tab="characters">Hazır Karakterler</button><button data-tab="rules">Kaynaklar</button></div><main></main>';},5000);</script></body></html>
          EOF
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/catlak-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME" ]; then echo "Chrome binary missing; static checks passed."; exit 0; fi
          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=10000 --dump-dom http://127.0.0.1:4173/smoke.html >/tmp/catlak-dom.html 2>/tmp/catlak-chrome.log || true
          cat /tmp/catlak-chrome.log || true
          if grep -Eqi 'data-smoke-error="[^"]*(Missing \}|template expression|Invalid or unexpected token|Unexpected token|SyntaxError)' /tmp/catlak-dom.html; then cat /tmp/catlak-dom.html; exit 1; fi
          grep -q 'data-cc-world-tab' /tmp/catlak-dom.html || { echo 'Evren nav oluşmadı'; exit 1; }
          grep -q 'data-cc-stats-tab' /tmp/catlak-dom.html || { echo 'Stat Atölyesi nav oluşmadı'; exit 1; }
          if grep -Eqi '(Missing \} in template expression|Invalid or unexpected token|Uncaught SyntaxError)' /tmp/catlak-chrome.log; then exit 1; fi
          echo "Browser smoke test OK"

      - name: Write build manifest
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          b=Path('browser-app.js').read_bytes()
          Path('browser-build.json').write_text(json.dumps({'source_sha':os.environ['SOURCE_SHA'],'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b),'format':'iife-es2018-browser-verified'},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Commit verified browser artifacts and normalized source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live_05.txt browser-app.js browser-build.json
          if git diff --cached --quiet; then echo "Verified browser artifacts already up to date"; exit 0; fi
          git commit -m "Doğrulanmış browser app güncelle"
          git push
