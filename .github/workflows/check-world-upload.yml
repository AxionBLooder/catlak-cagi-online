name: Check World Upload
on:
  push:
    paths:
      - 'simple-world-upload-patch.js'
      - 'browser-app.js'
      - 'index.html'
      - '.github/workflows/check-world-upload.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - name: Syntax and bundled wiring checks
        run: |
          set -euo pipefail
          node --check simple-world-upload-patch.js
          node --check browser-app.js
          grep -q 'catlak-world-media' simple-world-upload-patch.js
          grep -q 'type="file"' simple-world-upload-patch.js
          grep -q 'Partiye Yansıt' simple-world-upload-patch.js
          grep -q 'catlak-world-media' browser-app.js
          grep -q 'Partiye Yansıt' browser-app.js
          echo 'World upload bundled checks OK'
      - name: Open permanent Pages site in Chrome
        env:
          LIVE_URL: https://axionblooder.github.io/catlak-cagi-online/
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 2 "${LIVE_URL}?world-smoke=$(date +%s)" -o /tmp/index.html
          curl -fsSL --retry 5 --retry-delay 2 "${LIVE_URL}browser-app.js?world-smoke=$(date +%s)" -o /tmp/app.js
          node --check /tmp/app.js
          grep -q 'catlak-world-media' /tmp/app.js
          grep -q 'Partiye Yansıt' /tmp/app.js
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=12000 --dump-dom "${LIVE_URL}?world-browser-smoke=$(date +%s)" >/tmp/live-dom.html 2>/tmp/live-chrome.log || true
          cat /tmp/live-chrome.log || true
          if grep -Eqi '(Invalid or unexpected token|Uncaught SyntaxError|Missing \} in template expression|Uygulama başlatılamadı|Site yüklenemedi)' /tmp/live-dom.html /tmp/live-chrome.log; then exit 1; fi
          grep -Eqi '(Giriş Yap|Hesap Aç|TEK EVREN)' /tmp/live-dom.html || { echo 'Auth ekranı oluşmadı'; exit 1; }
          echo 'Permanent Pages world-upload smoke OK'
