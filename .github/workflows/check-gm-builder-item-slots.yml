name: Check GM Builder and Item Slots
on:
  push:
    paths:
      - 'gm-clean-router-v1.js'
      - 'item-system-patch.js'
      - 'index.html'
      - '.github/workflows/check-gm-builder-item-slots.yml'
  workflow_dispatch:

jobs:
  gm-builder-item-slots:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Static checks
        run: |
          set -euo pipefail
          node --check gm-clean-router-v1.js
          node --check item-system-patch.js
          grep -Fq 'gmcNativeBridge' gm-clean-router-v1.js
          grep -Fq 'item-system-v5-direct-slots' index.html
          ! grep -Fq "gm-item-slot-patch.js?v=" index.html
          grep -Fq "function iwAllowedSlots" item-system-patch.js
          grep -Fq "id=\"iw-give-slot\"" item-system-patch.js
      - name: Install browser driver
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright-core
      - name: Browser regression
        run: |
          cat > gm-builder-item-slots-smoke.cjs <<'JS'
          const {chromium}=require('playwright-core');
          const {execFileSync}=require('child_process');
          const path=require('path');
          function chromePath(){
            for(const c of ['google-chrome','google-chrome-stable','chromium']){
              try{const p=execFileSync('bash',['-lc',`command -v ${c}`],{encoding:'utf8'}).trim();if(p)return p}catch{}
            }
            throw new Error('Chrome missing');
          }
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:chromePath(),args:['--no-sandbox']});
            try{
              const page=await browser.newPage();page.setDefaultTimeout(7000);
              await page.setContent(`<!doctype html><meta charset="utf-8"><style>.hidden{display:none}</style>
                <div id="app"><span class="role">GM</span><nav class="nav"><button class="on" data-tab="items">Eşya</button></nav><main></main></div>
                <div id="toast" class="hidden"></div>`);
              await page.evaluate(()=>{
                window.__catlakGmCleanRoute='items';
                window.__rpcCalls=[];
                const db={
                  catlak_items:[
                    {id:'w1',name:'Kılıç',item_type:'weapon',effects:{},created_at:'2026-01-01'},
                    {id:'a1',name:'Zırh',item_type:'armor',effects:{},created_at:'2026-01-02'},
                    {id:'x1',name:'Tılsım',item_type:'item',effects:{item_mode:'accessory'},created_at:'2026-01-03'}
                  ],
                  catlak_characters:[{id:'c1',name:'Eeliot',play_status:'active',owner_id:'u1',created_at:'2026-01-01'}],
                  catlak_inventory:[{id:'inv1',character_id:'c1',item_id:'a1',quantity:1,equipped:false,equipped_slot:null,granted_at:'2026-01-01'}],
                  catlak_item_gm_notes:[]
                };
                function query(table){
                  const st={eq:[],ins:[],single:false,lim:null};
                  const q={
                    select(){return q},eq(k,v){st.eq.push([k,v]);return q},in(k,v){st.ins.push([k,v]);return q},order(){return q},limit(n){st.lim=n;return q},
                    maybeSingle(){st.single=true;return q},single(){st.single=true;return q},upsert(){return q},update(){return q},insert(){return q},delete(){return q},
                    then(ok,bad){
                      let data=(db[table]||[]).slice();
                      for(const [k,v] of st.eq)data=data.filter(x=>String(x?.[k])===String(v));
                      for(const [k,v] of st.ins)data=data.filter(x=>v.map(String).includes(String(x?.[k])));
                      if(st.lim!=null)data=data.slice(0,st.lim);
                      if(st.single)data=data[0]||null;
                      return Promise.resolve({data,error:null}).then(ok,bad)
                    }
                  };return q
                }
                const channel={on(){return channel},subscribe(){return channel}};
                window.__catlakSupabase={
                  from:query,channel:()=>channel,
                  rpc:async(name,args)=>{
                    window.__rpcCalls.push({name,args});
                    if(name==='catlak_gm_give_item')return{data:1,error:null};
                    if(name==='catlak_set_equipped_slot')return{data:true,error:null};
                    return{data:null,error:null}
                  }
                };
              });
              await page.addScriptTag({path:path.resolve('item-system-patch.js')});
              await page.waitForSelector('#iw-give-slot');

              let out=await page.evaluate(()=>({values:[...document.querySelectorAll('#iw-give-slot option')].map(o=>o.value),selected:document.querySelector('#iw-give-slot').value}));
              if(JSON.stringify(out.values)!==JSON.stringify(['','main_weapon','off_weapon'])||out.selected!=='main_weapon')throw new Error('WEAPON_SLOTS '+JSON.stringify(out));

              await page.selectOption('#iw-give-item','a1');
              await page.waitForFunction(()=>document.querySelector('#iw-give-slot')?.value==='armor');
              out=await page.evaluate(()=>({values:[...document.querySelectorAll('#iw-give-slot option')].map(o=>o.value),selected:document.querySelector('#iw-give-slot').value}));
              if(JSON.stringify(out.values)!==JSON.stringify(['','armor'])||out.selected!=='armor')throw new Error('ARMOR_SLOTS '+JSON.stringify(out));

              await page.selectOption('#iw-give-item','x1');
              await page.waitForFunction(()=>document.querySelector('#iw-give-slot')?.value==='accessory_1');
              out=await page.evaluate(()=>({values:[...document.querySelectorAll('#iw-give-slot option')].map(o=>o.value),selected:document.querySelector('#iw-give-slot').value}));
              if(JSON.stringify(out.values)!==JSON.stringify(['','accessory_1','accessory_2'])||out.selected!=='accessory_1')throw new Error('ACCESSORY_SLOTS '+JSON.stringify(out));

              await page.selectOption('#iw-give-item','a1');
              await page.waitForFunction(()=>document.querySelector('#iw-give-slot')?.value==='armor');
              await page.locator('[data-iw-give]').click();
              await page.waitForFunction(()=>window.__rpcCalls.some(x=>x.name==='catlak_set_equipped_slot'&&x.args.p_slot==='armor'));
              console.log('GM_DIRECT_ITEM_SLOTS_OK',JSON.stringify(await page.evaluate(()=>window.__rpcCalls)));
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node gm-builder-item-slots-smoke.cjs
