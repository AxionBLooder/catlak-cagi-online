name: Check Vercel Site
on:
  push:
    paths:
      - '.github/workflows/check-vercel-site.yml'
  workflow_dispatch:
concurrency:
  group: catlak-vercel-site-check
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Install browser driver
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright-core
      - name: Verify public Vercel deployment
        env:
          LIVE_URL: https://catlak-cagi-online-public-ot9upme2e-canr3556-5365.vercel.app/
        run: |
          cat > .check-vercel.cjs <<'JS'
          const { chromium }=require('playwright-core');
          const { execFileSync }=require('child_process');
          (async()=>{
            let exe='';
            for(const cmd of ['google-chrome','google-chrome-stable','chromium']){
              try{exe=execFileSync('bash',['-lc',`command -v ${cmd}`],{encoding:'utf8'}).trim();if(exe)break}catch{}
            }
            if(!exe)throw new Error('Chrome binary missing');
            const browser=await chromium.launch({headless:true,executablePath:exe,args:['--no-sandbox','--disable-gpu']});
            const page=await browser.newPage();
            try{
              const response=await page.goto(process.env.LIVE_URL,{waitUntil:'domcontentloaded',timeout:30000});
              const body=(await page.locator('body').innerText().catch(()=>'' )).replace(/\s+/g,' ').trim();
              console.log('NAV_STATUS:',response?.status());
              console.log('FINAL_URL:',page.url());
              console.log('TITLE:',await page.title());
              console.log('BODY:',body.slice(0,1000));
              if(/vercel\.com\/login/.test(page.url()))throw new Error('Deployment hâlâ Vercel Authentication ile korunuyor');
              if(!body.includes('test'))throw new Error('Public test içeriği görünmedi');
              console.log('VERCEL PUBLIC ACCESS OK');
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node .check-vercel.cjs
