name: Check Vercel Site
on:
  push:
    paths:
      - '.github/workflows/check-vercel-site.yml'
  workflow_dispatch:
concurrency:
  group: catlak-vercel-site-check
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Install browser driver
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright-core
      - name: Open Vercel production with Chrome
        env:
          LIVE_URL: https://catlak-cagi-online-xw08f859u-canr3556-5365.vercel.app/
        run: |
          cat > .check-vercel.cjs <<'JS'
          const { chromium }=require('playwright-core');
          const { execFileSync }=require('child_process');
          (async()=>{
            let exe='';
            for(const cmd of ['google-chrome','google-chrome-stable','chromium']){
              try{exe=execFileSync('bash',['-lc',`command -v ${cmd}`],{encoding:'utf8'}).trim();if(exe)break}catch{}
            }
            if(!exe)throw new Error('Chrome binary missing');
            const browser=await chromium.launch({headless:true,executablePath:exe,args:['--no-sandbox','--disable-gpu']});
            const page=await browser.newPage();
            const pageErrors=[],httpErrors=[],requestFailures=[],consoleErrors=[];
            page.on('pageerror',e=>pageErrors.push(String(e.message||e)));
            page.on('response',r=>{if(r.status()>=400)httpErrors.push(`${r.status()} ${r.url()}`)});
            page.on('requestfailed',r=>requestFailures.push(`${r.url()} :: ${r.failure()?.errorText||'failed'}`));
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            try{
              const started=Date.now();
              const response=await page.goto(process.env.LIVE_URL,{waitUntil:'domcontentloaded',timeout:30000});
              console.log('NAV_STATUS:',response?.status());
              console.log('FINAL_URL:',page.url());
              console.log('TITLE:',await page.title());
              console.log('EARLY_BODY:',(await page.locator('body').innerText().catch(()=>'' )).replace(/\s+/g,' ').slice(0,1200));
              console.log('EARLY_HTTP_ERRORS:',JSON.stringify(httpErrors));
              console.log('EARLY_REQUEST_FAILURES:',JSON.stringify(requestFailures));
              console.log('EARLY_CONSOLE_ERRORS:',JSON.stringify(consoleErrors));
              await page.waitForFunction(()=>{
                const t=document.querySelector('#app')?.textContent||'';
                return t.includes('Giriş Yap')||t.includes('Hesap Aç')||t.includes('TEK EVREN');
              },{timeout:30000});
              const elapsed=Date.now()-started;
              const text=(await page.locator('#app').innerText()).replace(/\s+/g,' ').trim();
              console.log('VERCEL_LOAD_MS:',elapsed);
              console.log('APP_TEXT:',text.slice(0,1200));
              console.log('HTTP_ERRORS:',JSON.stringify(httpErrors));
              console.log('REQUEST_FAILURES:',JSON.stringify(requestFailures));
              console.log('PAGE_ERRORS:',JSON.stringify(pageErrors));
              if(pageErrors.some(x=>/SyntaxError|Invalid or unexpected token|Unexpected token/i.test(x)))throw new Error('Browser syntax error');
              console.log('VERCEL LIVE PAGE OK');
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node .check-vercel.cjs
