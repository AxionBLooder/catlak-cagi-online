name: Check Invite Gateway
on:
  push:
    paths:
      - '.github/workflows/check-invite-gateway.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Install browser driver
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright-core
      - name: Verify v8 gateway and PageShare migration shell
        run: |
          set -euo pipefail
          BASE='https://ygbereitlhjvoqgqlwfe.supabase.co/functions/v1/catlak-cagi'
          HASH='6ca0f3381e8f'
          PAGE='https://hidden-spring-7923.hosted.pageshare.ai/'
          curl -fsSL --retry 3 "$BASE?verify=$(date +%s)" -o /tmp/gateway.html
          grep -q 'asset=app' /tmp/gateway.html
          grep -q "$HASH" /tmp/gateway.html
          curl -fsSL --retry 3 "$BASE?asset=app&v=$HASH&verify=$(date +%s)" -o /tmp/app.js
          node --check /tmp/app.js
          test "$(wc -c < /tmp/app.js)" -gt 300000
          grep -q 'catlak-cagi-online.netlify.app/?join=' /tmp/app.js
          grep -q 'Kalıcı Siteye Geç' /tmp/app.js
          grep -q 'catlak-transfer-ready' /tmp/app.js
          curl -fsSL --retry 3 "$PAGE?verify=$(date +%s)" -o /tmp/pageshare.html
          grep -q 'functions/v1/catlak-cagi?asset=app' /tmp/pageshare.html
          grep -q "$HASH" /tmp/pageshare.html
          echo 'GATEWAY_AND_PAGESHARE_MIGRATION_STATIC_OK'
      - name: Open gateway and PageShare in Chrome
        run: |
          cat > .check-invite.cjs <<'JS'
          const { chromium }=require('playwright-core');
          const { execFileSync }=require('child_process');
          (async()=>{
            let exe='';
            for(const cmd of ['google-chrome','google-chrome-stable','chromium']){try{exe=execFileSync('bash',['-lc',`command -v ${cmd}`],{encoding:'utf8'}).trim();if(exe)break}catch{}}
            if(!exe)throw new Error('Chrome binary missing');
            const browser=await chromium.launch({headless:true,executablePath:exe,args:['--no-sandbox','--disable-gpu']});
            try{
              for(const base of ['https://ygbereitlhjvoqgqlwfe.supabase.co/functions/v1/catlak-cagi','https://hidden-spring-7923.hosted.pageshare.ai/']){
                const page=await browser.newPage();
                const errs=[],fails=[];
                page.on('pageerror',e=>errs.push(String(e.message||e)));
                page.on('requestfailed',r=>fails.push(`${r.url()} :: ${r.failure()?.errorText||'failed'}`));
                const r=await page.goto(base,{waitUntil:'domcontentloaded',timeout:30000});
                await page.waitForFunction(()=>{const t=document.querySelector('#app')?.textContent||'';return t.includes('Giriş Yap')&&t.includes('E-posta')},{timeout:18000});
                const text=await page.locator('#app').innerText();
                console.log('URL:',base,'STATUS:',r?.status(),'TEXT:',text.slice(0,220));
                if(r?.status()!==200)throw new Error('Document status '+r?.status()+' '+base);
                if(errs.length||fails.length)throw new Error('Browser errors '+base+': '+JSON.stringify({errs,fails}));
                await page.close();
              }
              console.log('GATEWAY_AND_PAGESHARE_BROWSER_OK');
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node .check-invite.cjs
