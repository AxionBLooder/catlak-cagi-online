name: Check Invite Gateway
on:
  push:
    paths:
      - '.github/workflows/check-invite-gateway.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
      - name: Verify v8 gateway bundle
        run: |
          set -euo pipefail
          BASE='https://ygbereitlhjvoqgqlwfe.supabase.co/functions/v1/catlak-cagi'
          HASH='6ca0f3381e8f'
          curl -fsSL --retry 3 "$BASE?verify=$(date +%s)" -o /tmp/gateway.html
          grep -q 'asset=app' /tmp/gateway.html
          grep -q "$HASH" /tmp/gateway.html
          curl -fsSL --retry 3 "$BASE?asset=app&v=$HASH&verify=$(date +%s)" -o /tmp/app.js
          node --check /tmp/app.js
          test "$(wc -c < /tmp/app.js)" -gt 300000
          grep -q 'catlak-cagi-online.netlify.app/?join=' /tmp/app.js
          grep -q 'Kalıcı Siteye Geç' /tmp/app.js
          grep -q 'catlak-transfer-ready' /tmp/app.js
          echo 'GATEWAY_V8_STATIC_OK'
      - name: Open permanent gateway player entry in Chrome
        run: |
          set -euo pipefail
          BASE='https://ygbereitlhjvoqgqlwfe.supabase.co/functions/v1/catlak-cagi'
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          set +e
          timeout 40s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-background-networking --virtual-time-budget=18000 --dump-dom "$BASE?join=CHAR-INVALID-SMOKE-ONLY" >/tmp/dom.html 2>/tmp/chrome.log
          STATUS=$?
          set -e
          echo "CHROME_STATUS=$STATUS"
          grep -Ei 'net::ERR|Uncaught|SyntaxError' /tmp/chrome.log | tail -80 || true
          echo '--- GATEWAY MARKERS ---'
          grep -o 'Karakter daveti kullanılmış veya süresi dolmuş\|Giriş Yap\|Çatlak Çağı' /tmp/dom.html | sort -u || true
          test "$STATUS" -eq 0
          grep -q 'Çatlak Çağı' /tmp/dom.html
          grep -q 'Karakter daveti kullanılmış veya süresi dolmuş' /tmp/dom.html
          echo 'PERMANENT_GATEWAY_PLAYER_ENTRY_OK'
