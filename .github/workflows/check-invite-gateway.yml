name: Check Invite Gateway
on:
  push:
    paths:
      - '.github/workflows/check-invite-gateway.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
      - name: Inspect gateway response headers
        run: |
          set -euo pipefail
          BASE='https://ygbereitlhjvoqgqlwfe.supabase.co/functions/v1/catlak-cagi'
          curl -fsSL --retry 3 -D /tmp/gateway.headers "$BASE?join=CHAR-INVALID-SMOKE-ONLY&verify=$(date +%s)" -o /tmp/gateway.html
          echo '--- RESPONSE HEADERS ---'
          cat /tmp/gateway.headers
          echo '--- CONTENT TYPE ---'
          grep -i '^content-type:' /tmp/gateway.headers || true
          echo '--- BODY PREFIX ---'
          head -c 500 /tmp/gateway.html
          echo
          grep -q '<!doctype html>' /tmp/gateway.html
      - name: Verify v8 gateway bundle
        run: |
          set -euo pipefail
          BASE='https://ygbereitlhjvoqgqlwfe.supabase.co/functions/v1/catlak-cagi'
          HASH='6ca0f3381e8f'
          curl -fsSL --retry 3 "$BASE?asset=app&v=$HASH&verify=$(date +%s)" -o /tmp/app.js
          node --check /tmp/app.js
          test "$(wc -c < /tmp/app.js)" -gt 300000
          echo 'GATEWAY_V8_STATIC_OK'
