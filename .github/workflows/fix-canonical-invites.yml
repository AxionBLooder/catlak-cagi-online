name: Fix Canonical Invites
on:
  push:
    paths:
      - '.github/workflows/fix-canonical-invites.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pin all invite links to Supabase gateway
        run: |
          python3 - <<'PY'
          from pathlib import Path
          old_base='https://hidden-spring-7923.hosted.pageshare.ai/'
          new_base='https://ygbereitlhjvoqgqlwfe.supabase.co/functions/v1/catlak-cagi'

          p=Path('ui-patch.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace(old_base+'?join=',new_base+'?join=')
          s=s.replace("window.location.origin+window.location.pathname+'?join='",repr(new_base+'?join=')+'+')
          if new_base+'?join=' not in s:
              raise SystemExit('ui-patch Supabase invite gateway replacement missing')
          p.write_text(s,encoding='utf-8')

          p=Path('live_06.txt')
          s=p.read_text(encoding='utf-8')
          s=s.replace("const CATLAK_PUBLIC_BASE='https://hidden-spring-7923.hosted.pageshare.ai/';",f"const CATLAK_PUBLIC_BASE='{new_base}';")
          s=s.replace("emailRedirectTo:window.location.origin+window.location.pathname","emailRedirectTo:CATLAK_PUBLIC_BASE")
          s=s.replace("let link=window.location.origin+window.location.pathname+'?join='+encodeURIComponent(data)","let link=CATLAK_PUBLIC_BASE+'?join='+encodeURIComponent(data)")
          if new_base not in s:
              raise SystemExit('live_06 Supabase invite gateway replacement missing')
          if s.count("CATLAK_PUBLIC_BASE+'?join='+encodeURIComponent(data)") < 2:
              raise SystemExit('normal and prepared invite replacements missing')
          p.write_text(s,encoding='utf-8')

          p=Path('.github/workflows/build-bundle.yml')
          s=p.read_text(encoding='utf-8')
          s=s.replace('hidden-spring-7923.hosted.pageshare.ai/?join=','ygbereitlhjvoqgqlwfe.supabase.co/functions/v1/catlak-cagi?join=')
          if 'ygbereitlhjvoqgqlwfe.supabase.co/functions/v1/catlak-cagi?join=' not in s:
              raise SystemExit('production static marker replacement missing')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate syntax and gateway markers
        run: |
          node --check ui-patch.js
          cat live_00.txt live_01.txt live_02.txt live_03.txt live_04.txt live_05.txt live_06.txt live_07.txt live_08.txt > /tmp/base.js
          node --check /tmp/base.js
          grep -q "ygbereitlhjvoqgqlwfe.supabase.co/functions/v1/catlak-cagi" ui-patch.js
          grep -q "ygbereitlhjvoqgqlwfe.supabase.co/functions/v1/catlak-cagi" live_06.txt
          grep -q "ygbereitlhjvoqgqlwfe.supabase.co/functions/v1/catlak-cagi?join=" .github/workflows/build-bundle.yml
      - name: Commit Supabase invite gateway
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui-patch.js live_06.txt .github/workflows/build-bundle.yml
          if git diff --cached --quiet; then echo 'Already fixed'; else
            git commit -m "Production davet testini Supabase gateway'e geçir"
            git pull --rebase origin main
            git push
          fi
      - name: Rebuild production browser app
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-bundle.yml --ref main
