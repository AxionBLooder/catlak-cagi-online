name: Deploy Netlify via Proxy
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'browser-app.js'
      - 'catalog.b64'
      - '.github/workflows/deploy-netlify-via-proxy.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: catlak-netlify-production
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Prepare production package
        run: |
          mkdir -p netlify-site
          cp index.html browser-app.js catalog.b64 netlify-site/
          touch netlify-site/.nojekyll
          node --check netlify-site/browser-app.js
      - name: Deploy to Netlify production
        working-directory: netlify-site
        run: |
          npx -y @netlify/mcp@latest \
            --site-id f08d5c89-8c67-470c-9a35-013839260f6d \
            --proxy-path "https://netlify-mcp.netlify.app/proxy/eyJhbGciOiJkaXIiLCJlbmMiOiJBMjU2R0NNIn0..fqcPh8jF7Kt5Q0rj.I1-oHr8FzEPqGmjfaRHvW4KZHUOScATKGdLPcJl6p4gpAHPscj5T_7X-SdgpZoysAp_G-lANvMIj6xmc_2mxcPaH7WRO60x9uv3hyFAtbVMbFtHZ74Uddl1BKFlJUzAfFGrohPV8qsdFpn6qFXJP1Tfm_wuGZhl1GNqUhA-ZaoXDc3eENHtQ0_UplgO-qKyoQYqUzrp4fTQ2gzufe5lWp5v8VpDNRhMeJvBFSTnREslwKRT2i8oCAzZ78tsBbmNCDVvvU3B79fPa7LXqp4y0y08rA5qS2-0SB9P4FFeeXZpuHT79fM9k_Q0mqQ_Sg75_E6uftZLOzjd3sTZEpXaSd_4gBWF3lI-XPgYvclC6UzSL3-_hSXGgGZIF0je6hidj_eV-CPEd.aLATgVk1MEjJNJGhgdCENw" \
            --no-wait
