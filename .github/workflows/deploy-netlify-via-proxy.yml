name: Deploy Netlify via Proxy
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'browser-app.js'
      - 'catalog.b64'
      - '.github/workflows/deploy-netlify-via-proxy.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: catlak-netlify-production
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Prepare production package
        run: |
          mkdir -p netlify-site
          cp index.html browser-app.js catalog.b64 netlify-site/
          touch netlify-site/.nojekyll
          node --check netlify-site/browser-app.js
      - name: Deploy to Netlify production
        working-directory: netlify-site
        run: |
          npx -y @netlify/mcp@latest \
            --site-id f08d5c89-8c67-470c-9a35-013839260f6d \
            --proxy-path "https://netlify-mcp.netlify.app/proxy/eyJhbGciOiJkaXIiLCJlbmMiOiJBMjU2R0NNIn0..kpGFMhsL3UOvqa4g.5QMRWaxg_ZLsUojvu1cJ2nL7eJGXmLB3tUdpKVuhXvFjieRCLez5CNgp7z21zIuJa3mGu4p6aNGMi-O8x-OXNsXxKoYuuVCdq-mJ85xFUbT-0pGP3zGGpLUOFPuZIlRV_eDZFnMHw18Slq0m2AEtWBjz114kYPiNtuxGS871ftcqnw8Ej-dQnCjLJ-vk6CUc1YnsKSekvKrIY-Ps1HamWwdMV4ijk1SYu8zVgnv7FzGPP7g-2cGu6sGsfcys4kZ_kuAaAbjJzBaFaKJUlpeMsTvXtol6nE7E0y0ojcH04nRsLp7KZBOO2pgEVgW6Nn00GAYcrBJ6GggS_la7PwwHrFju9qAFPWl5wBS1YyFlbIoDK9wH6RIbmXetHrOGf9jUsmg9zX1-.A7e9oFK8wflwaGu5Xn_qTQ" \
            --no-wait
