name: Debug Stat Click
on:
  push:
    paths:
      - '.github/workflows/debug-stat-click.yml'
      - 'ux-patch.js'
      - 'site-stability-patch.js'
      - 'stat-editor-hardfix.js'
  workflow_dispatch:
jobs:
  click:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright-core
      - name: Real stat edit and character switch test
        run: |
          cat > stat-click.html <<'EOF'
          <!doctype html><html><body><div id="app"><header><span class="role">GM</span></header><nav class="nav"><button class="on" data-cc-stats-tab>Stat Atölyesi</button></nav><main></main></div><div id="toast" class="hidden"></div><script>
          window.__db=[
            {id:'c1',name:'Gohin',species_name:'Elf',background_name:'Gezgin',class_name:'Savaşçı',play_status:'active',base_stats:{STR:10,DEX:11,CON:12,INT:13,WIS:14,CHA:15},hp_current:10,hp_max:12,base_ac:13,base_speed:30,level:2,created_at:'1'},
            {id:'c2',name:'Eeliot',species_name:'İnsan',background_name:'Bilgin',class_name:'Büyücü',play_status:'prepared',base_stats:{STR:8,DEX:12,CON:10,INT:18,WIS:15,CHA:11},hp_current:8,hp_max:10,base_ac:12,base_speed:30,level:3,created_at:'2'}
          ];
          function chars(){const chain={select(){return chain},in(){return chain},order(){return chain},then(ok,bad){return Promise.resolve({data:window.__db.map(x=>structuredClone(x)),error:null}).then(ok,bad)}};return chain}
          window.__catlakSupabase={from:t=>chars(),rpc:async()=>({data:true,error:null}),channel:()=>({on(){return this},subscribe(){return this}})};
          </script><script src="./stat-editor-hardfix.js"></script><script src="./ux-patch.js"></script><script src="./site-stability-patch.js"></script></body></html>
          EOF
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          PID=$!; trap 'kill $PID 2>/dev/null || true' EXIT
          cat > click.cjs <<'JS'
          const {chromium}=require('playwright-core');const {execFileSync}=require('child_process');
          (async()=>{let exe='';for(const c of ['google-chrome','google-chrome-stable','chromium']){try{exe=execFileSync('bash',['-lc',`command -v ${c}`],{encoding:'utf8'}).trim();if(exe)break}catch{}}if(!exe)throw new Error('Chrome missing');const b=await chromium.launch({headless:true,executablePath:exe,args:['--no-sandbox','--disable-gpu']});try{const p=await b.newPage();await p.goto('http://127.0.0.1:4173/stat-click.html',{waitUntil:'domcontentloaded'});await p.evaluate(()=>window.__catlakRenderCompactStats(true));const sel='[data-cux-field="STR"]';await p.waitForSelector(sel);await p.click(sel);const focused=await p.evaluate(sel=>document.activeElement===document.querySelector(sel),sel);if(!focused)throw new Error('STR input real click did not focus');await p.keyboard.press('Control+A');await p.keyboard.type('17');const edited=await p.evaluate(sel=>({value:document.querySelector(sel).value,dirty:window.__catlakStatsTest.dirty()}),sel);console.log('EDITED',JSON.stringify(edited));if(edited.value!=='17'||!edited.dirty)throw new Error('Real keyboard edit failed '+JSON.stringify(edited));

          const before=await p.evaluate(()=>({selected:window.__catlakStatsTest.selected(),editor:document.querySelector('[data-cux-editor]')?.dataset.cuxEditor,name:document.querySelector('[data-cux-editor] h2')?.textContent}));console.log('BEFORE_SWITCH',JSON.stringify(before));
          const pt=await p.evaluate(()=>{const b=document.querySelector('[data-cux-character="c2"]'),r=b.getBoundingClientRect();const ov=document.createElement('div');ov.id='blocking-overlay';Object.assign(ov.style,{position:'fixed',left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px',zIndex:'99999',pointerEvents:'auto',background:'rgba(255,0,0,.01)'});document.body.appendChild(ov);return{x:r.left+r.width/2,y:r.top+r.height/2}});
          await p.mouse.click(pt.x,pt.y);await p.waitForTimeout(180);
          const after=await p.evaluate(()=>({selected:window.__catlakStatsTest.selected(),editor:document.querySelector('[data-cux-editor]')?.dataset.cuxEditor,name:document.querySelector('[data-cux-editor] h2')?.textContent}));console.log('AFTER_SWITCH',JSON.stringify(after));
          if(after.selected!=='c2'||after.editor!=='c2'||after.name!=='Eeliot')throw new Error('Character switch failed '+JSON.stringify(after));
          }finally{await b.close()}})().catch(e=>{console.error(e);process.exit(1)});
          JS
          node click.cjs
