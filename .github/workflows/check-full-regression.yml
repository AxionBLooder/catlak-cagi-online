name: Check Full Regression
on:
  push:
    paths:
      - '.github/workflows/check-full-regression.yml'
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Install browser driver
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright-core
      - name: Verify production assets and syntax
        env:
          LIVE_URL: https://axionblooder.github.io/catlak-cagi-online/
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 2 "$LIVE_URL?regression=$(date +%s)" -o /tmp/index.html
          for marker in 'browser-app.js' 'gm-controls-patch.js' 'presence-patch.js?v=presence-v3' 'dice-ux-patch.js?v=dice-v1' 'item-system-patch.js?v=item-v1' 'event-rolls-patch.js?v=events-v1' 'gm-tools-patch.js?v=gmtools-v1' 'room-guard-patch.js?v=guard-v1' 'room-system-patch.js?v=rooms-v2'; do grep -q "$marker" /tmp/index.html; done
          for f in browser-app.js gm-controls-patch.js presence-patch.js dice-ux-patch.js item-system-patch.js event-rolls-patch.js gm-tools-patch.js room-guard-patch.js room-system-patch.js; do curl -fsSL --retry 5 --retry-delay 2 "${LIVE_URL}${f}?r=$(date +%s%N)" -o "/tmp/$f"; node --check "/tmp/$f"; done
          grep -q 'catlak_update_vampire_kp' /tmp/gm-controls-patch.js
          grep -q 'ÇEVRİMİÇİ' /tmp/presence-patch.js
          grep -q 'KRİTİK BAŞARISIZLIK' /tmp/dice-ux-patch.js
          grep -q 'Pasif / Aksesuar' /tmp/item-system-patch.js
          grep -q 'Olay Geçmişini Temizle' /tmp/event-rolls-patch.js
          grep -q 'Savaş & Durumlar' /tmp/gm-tools-patch.js
          grep -q 'TAKILI TEÇHİZAT' /tmp/gm-tools-patch.js
          grep -q 'CRG_NAV_PLAN' /tmp/room-guard-patch.js
          grep -q 'catlak_roll_weapon' /tmp/room-guard-patch.js
          grep -q 'Yönetim Odası' /tmp/room-system-patch.js
          grep -q 'Savaş Odası' /tmp/room-system-patch.js
          grep -q 'catlak_player_combat_snapshot' /tmp/room-system-patch.js
          echo REGRESSION_STATIC_OK
      - name: Verify permanent site in Chrome
        env:
          LIVE_URL: https://axionblooder.github.io/catlak-cagi-online/
        run: |
          cat > full-regression.cjs <<'JS'
          const {chromium}=require('playwright-core');const {execFileSync}=require('child_process');
          (async()=>{let exe='';for(const c of ['google-chrome','google-chrome-stable','chromium']){try{exe=execFileSync('bash',['-lc',`command -v ${c}`],{encoding:'utf8'}).trim();if(exe)break}catch{}}if(!exe)throw new Error('Chrome missing');const browser=await chromium.launch({headless:true,executablePath:exe,args:['--no-sandbox','--disable-gpu']});try{
            const page=await browser.newPage();const errors=[];page.on('pageerror',e=>errors.push(String(e.message||e)));const res=await page.goto(process.env.LIVE_URL+'?full-regression='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});if(res?.status()!==200)throw new Error('Root HTTP '+res?.status());
            await page.waitForFunction(()=>{const a=document.querySelector('#app')?.textContent||'';return a.includes('E-posta')&&!a.includes('Uygulama yükleniyor')&&window.__catlakDiceUxTest&&window.__catlakItemSystemTest&&window.__catlakEventRollsTest&&window.__catlakGmToolsTest&&window.__catlakRoomGuardTest},{timeout:25000});
            await page.waitForFunction(()=>!!document.querySelector('script[data-cc-room-system-loader]'),{timeout:10000});
            const loaders=await page.evaluate(()=>({gm:!!document.querySelector('script[data-cc-gm-controls-loader]'),presence:!!document.querySelector('script[data-cc-presence-loader]'),dice:!!document.querySelector('script[data-cc-dice-ux-loader]'),item:!!document.querySelector('script[data-cc-item-system-loader]'),events:!!document.querySelector('script[data-cc-event-rolls-loader]'),gmtools:!!document.querySelector('script[data-cc-gm-tools-loader]'),guard:!!document.querySelector('script[data-cc-room-guard-loader]'),rooms:!!document.querySelector('script[data-cc-room-system-loader]')}));if(!Object.values(loaders).every(Boolean))throw new Error('Addon loader missing '+JSON.stringify(loaders));
            const tests=await page.evaluate(()=>{const d=window.__catlakDiceUxTest,i=window.__catlakItemSystemTest,g=window.__catlakGmToolsTest;const test=document.createElement('div');test.className='roll';test.innerHTML='<div class="die">0</div><div><b>Smoke</b></div>';document.querySelector('#app').appendChild(test);d.criticalize();const critical=test.textContent.includes('KRİTİK BAŞARISIZLIK');test.remove();const weapon=i.fields('weapon',{}),armor=i.fields('armor',{}),item=i.fields('item',{effects:{item_mode:'general'}});return{critical,weapon:weapon.includes('Saldırı Formülü')&&!weapon.includes('AC Değeri'),armor:armor.includes('AC Değeri')&&!armor.includes('Saldırı Formülü'),item:item.includes('Eşya Davranışı')&&!item.includes('Saldırı Formülü')&&!item.includes('AC Değeri'),slots:g.slotName('main_weapon')==='Ana Silah'&&g.slotName('armor')==='Zırh',guardPlan:Array.isArray(window.__catlakRoomGuardTest.plan)&&window.__catlakRoomGuardTest.plan.at(-1)==='[data-ccr-hub]'}});if(!Object.values(tests).every(Boolean))throw new Error('UI regression '+JSON.stringify(tests));
            await page.evaluate(()=>{const s=document.createElement('div');s.id='rg-spacer';s.style.height='2200px';document.body.appendChild(s);window.scrollTo(0,700);window.__catlakDiceUxTest.rememberScroll();window.scrollTo(0,0);window.__catlakDiceUxTest.restoreScroll()});await page.waitForTimeout(150);const y=await page.evaluate(()=>scrollY);if(y<600)throw new Error('Scroll regression '+y);await page.evaluate(()=>document.querySelector('#rg-spacer')?.remove());await page.waitForTimeout(2500);if(errors.length)throw new Error('Root errors: '+errors.join(' | '));await page.close();
            async function reject(token,marker){const p=await browser.newPage();const es=[];p.on('pageerror',e=>es.push(String(e.message||e)));const r=await p.goto(process.env.LIVE_URL+'?join='+encodeURIComponent(token),{waitUntil:'domcontentloaded',timeout:30000});if(r?.status()!==200)throw new Error('Invite HTTP '+r?.status());await p.waitForFunction(m=>(document.querySelector('#toast')?.textContent||'').includes(m)&&(document.querySelector('#app')?.textContent||'').includes('E-posta'),marker,{timeout:25000});if(es.length)throw new Error('Invite errors '+es.join(' | '));await p.close()}
            await reject('CHAR-INVALID-SMOKE-ONLY','Karakter daveti kullanılmış veya süresi dolmuş');await reject('RECON-INVALID-SMOKE-ONLY','Yeniden bağlama bağlantısı kullanılmış veya süresi dolmuş');console.log('FULL_REGRESSION_OK',JSON.stringify({loaders,tests,scrollY:y}));
          }finally{await browser.close()}})().catch(e=>{console.error(e);process.exit(1)});
          JS
          node full-regression.cjs
# trigger: full-site-audit-2026-09-10
