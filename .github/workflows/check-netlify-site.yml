name: Check Netlify Site
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'browser-app.js'
      - '_headers'
      - '.github/workflows/check-netlify-site.yml'
  workflow_dispatch:
concurrency:
  group: catlak-netlify-site-check
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Verify cache headers
        run: |
          curl -fsSI https://catlak-cagi-online.netlify.app/ | tee /tmp/root.headers
          curl -fsSI 'https://catlak-cagi-online.netlify.app/browser-app.js?v=bootwatch-171c9773' | tee /tmp/js.headers
          grep -qi 'cache-control:.*no-store' /tmp/root.headers
          grep -qi 'cache-control:.*no-store' /tmp/js.headers
      - name: Install browser driver
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright-core
      - name: Verify Netlify production with Chrome
        env:
          LIVE_URL: https://catlak-cagi-online.netlify.app/
        run: |
          cat > .check-netlify.cjs <<'JS'
          const { chromium }=require('playwright-core');
          const { execFileSync }=require('child_process');
          (async()=>{
            let exe='';
            for(const cmd of ['google-chrome','google-chrome-stable','chromium']){
              try{exe=execFileSync('bash',['-lc',`command -v ${cmd}`],{encoding:'utf8'}).trim();if(exe)break}catch{}
            }
            if(!exe)throw new Error('Chrome binary missing');
            const browser=await chromium.launch({headless:true,executablePath:exe,args:['--no-sandbox','--disable-gpu']});
            const page=await browser.newPage();
            const pageErrors=[],httpErrors=[],requestFailures=[];
            page.on('pageerror',e=>pageErrors.push(String(e.message||e)));
            page.on('response',r=>{if(r.status()>=400)httpErrors.push(`${r.status()} ${r.url()}`)});
            page.on('requestfailed',r=>requestFailures.push(`${r.url()} :: ${r.failure()?.errorText||'failed'}`));
            try{
              const started=Date.now();
              const response=await page.goto(process.env.LIVE_URL+'?smoke='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForFunction(()=>{const t=document.querySelector('#app')?.textContent||'';return !t.includes('Uygulama yükleniyor')&&(t.includes('Giriş Yap')||t.includes('Hesap Aç')||t.includes('TEK EVREN')||t.includes('Başlangıç tamamlanamadı')||t.includes('Uygulama dosyası yüklenemedi'))},{timeout:20000});
              const elapsed=Date.now()-started;
              const text=(await page.locator('#app').innerText()).replace(/\s+/g,' ').trim();
              console.log('NAV_STATUS:',response?.status());
              console.log('FINAL_URL:',page.url());
              console.log('LOAD_MS:',elapsed);
              console.log('APP_TEXT:',text.slice(0,1200));
              console.log('HTTP_ERRORS:',JSON.stringify(httpErrors));
              console.log('REQUEST_FAILURES:',JSON.stringify(requestFailures));
              console.log('PAGE_ERRORS:',JSON.stringify(pageErrors));
              if(response?.status()!==200)throw new Error('Netlify HTTP status '+response?.status());
              if(text.includes('Uygulama yükleniyor'))throw new Error('Initial loading screen did not clear');
              if(httpErrors.length||requestFailures.length||pageErrors.length)throw new Error('Netlify browser errors detected');
              console.log('NETLIFY LIVE BOOT OK');
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node .check-netlify.cjs
