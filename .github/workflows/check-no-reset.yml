name: Check No Reset Interactions
on:
  push:
    paths:
      - '.github/workflows/check-no-reset.yml'
      - 'ux-patch.js'
      - 'site-stability-patch.js'
      - 'stat-workshop-route-fix.js'
      - 'stat-roll-patch.js'
      - 'live_06.txt'
      - 'index.html'
      - 'browser-app.js'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Static ownership checks
        run: |
          set -euo pipefail
          node --check ux-patch.js
          node --check site-stability-patch.js
          node --check stat-workshop-route-fix.js
          node --check stat-roll-patch.js
          grep -q '__catlakShouldPreserveCurrentView' site-stability-patch.js
          grep -q '__catlakShouldPreserveCurrentView' live_06.txt
          grep -q '__catlakStatsTest' ux-patch.js
          grep -q 'data-cux-step' ux-patch.js
          grep -q 'cuxFocusInput' ux-patch.js
          ! grep -q 'SWRF_CACHE_KEY' stat-workshop-route-fix.js
          ! grep -q 'swrfRestoreCache' stat-workshop-route-fix.js
          ! grep -q 'setInterval(srEnsure' stat-roll-patch.js
          grep -q 'bootwatch-234-no-reset-v1' index.html
          grep -q 'statsroute-v5&no-reset-v1' index.html
          echo NO_RESET_STATIC_OK
      - name: Install browser driver
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright-core
      - name: Verify clickable stable Stat DOM in Chrome
        run: |
          cat > no-reset-stat.html <<'EOF'
          <!doctype html><html><body><div id="app"><header><span class="role">GM</span></header><nav class="nav"><button class="on" data-cc-stats-tab>Stat Atölyesi</button></nav><main></main></div><div id="toast" class="hidden"></div><script>
          window.__db=[{id:'c1',name:'Bir',species_name:'Elf',background_name:'Gezgin',class_name:'Savaşçı',play_status:'active',base_stats:{STR:10,DEX:11,CON:12,INT:13,WIS:14,CHA:15},hp_current:10,hp_max:12,base_ac:13,base_speed:30,level:2,created_at:'1'},{id:'c2',name:'İki',species_name:'İnsan',background_name:'Asil',class_name:'Büyücü',play_status:'prepared',base_stats:{STR:8,DEX:12,CON:10,INT:16,WIS:13,CHA:11},hp_current:8,hp_max:8,base_ac:11,base_speed:30,level:3,created_at:'2'}];
          function chars(){const chain={select(){return chain},in(){return chain},order(){return chain},then(ok,bad){return Promise.resolve({data:window.__db.map(x=>structuredClone(x)),error:null}).then(ok,bad)}};return chain}
          window.__catlakSupabase={from:t=>chars(),rpc:async(fn,args)=>{const c=window.__db.find(x=>x.id===args.p_character_id);if(c){c.base_stats={...args.p_stats};c.hp_current=args.p_hp_current;c.hp_max=args.p_hp_max;c.base_ac=args.p_ac;c.base_speed=args.p_speed;c.level=args.p_level}return{data:true,error:null}},channel:()=>({on(ev,filter,cb){window.__statRealtime=cb;return this},subscribe(){return this}})};
          </script><script src="./site-stability-patch.js"></script><script src="./ux-patch.js"></script></body></html>
          EOF
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/noreset-http.log 2>&1 &
          PID=$!; trap 'kill $PID 2>/dev/null || true' EXIT
          cat > no-reset-smoke.cjs <<'JS'
          const {chromium}=require('playwright-core');const {execFileSync}=require('child_process');
          (async()=>{let exe='';for(const c of ['google-chrome','google-chrome-stable','chromium']){try{exe=execFileSync('bash',['-lc',`command -v ${c}`],{encoding:'utf8'}).trim();if(exe)break}catch{}}if(!exe)throw new Error('Chrome missing');const b=await chromium.launch({headless:true,executablePath:exe,args:['--no-sandbox','--disable-gpu']});try{const p=await b.newPage();const errs=[];p.on('pageerror',e=>errs.push(String(e.message||e)));await p.goto('http://127.0.0.1:4173/no-reset-stat.html',{waitUntil:'domcontentloaded'});await p.evaluate(()=>window.__catlakRenderCompactStats(true));await p.waitForSelector('.cux-workshop');await p.evaluate(()=>window.__stableShell=document.querySelector('.cux-workshop'));if(!await p.evaluate(()=>window.__catlakShouldPreserveCurrentView()))throw new Error('Stat view not managed');await p.click('[data-cux-character="c2"]');if(!await p.evaluate(()=>window.__stableShell===document.querySelector('.cux-workshop')))throw new Error('Character select replaced workshop');const str='[data-cux-field="STR"]';await p.click(str);if(!await p.evaluate(s=>document.activeElement===document.querySelector(s),str))throw new Error('Real click did not focus STR');if(!await p.evaluate(()=>window.__catlakStatsTest.dirty()))throw new Error('Pointer focus did not lock dirty editor');await p.evaluate(()=>window.__statRealtime&&window.__statRealtime());await p.waitForTimeout(120);if(!await p.evaluate(s=>window.__stableShell===document.querySelector('.cux-workshop')&&document.activeElement===document.querySelector(s),str))throw new Error('Realtime replaced focused Stat input');await p.keyboard.press('Control+A');await p.keyboard.type('17');if(await p.inputValue(str)!=='17')throw new Error('Keyboard edit failed');await p.click('[data-cux-step="STR"][data-cux-delta="1"]');if(await p.inputValue(str)!=='18')throw new Error('Plus step failed');await p.click('[data-cux-step="STR"][data-cux-delta="-1"]');if(await p.inputValue(str)!=='17')throw new Error('Minus step failed');await p.evaluate(()=>window.__statRealtime&&window.__statRealtime());await p.waitForTimeout(120);const dirty=await p.evaluate(()=>({same:window.__stableShell===document.querySelector('.cux-workshop'),value:document.querySelector('[data-cux-field="STR"]')?.value,isDirty:window.__catlakStatsTest.dirty()}));if(!dirty.same||dirty.value!=='17'||!dirty.isDirty)throw new Error('Realtime reset dirty editor '+JSON.stringify(dirty));await p.click('[data-cux-save]');await p.waitForTimeout(180);const saved=await p.evaluate(()=>({same:window.__stableShell===document.querySelector('.cux-workshop'),value:document.querySelector('[data-cux-field="STR"]')?.value,selected:window.__catlakStatsTest.selected()}));if(!saved.same||saved.value!=='17'||saved.selected!=='c2')throw new Error('Save reset Stat view '+JSON.stringify(saved));if(errs.length)throw new Error(errs.join(' | '));console.log('NO_RESET_CLICKABLE_STAT_OK',JSON.stringify({dirty,saved}));}finally{await b.close()}})().catch(e=>{console.error(e);process.exit(1)});
          JS
          node no-reset-smoke.cjs
      - name: Verify production bundle
        env:
          LIVE_URL: https://axionblooder.github.io/catlak-cagi-online/
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 30); do
            curl -fsSL --retry 2 "$LIVE_URL?noreset=$(date +%s%N)" -o /tmp/index.html || true
            curl -fsSL --retry 2 "${LIVE_URL}browser-app.js?n=$(date +%s%N)" -o /tmp/browser-app.js || true
            if grep -q 'bootwatch-234-no-reset-v1' /tmp/index.html 2>/dev/null && grep -q 'data-cux-step' /tmp/browser-app.js 2>/dev/null && grep -q 'cux-number-control' /tmp/browser-app.js 2>/dev/null; then ok=1; break; fi
            sleep 2
          done
          test "$ok" = 1
          node --check /tmp/browser-app.js
          grep -q '__catlakShouldPreserveCurrentView' /tmp/browser-app.js
          grep -q '__catlakStatsTest' /tmp/browser-app.js
          grep -q 'data-cux-step' /tmp/browser-app.js
          grep -q 'cux-number-control' /tmp/browser-app.js
          echo NO_RESET_PRODUCTION_OK
