name: Deploy Recovery Final
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-recovery-final.yml'
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Verify final hardened artifact
        run: |
          node --check browser-app.js
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          m=json.loads(Path('browser-build.json').read_text())
          b=Path('browser-app.js').read_bytes(); s=b.decode('utf-8')
          got=hashlib.sha256(b).hexdigest()
          exp='efeb0c5549dabb8f692ebc84456417c11cf18fd34b7a6769b7bdf2f95075e048'
          if got!=exp or m.get('sha256')!=exp: raise SystemExit(f'Unexpected artifact {got}')
          for x in ['Oyun verileri yüklenemedi','Oyun verileri zaman aşımına uğradı','Oturum kontrolü yanıt vermedi','Masa hazırlanıyor','Görsel Dosyası Seç','Stat Atölyesi']:
              if x not in s: raise SystemExit('Missing marker '+x)
          print('FINAL_HARDENED_ARTIFACT_OK',len(b),got)
          PY
      - name: Package recovery production
        run: |
          mkdir -p recovery-final
          cp index.html browser-app.js catalog.b64 recovery-final/
          if [ -f _headers ]; then cp _headers recovery-final/; else cat > recovery-final/_headers <<'EOF'
          /
            Cache-Control: no-store, no-cache, must-revalidate, max-age=0
          /index.html
            Cache-Control: no-store, no-cache, must-revalidate, max-age=0
          /browser-app.js
            Cache-Control: no-store, no-cache, must-revalidate, max-age=0
            Content-Type: application/javascript; charset=UTF-8
          EOF
          fi
      - name: Deploy final recovery production
        working-directory: recovery-final
        run: |
          npx -y @netlify/mcp@latest \
            --site-id bfdbcf3c-534a-4f45-a010-b77db193f037 \
            --proxy-path "https://netlify-mcp.netlify.app/proxy/eyJhbGciOiJkaXIiLCJlbmMiOiJBMjU2R0NNIn0..1mUx7VFj0P11nnhH.f0CtZki3KpmayziIKOi2cdPbDWGMQsAOY_S5w1SxAsjbucLIChkcYUom1IYW1WR1z4bulRO4DrGSGBQB2-lB_F9ommzoohi-RyodA9GLH7EaUBzU0Ahx59Q-t0Wql9OFTmSuGHY3r0704D9NCM_vRFpe_xUDl88U9L-YDdVxJ1RkPOJAykVICYMlyGGn6XIMd9MFNexfV7ns7bPVpULhUW9nw7eUAL0sbp4omTQs2DJuSBFCtGGBq0fYvIINmi6Ic2Fg6HL3FOHkJ4w_21YpP9iQiWECTc4OuycGrND-1un5uU-WX3pFKtDJ7sT8W9kgDBLnB-aGEwNefRq4G8ILdQ7lbjhHoO_dg4ks5aRbnN254A2MZmkdKkPSXjMPTFHpbH_uYfJA.IJdFaHfFfqUE2v6rA0dhCw" \
