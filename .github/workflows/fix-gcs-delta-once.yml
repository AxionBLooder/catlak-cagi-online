name: Fix Campaign Delta Once

# trigger: pointer-v2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-gcs-delta-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply delta interaction fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('gm-campaign-state-patch.js')
          s = p.read_text(encoding='utf-8')

          if 'let gcsPointerDeltaUntil=0;' not in s:
              s = s.replace('let gcsQueued=false;\n', 'let gcsQueued=false;\nlet gcsPointerDeltaUntil=0;\n', 1)

          old_score = "if(score)score.textContent=next>0?'+'+next:String(next);"
          new_score = "if(score){const label=next>0?'+'+next:String(next);if(score.childNodes.length===1&&score.firstChild?.nodeType===3)score.firstChild.nodeValue=label;else score.textContent=label;}"
          s = s.replace(old_score, new_score, 1)

          marker = "document.addEventListener('click',e=>{"
          if 'function gcsDeltaButton(target)' not in s:
              block = r'''function gcsDeltaButton(target){return target?.closest?.('[data-gcs-page="reputation"] [data-gcs-delta]')||null}
function gcsConsumeDelta(e,button,apply){
  e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();
  if(apply)gcsUpdateMeter(button.dataset.gcsKind,button.dataset.gcsKey,button.dataset.gcsDelta,button);
}
window.addEventListener('pointerdown',e=>{
  if(e.button!=null&&e.button!==0)return;
  const button=gcsDeltaButton(e.target);if(!button)return;
  gcsPointerDeltaUntil=performance.now()+900;
  gcsConsumeDelta(e,button,true);
},true);
window.addEventListener('click',e=>{
  const button=gcsDeltaButton(e.target);if(!button)return;
  const apply=performance.now()>gcsPointerDeltaUntil;
  gcsConsumeDelta(e,button,apply);
},true);

'''
              if marker not in s:
                  raise SystemExit('click listener marker not found')
              s = s.replace(marker, block + marker, 1)

          if 'window.__catlakGcsDeltaPointerV2=true;' not in s:
              s = s.replace('window.__catlakCampaignStateTest=', 'window.__catlakGcsDeltaPointerV2=true;\nwindow.__catlakCampaignStateTest=', 1)

          p.write_text(s, encoding='utf-8')
          PY
          node --check gm-campaign-state-patch.js
          grep -Fq 'gcsDeltaButton' gm-campaign-state-patch.js
          grep -Fq '__catlakGcsDeltaPointerV2=true' gm-campaign-state-patch.js
      - name: Commit fix
        run: |
          if git diff --quiet -- gm-campaign-state-patch.js; then
            echo 'No source change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gm-campaign-state-patch.js
          git commit -m 'İtibar artı eksi tıklamasını pointer aşamasında sabitle'
          git push
