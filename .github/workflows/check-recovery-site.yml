name: Check Recovery Site
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-recovery-site.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright-core
      - name: Verify recovery site boot and auth failure path
        env:
          LIVE_URL: https://catlak-cagi-stable.netlify.app/
        run: |
          cat > .check-recovery.cjs <<'JS'
          const {chromium}=require('playwright-core');
          const {execFileSync}=require('child_process');
          (async()=>{
            let exe='';
            for(const c of ['google-chrome','google-chrome-stable','chromium']){try{exe=execFileSync('bash',['-lc',`command -v ${c}`],{encoding:'utf8'}).trim();if(exe)break}catch{}}
            if(!exe)throw new Error('Chrome missing');
            const browser=await chromium.launch({headless:true,executablePath:exe,args:['--no-sandbox','--disable-gpu']});
            const page=await browser.newPage();
            const pageErrors=[],httpErrors=[],fails=[];
            page.on('pageerror',e=>pageErrors.push(String(e.message||e)));
            page.on('response',r=>{if(r.status()>=400 && !r.url().includes('/auth/v1/token'))httpErrors.push(`${r.status()} ${r.url()}`)});
            page.on('requestfailed',r=>fails.push(`${r.url()} :: ${r.failure()?.errorText||'failed'}`));
            const started=Date.now();
            const res=await page.goto(process.env.LIVE_URL+'?recovery='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForFunction(()=>{const t=document.querySelector('#app')?.textContent||'';return t.includes('Giriş Yap')&&t.includes('E-posta')&&!t.includes('Uygulama yükleniyor')},{timeout:15000});
            const bootMs=Date.now()-started;
            const js=await page.evaluate(async()=>{const r=await fetch('./browser-app.js?probe='+Date.now(),{cache:'no-store'});return {status:r.status,type:r.headers.get('content-type'),cache:r.headers.get('cache-control'),len:(await r.text()).length}});
            await page.locator('#aemail').fill('catlak-smoke-nonexistent@example.invalid');
            await page.locator('#apass').fill('definitely-wrong-password');
            const clickAt=Date.now();
            await page.getByRole('button',{name:'Giriş Yap'}).click();
            await page.waitForFunction(()=>{const t=document.body.innerText||'';const toast=document.querySelector('#toast');return (toast&&!toast.classList.contains('hidden'))||/invalid|geçersiz|hata|credentials/i.test(t)},{timeout:15000}).catch(()=>{});
            const authElapsed=Date.now()-clickAt;
            const body=(await page.locator('body').innerText()).replace(/\s+/g,' ').trim();
            console.log('HTTP_STATUS',res?.status());
            console.log('BOOT_MS',bootMs);
            console.log('JS_PROBE',JSON.stringify(js));
            console.log('AUTH_ELAPSED_MS',authElapsed);
            console.log('APP_TEXT',body.slice(0,1000));
            console.log('PAGE_ERRORS',JSON.stringify(pageErrors));
            console.log('HTTP_ERRORS',JSON.stringify(httpErrors));
            console.log('REQUEST_FAILURES',JSON.stringify(fails));
            if(res?.status()!==200)throw new Error('Root status '+res?.status());
            if(!/application\/javascript/i.test(js.type||''))throw new Error('Bad JS MIME '+js.type);
            if(js.status!==200||js.len<300000)throw new Error('JS asset incomplete');
            if(body.includes('Uygulama yükleniyor'))throw new Error('Boot screen stuck');
            if(pageErrors.length||httpErrors.length||fails.length)throw new Error('Browser/network errors detected');
            if(authElapsed>=15000)throw new Error('Auth failure path hung');
            console.log('RECOVERY_SITE_OK');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node .check-recovery.cjs
