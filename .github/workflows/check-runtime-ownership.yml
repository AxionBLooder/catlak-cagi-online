name: Check Runtime Ownership
on:
  push:
    paths:
      - 'index.html'
      - 'gm-center-router-core.js'
      - 'gm-hub-v2-patch.js'
      - 'gm-nav-cleanup-patch.js'
      - 'gm-tools-patch.js'
      - 'gm-management-room-patch.js'
      - 'class-bonus-patch.js'
      - '.github/workflows/check-runtime-ownership.yml'
  workflow_dispatch:
jobs:
  ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v6
      - name: Static ownership checks
        run: |
          set -euo pipefail
          for f in gm-center-router-core.js gm-hub-v2-patch.js gm-nav-cleanup-patch.js gm-tools-patch.js gm-management-room-patch.js class-bonus-patch.js; do node --check "$f"; done
          for f in gm-center-router-core.js gm-hub-v2-patch.js gm-nav-cleanup-patch.js gm-tools-patch.js gm-management-room-patch.js class-bonus-patch.js; do ! grep -Fq 'setInterval(' "$f"; done
          grep -Fq 'gm-center-router-core.js' index.html
          grep -Fq 'gm-hub-v2-patch.js' index.html
          grep -Fq 'gm-management-room-patch.js' index.html
          grep -Fq 'class-bonus-patch.js' index.html
          grep -Fq "if(!open){bar?.remove();return}" gm-hub-v2-patch.js
          grep -Fq 'leave:gm2LeaveCenter' gm-hub-v2-patch.js
          grep -Fq '__catlakManagementRoom' gm-management-room-patch.js
          grep -Fq 'class_bonus_v1' class-bonus-patch.js
          echo RUNTIME_OWNERSHIP_STATIC_OK
      - name: Install browser driver
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright-core
      - name: Verify GM Center, Management Room and class bonus in Chrome
        run: |
          cat > runtime-smoke.html <<'HTML'
          <!doctype html><html lang="tr"><head><meta charset="utf-8"><style>.hidden{display:none}</style></head><body>
          <div id="app"><span class="role">GM</span><nav class="nav"><button data-tab="gm" class="on">Canlı Oyun</button><button data-gmt-open>GM Merkezi</button><button data-tab="characters">Karakterler</button></nav><main>BASE</main></div><div id="toast" class="hidden"></div>
          <script>
          window.__updates=[];
          const chars=[{id:'c1',name:'Test Şövalye',species_name:'İnsan',background_name:'Asil',class_name:'Paladin',level:3,play_status:'active',owner_id:null,base_stats:{STR:10,DEX:10,CON:10,INT:10,WIS:10,CHA:10},hp_current:12,hp_max:12,base_ac:12,data:{},created_at:'1'}];
          const classes=[{id:'cl1',name:'Paladin',hit_die:10,sort_order:1,data:{}}];
          function from(table){
            let mode='select',payload=null,filters={};
            const c={
              select(){mode='select';return c},order(){return c},in(){return c},limit(){return c},
              eq(k,v){filters[k]=v;return c},
              update(v){mode='update';payload=v;return c},delete(){mode='delete';return c},upsert(v){mode='upsert';payload=v;return c},
              maybeSingle(){const data=(table==='catlak_characters'?chars:table==='catlak_classes'?classes:[]).find(x=>Object.entries(filters).every(([k,v])=>String(x[k])===String(v)))||null;return Promise.resolve({data,error:null})},
              then(ok,bad){let data=table==='catlak_characters'?chars:table==='catlak_classes'?classes:[];data=data.filter(x=>Object.entries(filters).every(([k,v])=>String(x[k])===String(v)));if(mode==='update'){window.__updates.push({table,payload,filters});const x=chars.find(v=>String(v.id)===String(filters.id));if(x)Object.assign(x,payload);data=x?[x]:[]}return Promise.resolve({data,error:null}).then(ok,bad)}
            };return c;
          }
          const channel={on(){return channel},subscribe(){return channel}};
          window.__catlakSupabase={from,rpc:async()=>({data:true,error:null}),channel:()=>channel,storage:{from:()=>({remove:async()=>({error:null})})}};
          document.querySelector('#app').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;document.querySelectorAll('.nav .on').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.querySelector('main').textContent='BASE '+b.dataset.tab});
          </script>
          <script src="./gm-tools-patch.js"></script><script src="./gm-hub-v2-patch.js"></script><script src="./gm-center-router-core.js"></script><script src="./gm-management-room-patch.js"></script><script src="./class-bonus-patch.js"></script>
          </body></html>
          HTML
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/runtime-http.log 2>&1 &
          PID=$!; trap 'kill $PID 2>/dev/null || true' EXIT
          cat > runtime-smoke.cjs <<'JS'
          const {chromium}=require('playwright-core');const {execFileSync}=require('child_process');
          (async()=>{let exe='';for(const c of ['google-chrome','google-chrome-stable','chromium']){try{exe=execFileSync('bash',['-lc',`command -v ${c}`],{encoding:'utf8'}).trim();if(exe)break}catch{}}if(!exe)throw new Error('Chrome missing');const browser=await chromium.launch({headless:true,executablePath:exe,args:['--no-sandbox','--disable-gpu']});try{
            const p=await browser.newPage();const errors=[];p.on('pageerror',e=>errors.push(String(e.message||e)));await p.goto('http://127.0.0.1:4173/runtime-smoke.html',{waitUntil:'domcontentloaded'});await p.waitForTimeout(250);
            await p.click('[data-gmt-open]');await p.waitForSelector('[data-gm2-centerbar]');
            if(await p.locator('[data-gm2-route="combat"]').count())throw new Error('Combat should not be in GM Center');
            await p.click('[data-gm2-route="characters"]');await p.waitForSelector('[data-gmr-page]');
            const room=await p.locator('[data-gmr-page]').innerText();if(!room.includes('Test Şövalye')||!room.includes('Oyuncu Daveti'))throw new Error('Management Room did not render '+room);
            await p.waitForFunction(()=>window.__updates.some(x=>x.table==='catlak_characters'&&x.payload?.data?.class_bonus_v1?.applied===true),null,{timeout:5000});
            const out=await p.evaluate(()=>({updates:window.__updates,bonus:window.__catlakClassBonus?.label(window.__catlakClassBonus.preset({name:'Paladin',hit_die:10,data:{}})),room:!!window.__catlakManagementRoom?.isOpen()}));
            if(!out.room||!String(out.bonus).includes('STR +1')||!String(out.bonus).includes('CHA +1')||!String(out.bonus).includes('AC +1'))throw new Error('Class bonus/room state wrong '+JSON.stringify(out));
            if(errors.length)throw new Error('Page errors '+errors.join(' | '));
            console.log('RUNTIME_OWNERSHIP_BROWSER_OK',JSON.stringify(out));
          }finally{await browser.close()}})().catch(e=>{console.error(e);process.exit(1)});
          JS
          node runtime-smoke.cjs
