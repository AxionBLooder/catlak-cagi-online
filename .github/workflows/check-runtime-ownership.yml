name: Check Runtime Ownership

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'browser-app.js'
      - 'runtime-health-guard.js'
      - 'app-action-stability.js'
      - 'player-sheet-hard-recovery.js'
      - 'battle-room-v3-patch.js'
      - 'room-system-patch.js'
      - 'gm-clean-router-v1.js'
      - 'gm-live-compact-v1.js'
      - 'live-combat-center-patch.js'
      - 'gm-ui-polish-v1.js'
      - 'presence-patch.js'
      - 'quality-of-life-patch.js'
      - '.github/workflows/check-runtime-ownership.yml'
  workflow_dispatch:

jobs:
  ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Verify current runtime ownership
        run: |
          set -euo pipefail

          for f in             browser-app.js             runtime-health-guard.js             app-action-stability.js             player-sheet-hard-recovery.js             battle-room-v3-patch.js             room-system-patch.js             gm-clean-router-v1.js             gm-live-compact-v1.js             live-combat-center-patch.js             gm-ui-polish-v1.js             presence-patch.js             quality-of-life-patch.js
          do
            node --check "$f"
          done

          python3 - <<'PY'
          from pathlib import Path

          html=Path('index.html').read_text(encoding='utf-8')
          core=Path('browser-app.js').read_text(encoding='utf-8')
          sheet=Path('player-sheet-hard-recovery.js').read_text(encoding='utf-8')
          battle=Path('battle-room-v3-patch.js').read_text(encoding='utf-8')
          rooms=Path('room-system-patch.js').read_text(encoding='utf-8')
          gm=Path('gm-clean-router-v1.js').read_text(encoding='utf-8')
          live=Path('live-combat-center-patch.js').read_text(encoding='utf-8')
          compact=Path('gm-live-compact-v1.js').read_text(encoding='utf-8')
          presence=Path('presence-patch.js').read_text(encoding='utf-8')
          qol=Path('quality-of-life-patch.js').read_text(encoding='utf-8')

          required=[
            'runtime-health-guard.js',
            'app-action-stability.js',
            'player-sheet-hard-recovery.js',
            'battle-room-v3-patch.js',
            'room-system-patch.js',
            'gm-clean-router-v1.js',
            'gm-live-compact-v1.js',
            'live-combat-center-patch.js',
          ]
          for name in required:
              if name not in html:
                  raise SystemExit('Aktif runtime index içinde yok: '+name)

          retired=[
            'gm-live-player-state.js',
            'gm-controls-patch.js',
            'dice-ux-patch.js',
            'player-sheet-patch.js',
            'player-live-actions-patch.js',
            'gm-management-room-patch.js',
            'gm-center-router-core.js',
          ]
          for name in retired:
              if name in html:
                  raise SystemExit('Eski/çakışan runtime yeniden yüklenmiş: '+name)

          # Canonical screen ownership.
          if 'window.__catlakLiveCombatCenter&&s()&&!l&&i()==="gm")return' not in core:
              raise SystemExit('Legacy GM canlı masa rendererı halen yeni masayı tetikleyebilir')
          if '__catlakPlayerSheetHardRecoveryV30' not in sheet:
              raise SystemExit('Oyuncu Masası canonical recovery sürümü beklenenden farklı')
          if 'window.__catlakBattleRoomV3Test' not in battle or 'br3RestoreCached' not in battle:
              raise SystemExit('Savaş Odası canonical renderer/cache eksik')
          if 'closeBattle:ccrCloseBattle' not in rooms:
              raise SystemExit('Oyuncu route ayrıştırması eksik')
          if 'cc-live-battle-only' not in compact:
              raise SystemExit('Canlı Oyun Masası battle-only sahibi eksik')
          if 'cachedBoardHtml' not in live or 'restoreCachedBoard' not in live:
              raise SystemExit('Canlı Oyun Masası canonical cache eksik')
          if "['logs','Oturum Günlüğü']" in gm:
              raise SystemExit('Oturum Günlüğü GM Merkezi rotalarından kaldırılmadı')
          if "['rules','Kaynaklar'],['account','Hesap']" not in gm:
              raise SystemExit('Kaynaklar/Hesap GM Merkezi sonunda değil')

          # Performance budget: no polling in the critical patched runtimes.
          for name,text in [
              ('battle-room-v3-patch.js',battle),
              ('presence-patch.js',presence),
              ('quality-of-life-patch.js',qol),
          ]:
              if 'setInterval(' in text:
                  raise SystemExit(name+' sürekli polling içeriyor')

          print('RUNTIME_OWNERSHIP_CURRENT_OK')
          PY
