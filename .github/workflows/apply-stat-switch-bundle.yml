name: Apply Stat Switch Bundle Delivery
on:
  push:
    paths:
      - '.github/workflows/apply-stat-switch-bundle.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Patch stat switch delivery
        run: |
          python3 - <<'PY'
          from pathlib import Path

          hotfix=Path('hotfix-patch.js')
          s=hotfix.read_text(encoding='utf-8')
          marker='__catlakBundleStatSwitchV2'
          if marker not in s:
              s += r'''

// ---------- Stat Atölyesi: en erken bundle capture karakter seçimi ----------
(function(){
  if(window.__catlakBundleStatSwitchV2)return;
  window.__catlakBundleStatSwitchV2=true;
  let token=0;
  const listSel='#app main .cux-character-list';
  const buttonSel='#app main [data-cux-character]';
  const editorId=()=>String(document.querySelector('#app main [data-cux-editor]')?.dataset?.cuxEditor||'');
  const selectedId=()=>{try{return String(window.__catlakStatsTest?.selected?.()||'')}catch(_){return''}};
  const open=()=>!!document.querySelector(listSel);
  function fromPoint(x,y){
    if(!Number.isFinite(x)||!Number.isFinite(y))return null;
    const list=document.querySelector(listSel);if(!list)return null;
    const lr=list.getBoundingClientRect();if(x<lr.left||x>lr.right||y<lr.top||y>lr.bottom)return null;
    for(const b of list.querySelectorAll('[data-cux-character]')){const r=b.getBoundingClientRect();if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom)return b}
    return null;
  }
  function buttonFromEvent(e){return e.target?.closest?.(buttonSel)||fromPoint(Number(e.clientX),Number(e.clientY))}
  function choose(id){
    id=String(id||'');if(!id||!open())return false;
    const mine=++token;
    const tab=document.querySelector('#app .nav [data-cc-stats-tab]');if(tab&&!tab.classList.contains('on'))tab.classList.add('on');
    const run=async attempt=>{
      if(mine!==token||!open())return;
      const api=window.__catlakStatsTest;
      if(!api||typeof api.select!=='function'){if(attempt<12)setTimeout(()=>run(attempt+1),25);return}
      try{api.select(id)}catch(e){console.warn('BUNDLE_STAT_SELECT',e)}
      await new Promise(r=>requestAnimationFrame(r));
      if(mine!==token)return;
      if(selectedId()===id&&editorId()===id)return;
      if(typeof api.render==='function'){
        try{await Promise.resolve(api.render(true))}catch(e){console.warn('BUNDLE_STAT_RENDER',e)}
        if(mine!==token)return;
        try{api.select(id)}catch(e){console.warn('BUNDLE_STAT_RESELECT',e)}
      }
      await new Promise(r=>requestAnimationFrame(r));
      if((selectedId()!==id||editorId()!==id)&&attempt<4)setTimeout(()=>run(attempt+1),45);
    };
    run(0);return true;
  }
  function intercept(e){
    if(e.button!=null&&e.button!==0)return;
    const b=buttonFromEvent(e);if(!b)return;
    const id=String(b.dataset.cuxCharacter||'');if(!id)return;
    e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();choose(id);
  }
  window.addEventListener('pointerdown',intercept,true);
  window.addEventListener('mousedown',intercept,true);
  window.addEventListener('click',intercept,true);
  window.__catlakBundleStatSwitch={choose,selected:selectedId,editor:editorId};
})();
'''
              hotfix.write_text(s,encoding='utf-8')

          index=Path('index.html')
          s=index.read_text(encoding='utf-8')
          s=s.replace('stat-editor-hardfix.js?v=statfix-v1','stat-editor-hardfix.js?v=statfix-v3-early-switch')
          index.write_text(s,encoding='utf-8')

          headers=Path('_headers')
          s=headers.read_text(encoding='utf-8')
          block='/stat-editor-hardfix.js\n  Cache-Control: no-store, no-cache, must-revalidate, max-age=0\n'
          if '/stat-editor-hardfix.js\n' not in s:
              s += block
          headers.write_text(s,encoding='utf-8')
          PY
      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hotfix-patch.js index.html _headers
          if git diff --cached --quiet; then echo 'Already applied'; exit 0; fi
          git commit -m "Stat karakter geçişini bundle ve cache katmanında düzelt"
          git push origin HEAD:${{ github.ref_name }}
