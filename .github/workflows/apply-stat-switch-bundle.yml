name: Apply Stat Switch Bundle Delivery
on:
  push:
    paths:
      - '.github/workflows/apply-stat-switch-bundle.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Patch stat switch delivery
        env:
          STAT_SWITCH_B64: 
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          hotfix=Path('hotfix-patch.js')
          s=hotfix.read_text(encoding='utf-8')
          marker='__catlakBundleStatSwitchV2'
          if marker not in s:
              s += base64.b64decode(os.environ['STAT_SWITCH_B64']).decode('utf-8')
              hotfix.write_text(s,encoding='utf-8')
          index=Path('index.html')
          s=index.read_text(encoding='utf-8')
          s=s.replace('stat-editor-hardfix.js?v=statfix-v1','stat-editor-hardfix.js?v=statfix-v4-character-switch')
          index.write_text(s,encoding='utf-8')
          headers=Path('_headers')
          s=headers.read_text(encoding='utf-8')
          block='/stat-editor-hardfix.js\n  Cache-Control: no-store, no-cache, must-revalidate, max-age=0\n'
          if '/stat-editor-hardfix.js\n' not in s:
              s += block
          headers.write_text(s,encoding='utf-8')
          PY
      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hotfix-patch.js index.html _headers
          if git diff --cached --quiet; then echo 'Already applied'; exit 0; fi
          git commit -m "Stat karakter geçişini bundle ve cache katmanında düzelt"
          git push origin HEAD:${{ github.ref_name }}
