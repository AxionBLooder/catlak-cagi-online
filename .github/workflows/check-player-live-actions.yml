name: Check Player Live Actions
on:
  push:
    paths:
      - 'player-live-actions-patch.js'
      - 'player-sheet-runtime-v4.js'
      - 'item-system-patch.js'
      - 'index.html'
      - '.github/workflows/check-player-live-actions.yml'
  workflow_dispatch:
jobs:
  player-live:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - name: Static checks
        run: |
          set -euo pipefail
          node --check player-live-actions-patch.js
          node --check player-sheet-runtime-v4.js
          node --check item-system-patch.js
          ! grep -q 'location.reload()' item-system-patch.js
          grep -q 'catlak_roll_weapon' player-live-actions-patch.js
          grep -q 'Hasar Vur' player-live-actions-patch.js
          ! grep -q 'catlak_roll_stat' player-live-actions-patch.js
          grep -q 'plaStaticStats' player-live-actions-patch.js
          grep -q 'plaClaimInventory' player-live-actions-patch.js
          grep -q '__catlakPlayerLiveOwnsInventory' player-live-actions-patch.js
          grep -q 'player-live-actions-patch.js' index.html
          grep -q 'player-sheet-runtime-v4.js' index.html
          ! grep -q 'player-sheet-patch.js' index.html
          grep -q 'item-system-patch.js' index.html
          grep -q "table:'catlak_inventory'" player-live-actions-patch.js
          grep -q "table:'catlak_rolls'" player-live-actions-patch.js
      - name: Install browser driver
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright-core
      - name: Browser action and realtime smoke
        run: |
          cat > player-live-smoke.cjs <<'JS'
          const {chromium}=require('playwright-core');
          const {execFileSync}=require('child_process');
          const path=require('path');
          (async()=>{
            let exe='';for(const c of ['google-chrome','google-chrome-stable','chromium']){try{exe=execFileSync('bash',['-lc',`command -v ${c}`],{encoding:'utf8'}).trim();if(exe)break}catch{}}
            if(!exe)throw new Error('Chrome missing');
            const browser=await chromium.launch({headless:true,executablePath:exe,args:['--no-sandbox','--disable-gpu']});
            try{
              const page=await browser.newPage();const errors=[];page.on('pageerror',e=>errors.push(String(e.message||e)));
              await page.setContent(`<!doctype html><meta charset="utf-8"><style>.hidden{display:none}</style><div id="app"><div class="role">OYUNCU</div><nav class="nav"><button class="on" data-tab="sheet">Oyuncu Masası</button></nav><main><div class="cc-character-stack"><section class="card hero"><h1>Test</h1><div class="vitals"><div class="vital"><span>HP</span><b>10/20</b><button data-a="hp" data-id="char-1">-</button></div></div></section><section class="card"><div class="eyebrow">D20 TESTLERİ</div><h2>Statına bas, zarını at</h2><div class="stats"><button id="dex" class="stat" data-a="stat" data-id="char-1" data-stat="DEX"><b>DEX</b><strong>14</strong><small>+2 • d20 at</small></button></div></section><section class="card ps-inventory-card"><div class="eyebrow">CANLI ENVANTER</div><h2>Silah • Zırh • Eşya</h2></section><section class="card ps-roll-card"><div class="eyebrow">SON ZARLAR</div></section></div></main></div><div id="toast" class="hidden"></div>`);
              await page.evaluate(()=>{
                window.__db={catlak_inventory:[{id:'inv-1',character_id:'char-1',item_id:'item-1',quantity:1,equipped:true,equipped_slot:'main_weapon',player_note:'',granted_at:'2026-01-01'}],catlak_items:[{id:'item-1',name:'Test Kılıcı',item_type:'weapon',description:'',attack_stat:'DEX',attack_bonus:0,attack_formula:'1d20',damage_formula:'1d8',damage_type:'Kesici',effects:{},ac_mode:'none',ac_value:0,is_active:true}],catlak_rolls:[]};
                window.__rpcCalls=[];window.__baseHits=0;window.__handlers={};
                document.querySelector('#app').addEventListener('click',e=>{if(e.target.closest('[data-a]'))window.__baseHits++});
                function q(table){const obj={select(){return obj},in(){return obj},order(){return obj},limit(){return obj},then(ok,bad){return Promise.resolve({data:window.__db[table]||[],error:null}).then(ok,bad)}};return obj}
                const channel={on(_ev,filter,cb){(window.__handlers[filter.table]??=[]).push(cb);return channel},subscribe(){return channel}};
                window.__fire=table=>(window.__handlers[table]||[]).forEach(fn=>fn({eventType:'UPDATE'}));
                window.__catlakSupabase={from:table=>q(table),channel:()=>channel,rpc:async(name,args)=>{window.__rpcCalls.push({name,args});if(name==='catlak_roll_weapon'){const damage=args.p_action==='damage';const r={id:'roll-'+(window.__db.catlak_rolls.length+1),character_id:'char-1',label:'Test Kılıcı • '+(damage?'Hasar':'Saldırı'),roll_kind:damage?'weapon_damage':'weapon_attack',stat:'DEX',formula:damage?'1d8':'1d20',modifier:2,total:damage?8:17,dice:[damage?6:15],created_at:new Date().toISOString()};window.__db.catlak_rolls.unshift(r);return{data:r,error:null}}return{data:null,error:null}}};
              });
              await page.addScriptTag({path:path.resolve('player-sheet-runtime-v4.js')});
              await page.addScriptTag({path:path.resolve('player-live-actions-patch.js')});
              await page.evaluate(async()=>{await window.__catlakPlayerLiveTest.refresh(true);window.__catlakPlayerSheetTest.apply()});
              await page.waitForFunction(()=>document.body.textContent.includes('Test Kılıcı')&&document.body.textContent.includes('Saldırı At')&&document.body.textContent.includes('Hasar Vur'));
              await page.getByRole('button',{name:'Saldırı At',exact:true}).click();
              await page.getByRole('button',{name:'Hasar Vur',exact:true}).click();
              const out=await page.evaluate(()=>({calls:window.__rpcCalls,baseHits:window.__baseHits,inventory:document.body.textContent,owner:window.__catlakPlayerLiveOwnsInventory,envTitle:[...document.querySelectorAll('.eyebrow')].some(x=>x.textContent==='ENVANTER')}));
              const weapon=out.calls.filter(x=>x.name==='catlak_roll_weapon').map(x=>x.args.p_action);
              if(weapon.join(',')!=='attack,damage'||out.baseHits!==0||out.owner!==true||!out.envTitle)throw new Error('Player live failed '+JSON.stringify(out));
              if(errors.length)throw new Error(errors.join(' | '));
              console.log('PLAYER_LIVE_ACTIONS_V4_OK',JSON.stringify({weapon,envTitle:out.envTitle}));
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node player-live-smoke.cjs
