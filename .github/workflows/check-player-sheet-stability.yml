name: Check Player Sheet Stability

on:
  push:
    branches: [main]
    paths:
      - 'player-sheet-hard-recovery.js'
      - 'battle-room-v3-patch.js'
      - 'room-system-patch.js'
      - 'index.html'
      - '.github/workflows/check-player-sheet-stability.yml'
  workflow_dispatch:

jobs:
  player-stability:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
      - name: Verify current player screen contract
        run: |
          set -euo pipefail
          node --check player-sheet-hard-recovery.js
          node --check battle-room-v3-patch.js
          node --check room-system-patch.js
          python3 - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          sheet=Path('player-sheet-hard-recovery.js').read_text(encoding='utf-8')
          battle=Path('battle-room-v3-patch.js').read_text(encoding='utf-8')
          rooms=Path('room-system-patch.js').read_text(encoding='utf-8')

          checks={
            'sheet version':'player-hard-recovery-v38-canonical-advanced' in html,
            'canonical owner':'__catlakPlayerSheetHardRecoveryV32' in sheet,
            'sheet cache':'cachedSheetHtml' in sheet and 'restoreCachedSheet' in sheet,
            'race nav':'data-cc-hard-race-nav' in sheet and 'setRaceView' in sheet,
            'race powers left':'[data-cc-hard-race]{display:block!important;grid-column:1!important;grid-row:1!important;justify-self:stretch!important' in sheet,
            'abilities right':'[data-cc-hard-abilities]{display:block!important;grid-column:2!important;grid-row:1!important;justify-self:stretch!important' in sheet,
            'two independent columns':'grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important' in sheet,
            'race main full width':'main.cc-hard-race-view[data-cc-hard-sheet="1"]{width:100%!important;max-width:none!important' in sheet,
            'outer race shell removed':'border:0!important;border-radius:0!important;background:transparent!important;box-shadow:none!important' in sheet,
            'player desk full width':'main[data-cc-hard-sheet="1"]:not(.cc-hard-race-view){width:100%!important;max-width:none!important' in sheet,
            'player realtime batched':'queueSheetSync' in sheet and 'cc-player-hard-sheet-v3' in sheet,
            'each list grows downward':'[data-cc-hard-race]>.grid' in sheet and '[data-cc-hard-abilities]>.grid' in sheet and 'grid-template-columns:1fr!important' in sheet,
            'mobile fallback':'main.cc-hard-race-view[data-cc-hard-sheet="1"] .cc-hard-right{grid-template-columns:1fr!important' in sheet and '[data-cc-hard-abilities]{grid-column:1!important;grid-row:2!important' in sheet,
            'single roll result':'showRollFlash(cid,roll);\n    toast(' not in sheet,
            'battle cache':'br3CachedHtml' in battle and 'br3RestoreCached' in battle,
            'battle preload':'br3PreloadData' in battle,
            'battle route owner':'closeBattle:ccrCloseBattle' in rooms,
            'battle atomic transition':"begin?.('player-battle')" in rooms and 'ccrQueueRealtime' in rooms,
            'battle duplicate realtime removed':"table:'catlak_combat_state'" not in battle and "table:'catlak_combatants'" not in battle,
            'sheet core-first fallback':'coreSheetVisible' in sheet and "window.addEventListener('catlak:player-fast-ready'" in sheet,
            'battle fixed geometry':'ccr-battle-surface' in rooms and 'br3NormalizeMain' in battle,
            'guest query tolerant':"6500,'character owner query'" in sheet and "5000,'character dom handoff'" in sheet,
            'guest no auto retry':"setTimeout(()=>schedule(true,0),900)" not in sheet and "if(queued)return" in sheet,
            'waiting card stable':'data-cc-hard-wait-text' in sheet,
            'canonical advanced owner':"if(sheetActive())return true" in sheet and '8500' in html,
            'hp amount control':'data-cc-hard-hp-amount' in sheet and 'data-mode="damage"' in sheet and 'data-mode="heal"' in sheet,
            'weapon slots visible':'1. Yuvaya Ata' in sheet and '2. Yuvaya Ata' in sheet and 'ws-slot-controls' in sheet,
            'large roll result':'font-size:4.2rem' in sheet and 'setTimeout(()=>box.remove(),3600)' in sheet,
            'race exact surface':"m.className=on?'cc-hard-race-view':''" in sheet,
            'battle no stale restore':'main.replaceChildren()' in rooms and 'window.__catlakBattleRoomV3Test?.restore?.()' not in rooms,
            'complete detail budget':"[],4500" in sheet and "{},[],4500" in sheet,
            'realtime no takeover':"if(!sheetActive()||!(main()?.dataset.ccHardSheet==='1'&&ready()))return" in sheet,
          }
          bad=[name for name,ok in checks.items() if not ok]
          if bad: raise SystemExit('PLAYER_STABILITY_FAIL: '+', '.join(bad))

          retired=['player-sheet-patch.js','player-live-actions-patch.js','stat-roll-patch.js','battle-action-stability-patch.js']
          for name in retired:
              if name in html:
                  raise SystemExit('Eski oyuncu runtime yeniden yüklenmiş: '+name)

          if 'setInterval(' in sheet or 'setInterval(' in battle:
              raise SystemExit('Oyuncu kritik runtime polling içeriyor')
          print('PLAYER_STABILITY_CURRENT_OK')
          PY
