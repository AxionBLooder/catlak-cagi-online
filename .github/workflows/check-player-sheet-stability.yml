name: Check Player Sheet Stability

on:
  push:
    branches: [main]
    paths:
      - 'player-sheet-hard-recovery.js'
      - 'battle-room-v3-patch.js'
      - 'room-system-patch.js'
      - 'index.html'
      - '.github/workflows/check-player-sheet-stability.yml'
  workflow_dispatch:

jobs:
  player-stability:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
      - name: Verify current player screen contract
        run: |
          set -euo pipefail
          node --check player-sheet-hard-recovery.js
          node --check battle-room-v3-patch.js
          node --check room-system-patch.js
          python3 - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          sheet=Path('player-sheet-hard-recovery.js').read_text(encoding='utf-8')
          battle=Path('battle-room-v3-patch.js').read_text(encoding='utf-8')
          rooms=Path('room-system-patch.js').read_text(encoding='utf-8')

          checks={
            'sheet version':'player-hard-recovery-v29-race-columns-stable' in html,
            'canonical owner':'__catlakPlayerSheetHardRecoveryV29' in sheet,
            'sheet cache':'cachedSheetHtml' in sheet and 'restoreCachedSheet' in sheet,
            'race nav':'data-cc-hard-race-nav' in sheet and 'setRaceView' in sheet,
            'race powers left':'[data-cc-hard-race]{display:block!important;grid-column:1!important;justify-self:start!important' in sheet,
            'abilities right':'[data-cc-hard-abilities]{display:block!important;grid-column:2!important;justify-self:end!important' in sheet,
            'two independent columns':'grid-template-columns:minmax(0,560px) minmax(0,560px)!important' in sheet,
            'each list grows downward':'[data-cc-hard-race]>.grid' in sheet and '[data-cc-hard-abilities]>.grid' in sheet and 'grid-template-columns:1fr!important' in sheet,
            'mobile fallback':'main.cc-hard-race-view[data-cc-hard-sheet="1"] .cc-hard-right{grid-template-columns:1fr!important' in sheet,
            'single roll result':'showRollFlash(cid,roll);\n    toast(' not in sheet,
            'battle cache':'br3CachedHtml' in battle and 'br3RestoreCached' in battle,
            'battle preload':'br3PreloadData' in battle,
            'battle route owner':'closeBattle:ccrCloseBattle' in rooms,
          }
          bad=[name for name,ok in checks.items() if not ok]
          if bad: raise SystemExit('PLAYER_STABILITY_FAIL: '+', '.join(bad))

          retired=['player-sheet-patch.js','player-live-actions-patch.js','stat-roll-patch.js','battle-action-stability-patch.js']
          for name in retired:
              if name in html:
                  raise SystemExit('Eski oyuncu runtime yeniden yüklenmiş: '+name)

          if 'setInterval(' in sheet or 'setInterval(' in battle:
              raise SystemExit('Oyuncu kritik runtime polling içeriyor')
          print('PLAYER_STABILITY_CURRENT_OK')
          PY
