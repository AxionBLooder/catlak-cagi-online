# LEGACY CHECK QUARANTINED: current playable runtime is guarded by Check Playable Hardening.
name: Check Live Game Entry Transition
on:
  workflow_dispatch:

jobs:
  transition:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Static checks
        run: |
          set -euo pipefail
          node --check live-game-entry-guard.js
          grep -Fq 'live-game-entry-guard.js?v=live-entry-v2' index.html
          grep -Fq 'cc-live-entry-pending' live-game-entry-guard.js
          grep -Fq 'ccSimpleLive' live-game-entry-guard.js
          grep -Fq "main.querySelector('[data-lcc-board]')" live-game-entry-guard.js
      - name: Install browser driver
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright-core
      - name: Verify old live page and partial new page never become visible
        run: |
          cat > live-entry-smoke.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"><style>html,body{background:#071019;color:white}</style></head><body>
          <div id="app"><span class="role">GM</span><nav class="nav"><button data-tab="home" class="on">Home</button><button data-tab="gm">Canlı Oyun Masası</button></nav><main><section>BAŞLANGIÇ</section></main></div>
          <script>window.__catlakLiveCombatCenter={};</script>
          <script src="./live-game-entry-guard.js"></script>
          <script>
          window.__legacyPaintState=null;window.__partialPaintState=null;
          document.querySelector('#app').addEventListener('click',e=>{
            const b=e.target.closest('[data-tab]');if(!b)return;document.querySelectorAll('.nav .on').forEach(x=>x.classList.remove('on'));b.classList.add('on');const main=document.querySelector('main');
            if(b.dataset.tab==='gm'){
              main.removeAttribute('data-cc-simple-live');main.innerHTML='<section id="legacy-live">GM CANLI MASA • ESKİ SAYFA</section>';
              window.__legacyPaintState={visibility:getComputedStyle(main).visibility,pending:document.documentElement.classList.contains('cc-live-entry-pending')};
              setTimeout(()=>{main.innerHTML='<section>CANLI OYUN MASASI</section><div class="cc-live-two">Oyuncular & Zarlar</div>';main.dataset.ccSimpleLive='1';window.__partialPaintState={visibility:getComputedStyle(main).visibility,pending:document.documentElement.classList.contains('cc-live-entry-pending')};setTimeout(()=>{main.insertAdjacentHTML('beforeend','<section data-lcc-board>Savaş Kontrolü</section>')},120)},120);
            }
          });
          </script></body></html>
          HTML
          python3 -m http.server 4174 --bind 127.0.0.1 >/tmp/live-entry-http.log 2>&1 & PID=$!; trap 'kill $PID 2>/dev/null || true' EXIT
          cat > live-entry-smoke.cjs <<'JS'
          const {chromium}=require('playwright-core');const {execFileSync}=require('child_process');
          (async()=>{let exe='';for(const c of ['google-chrome','google-chrome-stable','chromium']){try{exe=execFileSync('bash',['-lc',`command -v ${c}`],{encoding:'utf8'}).trim();if(exe)break}catch{}}if(!exe)throw new Error('Chrome missing');const browser=await chromium.launch({headless:true,executablePath:exe,args:['--no-sandbox','--disable-gpu']});try{const p=await browser.newPage();const errors=[];p.on('pageerror',e=>errors.push(String(e.message||e)));await p.goto('http://127.0.0.1:4174/live-entry-smoke.html',{waitUntil:'domcontentloaded'});await p.click('[data-tab="gm"]');await p.waitForFunction(()=>window.__partialPaintState);const states=await p.evaluate(()=>({legacy:window.__legacyPaintState,partial:window.__partialPaintState}));if(states.legacy.visibility!=='hidden'||!states.legacy.pending)throw new Error('Legacy page visible '+JSON.stringify(states));if(states.partial.visibility!=='hidden'||!states.partial.pending)throw new Error('Partial new page visible '+JSON.stringify(states));await p.waitForSelector('main[data-cc-simple-live="1"] [data-lcc-board]');await p.waitForFunction(()=>!document.documentElement.classList.contains('cc-live-entry-pending'));const final=await p.locator('main').evaluate(el=>({visibility:getComputedStyle(el).visibility,text:el.innerText}));if(final.visibility==='hidden'||!final.text.includes('Savaş Kontrolü'))throw new Error('Final live not ready '+JSON.stringify(final));if(errors.length)throw new Error(errors.join(' | '));console.log('LIVE_ENTRY_V2_OK',JSON.stringify({states,final}))}finally{await browser.close()}})().catch(e=>{console.error(e);process.exit(1)});
          JS
          node live-entry-smoke.cjs
