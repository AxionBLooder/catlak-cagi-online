name: Check Player UI Actions
on:
  push:
    paths:
      - 'player-sheet-hard-recovery.js'
      - 'index.html'
      - '.github/workflows/check-player-ui-actions.yml'
  workflow_dispatch:

jobs:
  player-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - name: Static checks
        run: |
          set -euo pipefail
          node --check player-sheet-hard-recovery.js
          grep -Fq 'player-hard-recovery-v16-party-race' index.html
      - name: Install browser driver
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright-core
      - name: Verify cleaned interactive player sheet
        run: |
          cat > player-ui-actions-smoke.cjs <<'JS'
          const {chromium}=require('playwright-core');
          const {execFileSync}=require('child_process');
          const path=require('path');
          function chromePath(){
            for(const c of ['google-chrome','google-chrome-stable','chromium']){
              try{const p=execFileSync('bash',['-lc',`command -v ${c}`],{encoding:'utf8'}).trim();if(p)return p}catch{}
            }
            throw new Error('Chrome missing');
          }
          const hardTimeout=setTimeout(()=>{console.error('PLAYER_UI_ACTIONS_TIMEOUT');process.exit(2)},25000);
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:chromePath(),args:['--no-sandbox']});
            try{
              const page=await browser.newPage();page.setDefaultTimeout(6000);
              await page.setContent(`<!doctype html><meta charset="utf-8"><style>.hidden{display:none}</style>
                <div id="app"><header><span class="role">MİSAFİR</span></header>
                <nav class="nav"><button class="on" data-tab="sheet">Oyuncu Masası</button><button data-tab="account">Oturum</button></nav>
                <main><section class="card cc-desk-intro"><h1>Canlı Karakterlerim</h1></section></main></div>
                <div id="toast" class="hidden"></div>`);
              await page.evaluate(()=>{
                window.__calls=[];
                window.__handlers={};
                window.__db={
                  catlak_characters:[{id:'c1',name:'Eeliot',owner_id:'u1',play_status:'active',species_name:'İnsan',class_name:'Büyücü',background_name:'Portal Araştırmacısı',level:3,hp_current:22,hp_max:22,base_ac:13,base_speed:30,base_stats:{STR:8,DEX:14,CON:14,INT:16,WIS:15,CHA:12},data:{},created_at:'2026-01-01'}],
                  catlak_inventory:[{id:'i1',character_id:'c1',item_id:'w1',quantity:1,equipped:true,equipped_slot:'main_weapon',granted_at:'2026-01-01'}],
                  catlak_items:[{id:'w1',name:'Kılıç',item_type:'weapon',description:'',attack_stat:'DEX',attack_bonus:0,attack_formula:'1d20',damage_formula:'1d8',damage_type:'Kesici',effects:{},ac_mode:'none',ac_value:0,is_active:true,created_at:'2026-01-01'}],
                  catlak_rolls:[],catlak_species_powers:[],catlak_special_paths:[],catlak_character_conditions:[]
                };
                function rows(t,f,ins){let a=(window.__db[t]||[]).slice();for(const[k,v]of f)a=a.filter(x=>String(x[k])===String(v));for(const[k,v]of ins)a=a.filter(x=>v.map(String).includes(String(x[k])));return a}
                function q(t){const st={f:[],ins:[],single:false,lim:null};const o={
                  select(){return o},eq(k,v){st.f.push([k,v]);return o},in(k,v){st.ins.push([k,v]);return o},order(){return o},limit(n){st.lim=n;return o},maybeSingle(){st.single=true;return o},
                  then(ok,bad){let d=rows(t,st.f,st.ins);if(st.lim!=null)d=d.slice(0,st.lim);if(st.single)d=d[0]||null;return Promise.resolve({data:d,error:null}).then(ok,bad)}
                };return o}
                const ch={on(_e,f,cb){(window.__handlers[f.table]??=[]).push(cb);return ch},subscribe(){return ch}};
                const fire=t=>(window.__handlers[t]||[]).forEach(fn=>fn({eventType:'INSERT'}));
                window.__catlakSupabase={
                  auth:{getSession:async()=>({data:{session:{user:{id:'u1'}}}})},
                  from:q,channel:()=>ch,
                  rpc:async(name,args={})=>{
                    window.__calls.push({name,args});
                    if(name==='catlak_player_combat_snapshot')return{data:{active:false,order:[]},error:null};
                    if(name==='catlak_player_abilities')return{data:[],error:null};
                    if(name==='catlak_roll_stat'){const r={id:'r1',character_id:'c1',label:args.p_stat+' Testi',roll_kind:'stat',formula:'1d20',modifier:2,total:16,dice:[14],created_at:new Date().toISOString()};window.__db.catlak_rolls.unshift(r);fire('catlak_rolls');return{data:r,error:null}}
                    if(name==='catlak_update_my_hp'){window.__db.catlak_characters[0].hp_current=args.p_hp;fire('catlak_characters');return{data:args.p_hp,error:null}}
                    if(name==='catlak_set_equipped_slot'){window.__db.catlak_inventory[0].equipped=true;window.__db.catlak_inventory[0].equipped_slot=args.p_slot;fire('catlak_inventory');return{data:true,error:null}}
                    if(name==='catlak_roll_weapon')return{data:{label:'Kılıç • Saldırı',total:18},error:null};
                    return{data:null,error:null}
                  }
                };
              });
              console.log('STEP hard load start');await page.addScriptTag({path:path.resolve('player-sheet-hard-recovery.js')});console.log('STEP hard load done');
              console.log('STEP wait stat');await page.waitForSelector('[data-cc-hard-stat="DEX"]');console.log('STEP stat ready');
              await page.waitForFunction(()=>!document.querySelector('.cc-desk-intro'));
              const text=await page.locator('main').innerText();
              if(/D20 TESTLERİ|d20 at|1d20/i.test(text))throw new Error('D20 labels still visible: '+text);
              const layout=await page.evaluate(()=>({
                statTop:document.querySelector('[data-cc-hard-stats]').getBoundingClientRect().top,
                invTop:document.querySelector('[data-cc-hard-inventory]').getBoundingClientRect().top,
                statLeft:document.querySelector('[data-cc-hard-stats]').getBoundingClientRect().left,
                equipLeft:document.querySelector('[data-cc-hard-equipment]').getBoundingClientRect().left,
                equipPosition:getComputedStyle(document.querySelector('[data-cc-hard-equipment]')).position,
                slotColumns:getComputedStyle(document.querySelector('.cc-slot-deck')).gridTemplateColumns,
                hasRollHistory:!!document.querySelector('[data-cc-hard-rolls]')
              }));
              if(!(layout.statTop<layout.invTop)||!(layout.equipLeft>layout.statLeft)||layout.equipPosition==='sticky'||layout.hasRollHistory||layout.slotColumns.split(' ').length<2)throw new Error('PLAYER_LAYOUT_FAILED '+JSON.stringify(layout));
              if(!/1\. Silah/.test(text)||!/2\. Silah/.test(text))throw new Error('Weapon slots missing: '+text);
              const stat=page.locator('[data-cc-hard-stat="DEX"]');
              if(await stat.getAttribute('aria-disabled'))throw new Error('DEX is disabled');
              await page.evaluate(()=>{document.documentElement.style.minHeight='2600px';document.body.style.minHeight='2600px';window.scrollTo(0,260);window.__stableMain=document.querySelector('main');window.__stableStack=document.querySelector('.cc-character-stack')});
              await page.waitForFunction(()=>window.scrollY>50);
              const baseY=await page.evaluate(()=>{window.__baseY=window.scrollY;return window.scrollY});
              console.log('STEP stat click');const rollStart=Date.now();await stat.click();console.log('STEP stat clicked');
              await page.waitForFunction(()=>window.__calls.some(x=>x.name==='catlak_roll_stat'&&x.args.p_stat==='DEX'));
              await page.waitForFunction(()=>document.querySelector('.cc-roll-flash')?.textContent.includes('DEX Testi'));
              const rollLatency=Date.now()-rollStart;if(rollLatency>800)throw new Error('ROLL_UI_TOO_SLOW '+rollLatency);
              let stable=await page.evaluate(()=>({sameMain:window.__stableMain===document.querySelector('main'),sameStack:window.__stableStack===document.querySelector('.cc-character-stack'),y:window.scrollY}));
              if(!stable.sameMain||!stable.sameStack||Math.abs(stable.y-baseY)>3)throw new Error('ROLL_RESET '+JSON.stringify(stable));
              console.log('STEP hp click');await page.locator('[data-cc-hard-hp][data-d="-1"]').dispatchEvent('click');console.log('STEP hp clicked');
              await page.waitForFunction(()=>window.__calls.some(x=>x.name==='catlak_update_my_hp'&&x.args.p_hp===21));
              await page.waitForTimeout(180);
              stable=await page.evaluate(()=>({sameMain:window.__stableMain===document.querySelector('main'),sameStack:window.__stableStack===document.querySelector('.cc-character-stack'),y:window.scrollY}));
              if(!stable.sameMain||!stable.sameStack||Math.abs(stable.y-baseY)>3)throw new Error('HP_RESET '+JSON.stringify(stable));
              console.log('STEP slot click');await page.locator('[data-ws-slot="off_weapon"]').first().dispatchEvent('click');console.log('STEP slot clicked');
              await page.waitForFunction(()=>window.__calls.some(x=>x.name==='catlak_set_equipped_slot'&&x.args.p_slot==='off_weapon'));
              await page.waitForTimeout(180);
              stable=await page.evaluate(()=>({sameMain:window.__stableMain===document.querySelector('main'),sameStack:window.__stableStack===document.querySelector('.cc-character-stack'),y:window.scrollY}));
              if(!stable.sameMain||!stable.sameStack||Math.abs(stable.y-baseY)>3)throw new Error('SLOT_RESET '+JSON.stringify(stable));
              await page.locator('[data-cc-hard-race-nav]').click();
              await page.waitForTimeout(320);
              const race=await page.evaluate(()=>({sameMain:window.__stableMain===document.querySelector('main'),sameStack:window.__stableStack===document.querySelector('.cc-character-stack'),y:window.scrollY,raceDisplay:getComputedStyle(document.querySelector('[data-cc-hard-race]')).display,heroDisplay:getComputedStyle(document.querySelector('section.hero')).display,raceMode:document.querySelector('main')?.classList.contains('cc-hard-race-view')}));
              if(!race.sameMain||!race.sameStack||race.raceDisplay==='none'||race.heroDisplay!=='none'||!race.raceMode)throw new Error('RACE_NAV_RESET '+JSON.stringify(race));
              console.log('PLAYER_UI_ACTIONS_OK');
              clearTimeout(hardTimeout);
              process.exit(0);
            }finally{browser.close().catch(()=>{})}
          })().catch(e=>{console.error(e);clearTimeout(hardTimeout);process.exit(1)});
          JS
          node player-ui-actions-smoke.cjs
