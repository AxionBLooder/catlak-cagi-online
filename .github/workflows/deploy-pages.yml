name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: catlak-github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Prepare static site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          cp index.html browser-build.json catalog.b64 *.js _site/
          touch _site/.nojekyll
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('_site/browser-app.js')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'https://cdn\.jsdelivr\.net/gh/AxionBLooder/catlak-cagi-online@[0-9a-f]+/catalog\.b64','./catalog.b64',s)
          p.write_text(s,encoding='utf-8')
          PY
          python3 build-gm-route-fix.py _site
          python3 build-gm-click-fix.py _site
          python3 build-gm-shell-speed.py _site
          python3 build-gm-shell-speed-guard.py _site
          python3 - <<'PY'
          from pathlib import Path
          p=Path('_site/index.html')
          s=p.read_text(encoding='utf-8')
          tags=[
            ('<script src="./gm-center-router-core.js?v=gmrouter-v4"></script>','<div id="toast" class="toast hidden"></div>',True),
            ('<script src="./route-stability-patch.js?v=routes-v2"></script>','</body>',False),
            ('<script src="./stat-workshop-route-fix.js?v=statsroute-v3"></script>','</body>',False),
          ]
          for tag,anchor,after in tags:
              if tag in s:
                  continue
              if anchor not in s:
                  raise SystemExit('script ekleme noktası bulunamadı')
              s=s.replace(anchor,anchor+tag if after else tag+anchor,1)
          p.write_text(s,encoding='utf-8')
          PY
          for f in _site/*.js; do node --check "$f"; done
          grep -q 'gm-center-router-core.js?v=gmrouter-v4' _site/index.html
          grep -q 'gm-tools-patch.js?v=gmtools-v6' _site/index.html
          grep -q 'gm-hub-v2-patch.js?v=gmhub-v6' _site/index.html
          grep -q 'battle-room-actions-layout-patch.js?v=battleactions-v2' _site/index.html
          grep -q 'room-guard-patch.js?v=guard-v4' _site/index.html
          grep -q 'invite-visibility-patch.js?v=inviteui-v4' _site/index.html
          grep -q "window.addEventListener('pointerdown'" _site/gm-center-router-core.js
          grep -q "bar.dataset.gm2Stable='1'" _site/gm-hub-v2-patch.js
          grep -q "async function gmtLoad(sub=gmtSub,force=false)" _site/gm-tools-patch.js
          grep -q "main.dataset.gm2Route='ability'" _site/gm-hub-v2-patch.js
          grep -q "window.__catlakGmHubOwnsMain===true&&!GM2_APP.querySelector('[data-gm2-ability-page]')" _site/gm-hub-v2-patch.js
          grep -q "setTimeout(()=>gmtRender(false),0)" _site/gm-tools-patch.js
          grep -q 'window.__catlakGmCenterRouterCore?.active' _site/invite-visibility-patch.js
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
# trigger: gm-center-persistent-shell-speed-v2-2026-09-11
