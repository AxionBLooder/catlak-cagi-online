name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: catlak-github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare safe static site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site

          # Güvenli başlangıç: canlı HTML'ye deploy sırasında ekstra runtime enjekte etme.
          cp index.html _site/index.html
          test -f browser-build.json && cp browser-build.json _site/ || true
          test -f catalog.b64 && cp catalog.b64 _site/ || true

          # Kök dizindeki tüm çalışma JS dosyalarını kopyala; dinamik loader'ların
          # ihtiyaç duyduğu dosyaların eksik kalmasını engelle.
          find . -maxdepth 1 -type f -name '*.js' -exec cp {} _site/ \;

          touch _site/.nojekyll

          # Syntax hatalı tek bir JS bile yayına çıkmasın.
          for file in _site/*.js; do
            node --check "$file"
          done

          # Ana uygulama zincirinin gerçekten pakette olduğunu doğrula.
          test -f _site/browser-app.js
          test -f _site/stat-editor-hardfix.js
          test -f _site/gm-center-router-core.js
          grep -Fq './browser-app.js' _site/index.html

          # Siyah ekranla ilişkili sonradan enjekte edilen DDB başlangıç katmanları
          # artık HTML'ye deploy aşamasında eklenmiyor.
          ! grep -Fq 'ddb-flow-core.js?v=' _site/index.html
          ! grep -Fq 'ddb-site-theme-v1.js?v=' _site/index.html
          ! grep -Fq 'ddb-builder-v2.js?v=' _site/index.html
          ! grep -Fq 'data-cc-late-runtime="1"' _site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4