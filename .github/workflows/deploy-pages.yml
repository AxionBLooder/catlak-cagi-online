name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: catlak-github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare clean static site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          cp index.html browser-build.json catalog.b64 _site/

          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path('index.html').read_text(encoding='utf-8')
          files = {
              'browser-app.js',
              'gm-campaign-state-patch.js',
              'party-eeliot-runtime-hotfix.js',
              'party-stable-entry.js',
              'live-combat-center-loader.js',
              'live-combat-center-patch.js',
              'visual-archive-map-flow-patch.js',
              'seal-character-controls-patch.js',
              'party-player-transition-fix.js',
              'global-transition-guard.js',
              'battle-party-membership-guard.js',
              'session-log-delete-fix.js',
          }
          files.update(re.findall(r'<script[^>]+src=["\']\./([^"\'?]+\.js)', html))
          files.update(re.findall(r'loadAddon\(["\']\./([^"\'?]+\.js)', html))

          missing = sorted(name for name in files if not Path(name).is_file())
          if missing:
              raise SystemExit('Eksik çalışma dosyaları: ' + ', '.join(missing))

          for name in sorted(files):
              Path('_site', name).write_bytes(Path(name).read_bytes())

          live_html = html.replace(
              'player-enemy-privacy-patch.js?v=privacy-v3-party-eeliot',
              'player-enemy-privacy-patch.js?v=privacy-v4-live-party'
          )
          live_html = live_html.replace(
              'gm-center-router-core.js?v=gmrouter-v6-campaign',
              'gm-center-router-core.js?v=gmrouter-v7-room-ownership'
          )
          live_html = live_html.replace(
              'gm-controls-patch.js?v=gmctrl-v1',
              'gm-controls-patch.js?v=gmctrl-v2-no-live-panel'
          )
          live_html = live_html.replace(
              'site-stability-patch.js?v=stability-v5&equipment-thaw-v1&no-reset-v1',
              'site-stability-patch.js?v=stability-v6-columns&equipment-thaw-v1&no-reset-v1'
          )
          live_html = live_html.replace(
              'route-stability-patch.js?v=routes-v2',
              'route-stability-patch.js?v=routes-v3-real-view'
          )

          boot_style = '''<style id="cc-global-transition-style">html.cc-global-boot-cloak #app{visibility:hidden!important}html.cc-route-cloak #app main{visibility:hidden!important}html.cc-global-boot-cloak body::before,html.cc-route-cloak body::before{content:'Çatlak Çağı hazırlanıyor…';position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;background:#071019;color:#d9e8f5;font:700 15px/1.4 system-ui,sans-serif;letter-spacing:.04em;pointer-events:none}html.cc-route-cloak body::before{content:'Bölüm hazırlanıyor…';inset:72px 0 0;background:#071019f2}</style>'''
          live_html = live_html.replace('<html lang="tr">','<html lang="tr" class="cc-global-boot-cloak">',1)
          live_html = live_html.replace('</head>',boot_style+'</head>',1)
          live_html = live_html.replace('<script src="./stat-editor-hardfix.js','<script src="./global-transition-guard.js?v=global-transition-v2"></script><script src="./stat-editor-hardfix.js',1)

          late_loader = '''<script src="./party-stable-entry.js?v=partyentry-v4-room-owner"></script><script src="./live-combat-center-loader.js?v=livecombat-loader-v1"></script><script src="./gm-campaign-state-patch.js?v=gmstate-v4-seal-editor"></script><script data-cc-late-runtime="1">(function bootLate(){if(!window.__catlakSupabase){setTimeout(bootLate,60);return}var q=["./party-eeliot-runtime-hotfix.js?v=party-v4-ready","./visual-archive-map-flow-patch.js?v=visual-flow-v1","./seal-character-controls-patch.js?v=seal-controls-v1","./battle-party-membership-guard.js?v=battle-party-v1","./party-player-transition-fix.js?v=party-transition-v1","./session-log-delete-fix.js?v=session-log-v1"],i=0;function next(){if(i>=q.length){window.__catlakLateRuntimeReady=true;window.dispatchEvent(new Event("catlak:late-ready"));return}var s=document.createElement("script");s.src=q[i++];s.async=false;s.onload=next;s.onerror=next;document.body.appendChild(s)}next()})();</script>'''
          live_html = live_html.replace('</body>', late_loader + '</body>')
          Path('_site/index.html').write_text(live_html, encoding='utf-8')

          print(f'{len(files)} çalışma dosyası dağıtıma alındı.')
          PY

          touch _site/.nojekyll
          for file in _site/*.js; do node --check "$file"; done

          grep -Fq 'class="cc-global-boot-cloak"' _site/index.html
          grep -Fq 'global-transition-guard.js?v=global-transition-v2' _site/index.html
          grep -Fq 'route-stability-patch.js?v=routes-v3-real-view' _site/index.html
          grep -Fq 'window.__catlakLateRuntimeReady=true' _site/index.html
          grep -Fq 'data-cc-late-runtime="1"' _site/index.html
          grep -Fq 'party-eeliot-runtime-hotfix.js?v=party-v4-ready' _site/index.html
          grep -Fq 'party-stable-entry.js?v=partyentry-v4-room-owner' _site/index.html
          grep -Fq 'live-combat-center-loader.js?v=livecombat-loader-v1' _site/index.html
          grep -Fq 'visual-archive-map-flow-patch.js?v=visual-flow-v1' _site/index.html
          grep -Fq 'seal-character-controls-patch.js?v=seal-controls-v1' _site/index.html
          grep -Fq 'battle-party-membership-guard.js?v=battle-party-v1' _site/index.html
          grep -Fq 'party-player-transition-fix.js?v=party-transition-v1' _site/index.html
          grep -Fq 'session-log-delete-fix.js?v=session-log-v1' _site/index.html
          ! grep -Fq '<script src="./live-combat-center-patch.js?v=livecombat-v1"></script>' _site/index.html
          grep -Fq 'gm-campaign-state-patch.js?v=gmstate-v4-seal-editor' _site/index.html
          grep -Fq 'gm-center-router-core.js?v=gmrouter-v7-room-ownership' _site/index.html
          grep -Fq 'gm-controls-patch.js?v=gmctrl-v2-no-live-panel' _site/index.html
          grep -Fq 'site-stability-patch.js?v=stability-v6-columns&equipment-thaw-v1&no-reset-v1' _site/index.html
          grep -Fq 'gm-hub-v2-patch.js?v=gmhub-v8-campaign' _site/index.html
          grep -Fq 'player-enemy-privacy-patch.js?v=privacy-v4-live-party' _site/index.html
          test -f _site/live-combat-center-loader.js
          test -f _site/live-combat-center-patch.js
          test -f _site/party-eeliot-runtime-hotfix.js
          test -f _site/party-stable-entry.js
          test -f _site/visual-archive-map-flow-patch.js
          test -f _site/seal-character-controls-patch.js
          test -f _site/party-player-transition-fix.js
          test -f _site/global-transition-guard.js
          test -f _site/battle-party-membership-guard.js
          test -f _site/session-log-delete-fix.js
          grep -Fq '__catlakGlobalTransitionGuardV2' _site/global-transition-guard.js
          grep -Fq '__catlakBattlePartyGuardV1' _site/battle-party-membership-guard.js
          grep -Fq '__catlakSessionLogDeleteFixV1' _site/session-log-delete-fix.js
          grep -Fq '__catlakLiveCombatCenterLoaderV1' _site/live-combat-center-loader.js
          grep -Fq 'livecombat-v2-runtime' _site/live-combat-center-loader.js
          grep -Fq '__catlakLiveCombatCenterV1' _site/live-combat-center-patch.js
          grep -Fq 'data-gm2-route="combat"' _site/live-combat-center-patch.js
          grep -Fq 'SAVAŞ KONTROLÜ' _site/live-combat-center-patch.js
          grep -Fq 'DURUM ETKİLERİ' _site/live-combat-center-patch.js
          grep -Fq '__catlakPartyRuntimeStableV2=true' _site/party-eeliot-runtime-hotfix.js
          grep -Fq '__catlakPartyStableEntryV3=true' _site/party-stable-entry.js
          grep -Fq '__catlakVisualArchiveMapFlowV1=true' _site/visual-archive-map-flow-patch.js
          grep -Fq '__catlakSealCharacterControlsV1=true' _site/seal-character-controls-patch.js
          grep -Fq '__catlakPartyPlayerTransitionV1=true' _site/party-player-transition-fix.js
          grep -Fq 'Parti Yönetimi' _site/party-stable-entry.js
          grep -Fq "live.textContent='Canlı Oyun'" _site/party-stable-entry.js
          grep -Fq '__catlakGmControlsLivePanelDisabled=true' _site/gm-controls-patch.js
          grep -Fq 'cc-reading-columns' _site/site-stability-patch.js
          grep -Fq '__catlakGcsDeltaPointerV2=true' _site/gm-campaign-state-patch.js
          grep -Fq '__catlakCampaignRoomStableV3=true' _site/gm-campaign-state-patch.js
          grep -Fq '__catlakSealEditorStableV1=true' _site/gm-campaign-state-patch.js
          grep -Fq 'data-gcs-edit-player' _site/gm-campaign-state-patch.js
          grep -Fq 'data-gcs-save-player' _site/gm-campaign-state-patch.js
          grep -Fq '__catlakCampaignHubStableV3=true' _site/gm-hub-v2-patch.js
          grep -Fq '__catlakCampaignRouterStableV3=true' _site/gm-center-router-core.js
          grep -Fq "GCS_PLACEHOLDER_ROUTE='campaign'" _site/gm-campaign-state-patch.js
          grep -Fq 'player-equipment-lock-patch.js?v=player-equipment-lock-v2' _site/index.html
          grep -Fq 'stat-editor-hardfix.js?v=statfix-v4-character-switch' _site/index.html
          grep -Fq 'stat-workshop-route-fix.js?v=statsroute-v6&stat-interaction-v1' _site/index.html
          grep -Fq 'stat-roll-patch.js?v=statroll-v3&no-reset-v1' _site/index.html
          grep -Fq 'browser-app.js?v=bootwatch-235-stat-interaction-v1' _site/index.html
          grep -Fq 'player-live-actions-patch.js?v=playerlive-v11&gm-equipment-only-v1' _site/index.html
          grep -Fq '__catlakCampaignStateTest' _site/gm-campaign-state-patch.js
          grep -Fq '__catlakStatEditorHardfix' _site/stat-editor-hardfix.js
          grep -Fq '__catlakBundleStatSwitchV2' _site/browser-app.js
          ! grep -Fq 'slot-sync-hotfix.js' _site/battle-ready-clean-patch.js
          ! grep -Fq 'player-sheet-final-patch.js' _site/player-sheet-final-loader.js
          ! grep -Fq 'data-a="equip"' _site/player-live-actions-patch.js
          ! grep -Fq 'data-a="equip"' _site/item-system-patch.js
          grep -Fq 'catlak_set_equipped_slot' _site/gm-item-slot-patch.js
          grep -Fq '__catlakShouldPreserveCurrentView' _site/browser-app.js
          grep -Fq '__catlakStatsTest' _site/browser-app.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4