name: Deploy GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'browser-app.js'
      - 'browser-build.json'
      - 'gm-controls-patch.js'
      - 'presence-patch.js'
      - 'dice-ux-patch.js'
      - 'item-system-patch.js'
      - 'event-rolls-patch.js'
      - 'gm-tools-patch.js'
      - 'room-guard-patch.js'
      - 'room-system-patch.js'
      - 'battle-room-v3-patch.js'
      - 'player-enemy-privacy-patch.js'
      - 'battle-room-compact-patch.js'
      - 'battle-room-actions-layout-patch.js'
      - 'site-stability-patch.js'
      - 'game-flow-stability-patch.js'
      - 'turn-sync-patch.js'
      - 'battle-action-stability-patch.js'
      - 'battle-room-classic-stable-patch.js'
      - 'quality-of-life-patch.js'
      - 'gm-nav-cleanup-patch.js'
      - 'gm-combat-v3-patch.js'
      - 'battle-creature-patch.js'
      - 'combat-enhancements-patch.js'
      - 'ability-player-patch.js'
      - 'gm-hub-v2-patch.js'
      - 'invite-visibility-patch.js'
      - 'stat-workshop-route-fix.js'
      - 'route-stability-patch.js'
      - 'gm-center-tools-integration-patch.js'
      - 'player-sheet-patch.js'
      - 'player-sheet-equipment-abilities-patch.js'
      - 'player-live-actions-patch.js'
      - 'weapon-slot-patch.js'
      - 'gm-item-slot-patch.js'
      - 'stat-roll-patch.js'
      - 'catalog.b64'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: catlak-github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Prepare static site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          cp index.html browser-app.js gm-controls-patch.js presence-patch.js dice-ux-patch.js item-system-patch.js event-rolls-patch.js gm-tools-patch.js room-guard-patch.js room-system-patch.js battle-room-v3-patch.js player-enemy-privacy-patch.js battle-room-compact-patch.js battle-room-actions-layout-patch.js site-stability-patch.js game-flow-stability-patch.js turn-sync-patch.js battle-action-stability-patch.js battle-room-classic-stable-patch.js quality-of-life-patch.js gm-nav-cleanup-patch.js gm-combat-v3-patch.js battle-creature-patch.js combat-enhancements-patch.js ability-player-patch.js gm-hub-v2-patch.js invite-visibility-patch.js stat-workshop-route-fix.js route-stability-patch.js gm-center-tools-integration-patch.js player-sheet-patch.js player-sheet-equipment-abilities-patch.js player-live-actions-patch.js weapon-slot-patch.js gm-item-slot-patch.js stat-roll-patch.js catalog.b64 _site/
          touch _site/.nojekyll
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('_site/browser-app.js')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'https://cdn\.jsdelivr\.net/gh/AxionBLooder/catlak-cagi-online@[0-9a-f]+/catalog\.b64','./catalog.b64',s)
          p.write_text(s,encoding='utf-8')
          html=Path('_site/index.html')
          text=html.read_text(encoding='utf-8')
          route_tag='<script src="./route-stability-patch.js?v=routes-v2"></script>'
          stat_tag='<script src="./stat-workshop-route-fix.js?v=statsroute-v3"></script>'
          gmci_tag='<script src="./gm-center-tools-integration-patch.js?v=gmcenter-tools-v2"></script>'
          if route_tag not in text:
              text=text.replace('</body>',route_tag+'</body>')
          if stat_tag not in text:
              text=text.replace('</body>',stat_tag+'</body>')
          if gmci_tag not in text:
              text=text.replace('</body>',gmci_tag+'</body>')
          html.write_text(text,encoding='utf-8')
          PY
          node --check _site/browser-app.js
          node --check _site/gm-controls-patch.js
          node --check _site/presence-patch.js
          node --check _site/dice-ux-patch.js
          node --check _site/item-system-patch.js
          node --check _site/event-rolls-patch.js
          node --check _site/gm-tools-patch.js
          node --check _site/room-guard-patch.js
          node --check _site/room-system-patch.js
          node --check _site/battle-room-v3-patch.js
          node --check _site/player-enemy-privacy-patch.js
          node --check _site/battle-room-compact-patch.js
          node --check _site/battle-room-actions-layout-patch.js
          node --check _site/site-stability-patch.js
          node --check _site/game-flow-stability-patch.js
          node --check _site/turn-sync-patch.js
          node --check _site/battle-action-stability-patch.js
          node --check _site/battle-room-classic-stable-patch.js
          node --check _site/quality-of-life-patch.js
          node --check _site/gm-nav-cleanup-patch.js
          node --check _site/gm-combat-v3-patch.js
          node --check _site/battle-creature-patch.js
          node --check _site/combat-enhancements-patch.js
          node --check _site/ability-player-patch.js
          node --check _site/gm-hub-v2-patch.js
          node --check _site/invite-visibility-patch.js
          node --check _site/stat-workshop-route-fix.js
          node --check _site/route-stability-patch.js
          node --check _site/gm-center-tools-integration-patch.js
          node --check _site/player-sheet-patch.js
          node --check _site/player-sheet-equipment-abilities-patch.js
          node --check _site/player-live-actions-patch.js
          node --check _site/weapon-slot-patch.js
          node --check _site/gm-item-slot-patch.js
          node --check _site/stat-roll-patch.js
          grep -q 'route-stability-patch.js?v=routes-v2' _site/index.html
          grep -q 'stat-workshop-route-fix.js?v=statsroute-v3' _site/index.html
          grep -q 'gm-center-tools-integration-patch.js?v=gmcenter-tools-v2' _site/index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
