name: Stabilize Campaign Room Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stabilize-campaign-room-once.yml'

permissions:
  contents: write

jobs:
  stabilize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Stabilize campaign room ownership
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if new in s:
                  return
              if old not in s:
                  raise SystemExit(f'marker not found in {path}: {old[:80]}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          replace_once('gm-campaign-state-patch.js',
              "const GCS_PLACEHOLDER_ROUTE='characters';",
              "const GCS_PLACEHOLDER_ROUTE='campaign';")

          replace_once('gm-campaign-state-patch.js',
              "function gcsClose(){gcsActive='';window.__catlakCampaignStateRoom='';const m=GCS_APP.querySelector('main');if(m)delete m.dataset.gcsRoute;gcsEnsureButtons()}",
              "function gcsClose(){gcsActive='';window.__catlakCampaignStateRoom='';if(String(window.__catlakGmCenterSelectedRoute||'')===GCS_PLACEHOLDER_ROUTE)window.__catlakGmCenterSelectedRoute='';const m=GCS_APP.querySelector('main');if(m)delete m.dataset.gcsRoute;gcsEnsureButtons()}")

          replace_once('gm-campaign-state-patch.js',
              "window.__catlakCampaignStateTest={open:gcsOpen,close:gcsClose,active:()=>gcsActive,maintain:gcsMaintain};",
              "window.__catlakCampaignRoomStableV3=true;\nwindow.__catlakCampaignStateTest={open:gcsOpen,close:gcsClose,active:()=>gcsActive,maintain:gcsMaintain};")

          replace_once('gm-hub-v2-patch.js',
              "function gm2ActiveRoute(){const forced=String(window.__catlakGmCenterSelectedRoute||'');",
              "function gm2ActiveRoute(){if(window.__catlakCampaignStateRoom)return'campaign';const forced=String(window.__catlakGmCenterSelectedRoute||'');")

          replace_once('gm-hub-v2-patch.js',
              "function gm2HubContext(){const r=gm2ActiveRoute();return gm2AbilityOpen||window.__catlakGmToolsOpen===true||window.__catlakCreatureLibraryOpen===true||GM2_ROUTES.some(([k])=>k===r)}",
              "function gm2HubContext(){const r=gm2ActiveRoute();return gm2AbilityOpen||window.__catlakGmToolsOpen===true||window.__catlakCreatureLibraryOpen===true||!!window.__catlakCampaignStateRoom||GM2_ROUTES.some(([k])=>k===r)}")

          replace_once('gm-hub-v2-patch.js',
              "function gm2LeaveCenter(){window.__catlakGmCenterSelectedRoute='';gm2AbilityOpen=false;",
              "function gm2LeaveCenter(){window.__catlakCampaignStateTest?.close?.();window.__catlakGmCenterSelectedRoute='';gm2AbilityOpen=false;")

          replace_once('gm-hub-v2-patch.js',
              "  if(!GM2_ROUTES.some(([k])=>k===route))return;\n  window.__catlakGmCenterSelectedRoute=route;",
              "  if(!GM2_ROUTES.some(([k])=>k===route))return;\n  window.__catlakCampaignStateTest?.close?.();\n  window.__catlakGmCenterSelectedRoute=route;")

          replace_once('gm-hub-v2-patch.js',
              "window.__catlakGmHubV2Test={",
              "window.__catlakCampaignHubStableV3=true;\nwindow.__catlakGmHubV2Test={")

          replace_once('gm-center-router-core.js',
              "  if(window.__catlakCreatureLibraryOpen===true)return true;",
              "  if(window.__catlakCreatureLibraryOpen===true)return true;\n  if(window.__catlakCampaignStateRoom)return true;")

          replace_once('gm-center-router-core.js',
              "function gmcrLogicalRoute(){\n  const forced=String(window.__catlakGmCenterSelectedRoute||'');",
              "function gmcrLogicalRoute(){\n  if(window.__catlakCampaignStateRoom)return'campaign';\n  const forced=String(window.__catlakGmCenterSelectedRoute||'');")

          replace_once('gm-center-router-core.js',
              "  else{hub?.release?.();window.__catlakGmTools?.close?.();",
              "  else{window.__catlakCampaignStateTest?.close?.();hub?.release?.();window.__catlakGmTools?.close?.();")

          replace_once('gm-center-router-core.js',
              "  if(!gmcrIsGM()||!GMCR_ROUTES.has(route))return false;\n  gmcrSelect(route);",
              "  if(!gmcrIsGM()||!GMCR_ROUTES.has(route))return false;\n  window.__catlakCampaignStateTest?.close?.();\n  gmcrSelect(route);")

          replace_once('gm-center-router-core.js',
              "window.__catlakGmCenterRouterCore={",
              "window.__catlakCampaignRouterStableV3=true;\nwindow.__catlakGmCenterRouterCore={")
          PY

          node --check gm-campaign-state-patch.js
          node --check gm-hub-v2-patch.js
          node --check gm-center-router-core.js
          grep -Fq "GCS_PLACEHOLDER_ROUTE='campaign'" gm-campaign-state-patch.js
          grep -Fq '__catlakCampaignRoomStableV3=true' gm-campaign-state-patch.js
          grep -Fq '__catlakCampaignHubStableV3=true' gm-hub-v2-patch.js
          grep -Fq '__catlakCampaignRouterStableV3=true' gm-center-router-core.js

      - name: Commit stabilized ownership
        run: |
          if git diff --quiet -- gm-campaign-state-patch.js gm-hub-v2-patch.js gm-center-router-core.js; then
            echo 'No source change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gm-campaign-state-patch.js gm-hub-v2-patch.js gm-center-router-core.js
          git commit -m 'Kampanya odası route sahipliğini stabilize et'
          git push