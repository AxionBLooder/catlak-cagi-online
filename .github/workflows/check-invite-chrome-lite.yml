name: Check Invite Chrome Lite
on:
  push:
    paths:
      - '.github/workflows/check-invite-chrome-lite.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - name: Verify PageShare invite entry
        run: |
          set -euo pipefail
          BASE='https://hidden-spring-7923.hosted.pageshare.ai/'
          curl -fsSL -D /tmp/headers.txt "$BASE?verify=invite" -o /tmp/page.html
          cat /tmp/headers.txt
          grep -qi 'content-type: text/html' /tmp/headers.txt
          grep -q 'f469429abde87e1f16af30b42f9a46245f83bdc8' /tmp/page.html
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          set +e
          timeout 25s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-background-networking --virtual-time-budget=12000 --dump-dom "$BASE?join=CHAR-INVALID-SMOKE-ONLY" >/tmp/dom.html 2>/tmp/chrome.log
          STATUS=$?
          set -e
          echo "CHROME_STATUS=$STATUS"
          head -c 6000 /tmp/dom.html || true
          echo
          grep -Ei 'error|fail|net::|catlak' /tmp/chrome.log | tail -80 || true
          echo '--- MARKERS ---'
          grep -o 'Giriş Yap\|Çatlak Çağı\|Oyun masası yükleniyor\|Karakter daveti kullanılmış veya süresi dolmuş' /tmp/dom.html | sort -u || true
          grep -q 'Çatlak Çağı' /tmp/dom.html
          if grep -q '&lt;!doctype html&gt;' /tmp/dom.html; then echo 'HTML_RENDERED_AS_TEXT'; exit 1; fi
