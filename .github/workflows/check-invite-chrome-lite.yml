name: Check Invite Chrome Lite
on:
  push:
    paths:
      - '.github/workflows/check-invite-chrome-lite.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - name: Verify static invite entry
        run: |
          set -euo pipefail
          BASE='https://cdn.jsdelivr.net/gh/AxionBLooder/catlak-cagi-online@c363e89abcfba71ccbb81a16f8d42206a2bcded3/invite-entry.html'
          curl -fsSL -D /tmp/headers.txt "$BASE?join=CHAR-INVALID-SMOKE-ONLY" -o /tmp/invite.html
          cat /tmp/headers.txt
          grep -qi 'content-type: text/html' /tmp/headers.txt
          grep -q 'catlak-cagi?asset=app' /tmp/invite.html
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          set +e
          timeout 25s "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=12000 --dump-dom "$BASE?join=CHAR-INVALID-SMOKE-ONLY" >/tmp/dom.html 2>/tmp/chrome.log
          STATUS=$?
          set -e
          echo "CHROME_STATUS=$STATUS"
          head -c 5000 /tmp/dom.html || true
          echo
          grep -Ei 'error|fail|net::' /tmp/chrome.log | tail -80 || true
          echo '--- MARKERS ---'
          grep -o 'Giriş Yap\|Çatlak Çağı\|Oyun masası yükleniyor\|Karakter daveti kullanılmış veya süresi dolmuş' /tmp/dom.html | sort -u || true
          grep -q 'Çatlak Çağı' /tmp/dom.html
          if grep -q '&lt;!doctype html&gt;' /tmp/dom.html; then echo 'HTML_RENDERED_AS_TEXT'; exit 1; fi
