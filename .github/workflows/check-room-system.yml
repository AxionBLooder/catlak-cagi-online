name: Check Room System
on:
  push:
    paths:
      - 'room-guard-patch.js'
      - 'room-system-patch.js'
      - '.github/workflows/check-room-system.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v6
      - name: Static checks
        run: |
          set -euo pipefail
          node --check room-guard-patch.js
          node --check room-system-patch.js
          grep -q 'CRG_NAV_PLAN' room-guard-patch.js
          grep -q 'catlak_roll_weapon' room-guard-patch.js
          grep -q 'ccrEnsureHub' room-system-patch.js
          grep -q 'YÖNETİM ODASI' room-system-patch.js
          grep -q 'Savaş Odası' room-system-patch.js
          grep -q 'catlak_player_combat_snapshot' room-system-patch.js
          grep -q 'KRİTİK BAŞARISIZLIK' room-system-patch.js
          echo ROOM_STATIC_OK
      - name: Install browser driver
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright-core
      - name: Mock GM and player rooms in Chrome
        run: |
          cat > room-gm.html <<'EOF'
          <!doctype html><html lang="tr"><head><meta charset="utf-8"></head><body><div id="app"><header><span class="role">GM</span></header><nav class="nav"><button class="on" data-tab="gm">Canlı Oyun Masası</button><button data-tab="characters">Karakterler</button><button data-tab="rules">Kaynaklar</button><button data-tab="account">Hesap</button><button data-tab="races">Irk Atölyesi</button><button data-tab="items">Eşya Atölyesi</button><button data-tab="builder">Karakter Oluşturucu</button><button data-tab="rolls">Zar Akışı</button><button data-gmt-open>GM Araçları</button><button data-cc-map-tab>Harita</button><button data-cc-world-tab>Görsel Arşivi</button><button data-cc-stats-tab>Stat Atölyesi</button></nav><main><section class="card">BASE gm</section></main></div><div id="toast" class="hidden"></div><script>
          window.__catlakSupabase={rpc:async()=>({data:{active:false,order:[]},error:null}),from:()=>({select(){return this},eq(){return this},order(){return this},limit(){return Promise.resolve({data:[],error:null})},then(ok,bad){return Promise.resolve({data:[],error:null}).then(ok,bad)}})};
          document.querySelector('#app').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(!b)return;document.querySelectorAll('.nav button.on').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.querySelector('main').innerHTML='<section class="card">BASE '+b.dataset.tab+'</section>'});
          </script><script src="./room-guard-patch.js"></script><script src="./room-system-patch.js"></script></body></html>
          EOF
          cat > room-player.html <<'EOF'
          <!doctype html><html lang="tr"><head><meta charset="utf-8"></head><body><div id="app"><header><span class="role">OYUNCU</span></header><nav class="nav"><button class="on" data-tab="sheet">Oyuncu Masası</button><button data-tab="rules">Kaynaklar</button><button data-tab="account">Oturum</button></nav><main><section class="card">SHEET</section></main></div><div id="toast" class="hidden"></div><script>
          window.__calls=[];
          const db={
            catlak_characters:[{id:'c1',name:'Batuhan',owner_id:'u1',hp_current:9,hp_max:12,base_ac:13,base_speed:30,base_stats:{STR:10,DEX:14,CON:12,INT:10,WIS:10,CHA:10},data:{cc_party_member:true},play_status:'active'}],
            catlak_inventory:[{id:'inv1',character_id:'c1',item_id:'w1',quantity:1,equipped:true,equipped_slot:'main_weapon',player_note:''}],
            catlak_character_conditions:[{id:'k1',name:'Zehirli',note:'Saldırı -1',remaining_rounds:2,active:true,created_at:new Date().toISOString()}],
            catlak_rolls:[{id:'r1',character_id:'c1',label:'Test Zar',roll_kind:'stat',formula:'1d20-2',modifier:-2,total:0,created_at:new Date().toISOString()}],
            catlak_items:[{id:'w1',name:'Gece Nöbeti',item_type:'weapon',description:'',attack_stat:'DEX',attack_bonus:1,attack_formula:'1d20',damage_formula:'2d4',damage_type:'kesici',effects:{},ac_mode:'none',ac_value:0}]
          };
          function from(t){const c={select(){return c},eq(){return c},order(){return c},limit(){return c},in(){return c},then(ok,bad){return Promise.resolve({data:db[t]||[],error:null}).then(ok,bad)}};return c}
          window.__catlakSupabase={auth:{getSession:async()=>({data:{session:{user:{id:'u1'}}}})},channel:()=>({on(){return this},subscribe(){return this}}),from,rpc:async(fn,args)=>{window.__calls.push([fn,args]);if(fn==='catlak_player_combat_snapshot')return{data:{active:true,battle_name:'Test Savaş',round:2,current_name:'Batuhan',character_id:'c1',combatant_id:'cb1',in_combat:true,is_my_turn:true,order:[{id:'cb1',name:'Batuhan',kind:'player',initiative:18,is_current:true,is_self:true,hp_current:9,hp_max:12,ac:13},{id:'cb2',name:'Çatlak Avcısı',kind:'enemy',initiative:12,is_current:false,is_self:false,hp_current:10,hp_max:10,ac:14,creature_type:'Yaratık'}]},error:null};if(fn==='catlak_player_abilities')return{data:[],error:null};if(fn==='catlak_player_weapon_strike')return{data:{target_name:'Çatlak Avcısı',hit:true,critical:false,damage_total:3,target_hp:7},error:null};if(fn==='catlak_update_my_hp')return{data:true,error:null};if(fn==='catlak_roll_weapon')return{data:{label:'Gece Nöbeti Saldırı',total:17},error:null};if(fn==='catlak_roll_stat')return{data:{label:'DEX',total:15},error:null};return{data:true,error:null}}};
          </script><script src="./room-guard-patch.js"></script><script src="./room-system-patch.js"></script><script src="./battle-room-v3-patch.js"></script></body></html>
          EOF
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/room-http.log 2>&1 &
          PID=$!; trap 'kill $PID 2>/dev/null || true' EXIT
          cat > room-smoke.cjs <<'JS'
          const {chromium}=require('playwright-core');const {execFileSync}=require('child_process');
          (async()=>{let exe='';for(const c of ['google-chrome','google-chrome-stable','chromium']){try{exe=execFileSync('bash',['-lc',`command -v ${c}`],{encoding:'utf8'}).trim();if(exe)break}catch{}}if(!exe)throw new Error('Chrome missing');const b=await chromium.launch({headless:true,executablePath:exe,args:['--no-sandbox','--disable-gpu']});try{
            const g=await b.newPage();const ge=[];g.on('pageerror',e=>ge.push(String(e.message||e)));await g.goto('http://127.0.0.1:4173/room-gm.html',{waitUntil:'domcontentloaded'});await g.waitForTimeout(150);const gm=await g.evaluate(()=>({hidden:['characters','rules','account'].every(t=>document.querySelector(`[data-tab="${t}"]`)?.classList.contains('ccr-managed-hidden')),legacyHub:!!document.querySelector('[data-ccr-hub]'),body:document.querySelector('main')?.textContent||''}));if(!gm.hidden)throw new Error('Managed GM tabs not hidden');if(gm.legacyHub)throw new Error('Legacy Yönetim Odası hub should not be mounted; GM Merkezi owns management now');if(!gm.body.includes('BASE gm'))throw new Error('GM base route changed '+JSON.stringify(gm));if(ge.length)throw new Error('GM page errors '+ge.join(' | '));await g.close();
            const p=await b.newPage();const pe=[];p.on('pageerror',e=>pe.push(String(e.message||e)));await p.goto('http://127.0.0.1:4173/room-player.html',{waitUntil:'domcontentloaded'});await p.waitForSelector('[data-ccr-battle]');if(await p.locator('[data-ccr-hub]').count())throw new Error('Player saw GM hub');await p.click('[data-ccr-battle]');await p.locator('[data-br3-turn]:visible').waitFor();await p.locator('[data-br3-strike]:visible').first().waitFor();const po=await p.evaluate(()=>({text:document.querySelector('main')?.textContent||'',gmHidden:!document.querySelector('[data-ccr-hub]')}));for(const m of ['Test Savaş','Round 2','Sıra Sende','Zehirli','Gece Nöbeti','Çatlak Avcısı'])if(!po.text.toLocaleLowerCase('tr-TR').includes(m.toLocaleLowerCase('tr-TR')))throw new Error('Battle room marker '+m+' '+JSON.stringify(po));await p.evaluate(()=>{window.__battleMainRef=document.querySelector('main');window.__battleHeroRef=document.querySelector('section.hero');window.__battleFullRenderStart=window.__catlakRoomSystemTest?.fullRenderCount?.()||0;window.__catlakBattleRoomV3Test.target('cb2')});await p.waitForTimeout(80);let stage=await p.evaluate(()=>({sameMain:window.__battleMainRef===document.querySelector('main'),sameHero:window.__battleHeroRef===document.querySelector('section.hero')}));if(!stage.sameMain||!stage.sameHero)throw new Error('Battle reset at target '+JSON.stringify(stage));await p.locator('[data-br3-strike]:visible:not([disabled])').first().waitFor();await p.locator('[data-br3-strike]:visible:not([disabled])').first().click();await p.waitForFunction(()=>!window.__catlakBattleRoomV3Test.actionBusy());await p.waitForTimeout(100);stage=await p.evaluate(()=>({sameMain:window.__battleMainRef===document.querySelector('main'),sameHero:window.__battleHeroRef===document.querySelector('section.hero'),oldHeroConnected:!!window.__battleHeroRef?.isConnected,fullStart:window.__battleFullRenderStart,fullNow:window.__catlakRoomSystemTest?.fullRenderCount?.()||0,canonical:window.__catlakRoomSystemTest?.canonicalOwned?.()||false,fullCanonicalAtWrite:window.__catlakRoomSystemTest?.lastFullRenderCanonical?.(),fullStack:window.__catlakRoomSystemTest?.lastFullRenderStack?.()||''}));if(!stage.sameMain||!stage.sameHero)throw new Error('Battle reset at strike '+JSON.stringify(stage));await p.locator('[data-br3-hp-amount]:visible').fill('2');await p.locator('[data-br3-hp-change="damage"]:visible').click();await p.waitForFunction(()=>!window.__catlakBattleRoomV3Test.actionBusy());await p.waitForTimeout(220);stage=await p.evaluate(()=>({sameMain:window.__battleMainRef===document.querySelector('main'),sameHero:window.__battleHeroRef===document.querySelector('section.hero')}));if(!stage.sameMain||!stage.sameHero)throw new Error('Battle reset at hp '+JSON.stringify(stage));const calls=await p.evaluate(()=>window.__calls);const weaponCalls=calls.filter(x=>x[0]==='catlak_player_weapon_strike');if(weaponCalls.length!==1)throw new Error('Weapon strike RPC count '+weaponCalls.length+' '+JSON.stringify(calls));const hpCalls=calls.filter(x=>x[0]==='catlak_update_my_hp');if(hpCalls.length!==1||Number(hpCalls[0][1]?.p_hp)!==7)throw new Error('HP change RPC '+JSON.stringify(hpCalls));await p.evaluate(()=>window.dispatchEvent(new CustomEvent('catlak:realtime-sync',{detail:{kind:'character',action:'hp-adjust'}})));await p.waitForTimeout(220);const stable=await p.evaluate(()=>({battle:!!document.querySelector('[data-br3-turn]'),pending:document.documentElement.classList.contains('cc-battle-entry-pending'),hp:document.querySelector('section.hero .vitals')?.textContent||'',sameMain:window.__battleMainRef===document.querySelector('main'),sameHero:window.__battleHeroRef===document.querySelector('section.hero'),roomOpen:window.__catlakBattleRoomOpen===true}));if(!stable.battle||stable.pending||!stable.sameMain||!stable.sameHero||!stable.roomOpen)throw new Error('Battle reset after click/realtime '+JSON.stringify(stable));if(pe.length)throw new Error('Player page errors '+pe.join(' | '));console.log('ROOM_BROWSER_OK',JSON.stringify({gm,po,stable,calls:calls.map(x=>x[0])}));await p.close();
          }finally{await b.close()}})().catch(e=>{console.error(e);process.exit(1)});
          JS
          node room-smoke.cjs
