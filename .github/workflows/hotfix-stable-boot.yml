name: Hotfix Stable Boot
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-stable-boot.yml'
permissions:
  contents: write
jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Make boot and login non-blocking
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('live_06.txt')
          s=p.read_text(encoding='utf-8')
          old="let{error}=await S.auth.signInWithPassword({email,password});if(error)throw error"
          new="b.disabled=true;b.textContent='Giriş yapılıyor…';let login=await Promise.race([S.auth.signInWithPassword({email,password}),new Promise(resolve=>setTimeout(()=>resolve({data:null,error:new Error('Giriş sunucusu yanıt vermedi. Lütfen tekrar dene.')}),12000))]);if(login.error){b.disabled=false;b.textContent='Giriş Yap';throw login.error}if(login.data?.session){st.ses=login.data.session;setTimeout(()=>runRefresh(),0)}"
          if old not in s:
              raise SystemExit('signIn kalıbı bulunamadı')
          s=s.replace(old,new,1)
          old2="let z=await Promise.all(q);"
          new2="let z;try{z=await Promise.race([Promise.all(q),new Promise((_,reject)=>setTimeout(()=>reject(new Error('Oyun verileri 12 saniye içinde yüklenemedi.')),12000))]);let bad=z.find(x=>x?.error);if(bad?.error)throw bad.error}catch(e){console.error('CATLAK_REFRESH_FAILED',e);msg(e.message||'Oyun verileri yüklenemedi.');render();return}"
          if old2 not in s:
              raise SystemExit('Promise.all refresh kalıbı bulunamadı')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')

          p=Path('live_08.txt')
          s=p.read_text(encoding='utf-8')
          start=s.find('const catReady=catload();')
          end=s.find('let liveRefreshTimer=null;')
          if start<0 or end<0 or end<=start:
              raise SystemExit('live_08 boot sınırları bulunamadı')
          boot=r'''const catReady=catload();
let joinCode=new URLSearchParams(window.location.search).get('join'),joinHandled=false,authRefreshTimer=null,refreshRun=null,refreshQueued=false;
st.ses=null;render();
async function runRefresh(){if(!st.ses?.user){render();return}if(refreshRun){refreshQueued=true;return refreshRun}refreshRun=(async()=>{try{await Promise.race([refresh(),new Promise((_,reject)=>setTimeout(()=>reject(new Error('Masa verileri zaman aşımına uğradı.')),15000))])}catch(e){console.error('CATLAK_SAFE_REFRESH',e);msg(e.message||'Masa verileri yüklenemedi.');render()}})();try{await refreshRun}finally{refreshRun=null;if(refreshQueued){refreshQueued=false;setTimeout(()=>runRefresh(),100)}}}
async function handleJoin(session){if(!joinCode||joinHandled)return session;joinHandled=true;try{if(session){let rr=await Promise.race([S.from('catlak_roles').select('role').eq('user_id',session.user.id).maybeSingle(),new Promise((_,reject)=>setTimeout(()=>reject(new Error('Davet rol kontrolü zaman aşımına uğradı.')),8000))]);if(rr?.data?.role==='gm')throw new Error('GM oturumunda oyuncu davet linki kullanılamaz. Linki oyuncuya gönder.');if(/^GUEST-/i.test(joinCode)){let r=await Promise.race([S.rpc('catlak_consume_guest_invite',{p_code:joinCode}),new Promise((_,reject)=>setTimeout(()=>reject(new Error('Davet işlemi zaman aşımına uğradı.')),10000))]);if(r.error)throw r.error;st.tab='builder';msg('Davet kabul edildi. Karakterini oluştur.')}else{let r=await Promise.race([S.rpc('catlak_claim_character',{p_code:joinCode}),new Promise((_,reject)=>setTimeout(()=>reject(new Error('Karakter daveti zaman aşımına uğradı.')),10000))]);if(r.error)throw r.error;st.tab='sheet';msg('Hazır karakter hesabına bağlandı.')}}else{let resp=await Promise.race([fetch('https://ygbereitlhjvoqgqlwfe.supabase.co/functions/v1/catlak-guest-join',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:joinCode})}),new Promise((_,reject)=>setTimeout(()=>reject(new Error('Davet sunucusu yanıt vermedi.')),10000))]),j=await resp.json();if(!resp.ok)throw new Error(j.detail||j.error||'Davet açılamadı');let sr=await Promise.race([S.auth.setSession({access_token:j.access_token,refresh_token:j.refresh_token}),new Promise((_,reject)=>setTimeout(()=>reject(new Error('Davet oturumu açılamadı.')),10000))]);if(sr.error)throw sr.error;session=sr.data?.session||null;st.tab=j.mode==='builder'?'builder':'sheet';msg(j.mode==='builder'?'Davetle katıldın. Karakterini oluştur.':`${j.character_name} karakterine katıldın.`)}}catch(e){err(e)}finally{history.replaceState({},'',window.location.pathname);joinCode=null}return session}
function applySession(session,ev){st.ses=session||null;clearTimeout(authRefreshTimer);if(!session){render();return}if(app.querySelector('.auth'))app.innerHTML='<main class="auth"><section class="card"><div class="mark bigmark">◇</div><div class="eyebrow">OTURUM AÇILDI</div><h2>Masa hazırlanıyor…</h2><p class="muted">Karakter ve oyun verileri yükleniyor.</p></section></main>';authRefreshTimer=setTimeout(()=>{if(st.ses?.user?.id===session.user.id)runRefresh()},0)}
S.auth.onAuthStateChange((ev,session)=>{setTimeout(async()=>{let s=session;if(joinCode)s=await handleJoin(s);applySession(s,ev)},0)});
if(joinCode)setTimeout(()=>handleJoin(null).then(s=>{if(s)applySession(s,'JOIN')}),0);
catReady.then(()=>{if(st.ses)runRefresh()}).catch(e=>console.warn('CATLAK_CATALOG_BACKGROUND',e));
'''
          s=s[:start]+boot+s[end:]
          # Realtime refreshleri de single-flight korumalı yola yönlendir.
          s=s.replace("liveRefreshTimer=setTimeout(()=>{if(st.ses)refresh()},180)","liveRefreshTimer=setTimeout(()=>{if(st.ses)runRefresh()},180)",1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check <(cat live_00.txt live_01.txt live_02.txt live_03.txt live_04.txt live_05.txt live_06.txt live_07.txt live_08.txt)
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live_06.txt live_08.txt
          git commit -m "Başlangıç ve giriş zincirini bloklamayan yapıya geçir"
          git pull --rebase origin main
          git push
