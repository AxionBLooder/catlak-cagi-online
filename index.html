<!doctype html>
<!-- clean-gm-runtime-v45 -->
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta name="theme-color" content="#071019">
  <title>Çatlak Çağı</title>
  <link rel="preconnect" href="https://ygbereitlhjvoqgqlwfe.supabase.co" crossorigin>
  <link rel="dns-prefetch" href="https://ygbereitlhjvoqgqlwfe.supabase.co">
  <style>
    html,body{margin:0;min-height:100%;background:#071019;color:#edf6ff;font-family:Inter,system-ui,Segoe UI,Arial,sans-serif}
    html.cc-player-critical-pending #app main{visibility:visible!important}
    #cc-start-cover{position:fixed;inset:0;z-index:2147483646;display:grid;place-items:center;background:#071019;opacity:1;pointer-events:auto;transition:opacity .14s ease}
    #cc-start-cover.cc-done{opacity:0;pointer-events:none}
    #cc-start-cover strong{font-size:clamp(2rem,7vw,4.6rem);letter-spacing:.04em;color:#edf6ff;text-shadow:0 8px 32px #000}
    #cc-safe-boot{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
    #cc-safe-boot>div{max-width:620px;text-align:center}
    #cc-safe-boot h1{margin:0 0 10px;font-size:clamp(2rem,6vw,4rem)}
    #cc-safe-boot p{color:#91a7bb;line-height:1.6}
    #cc-safe-boot button{margin:6px;padding:10px 14px;border:1px solid #36536e;border-radius:8px;background:#10283a;color:#edf6ff;cursor:pointer}
  </style>
</head>
<body>
  <div id="cc-start-cover" aria-hidden="true"><strong>Çatlak Çağı</strong></div>
  <div id="app"><main id="cc-safe-boot"><div><h1>Çatlak Çağı</h1><p>Uygulama açılıyor…</p></div></main></div>
  <div id="toast" class="toast hidden"></div>

  <script>
  (function(){
    var done=false;
    function releaseStartCover(){
      if(done)return;done=true;
      document.documentElement.classList.remove('cc-player-critical-pending');
      var cover=document.getElementById('cc-start-cover');
      if(!cover)return;
      cover.classList.add('cc-done');
      setTimeout(function(){cover&&cover.remove()},180);
    }
    var hasJoin=false;try{hasJoin=!!new URLSearchParams(location.search).get('join')}catch(_){}
    setTimeout(releaseStartCover,hasJoin?1800:3200);
    window.addEventListener('catlak:player-fast-ready',releaseStartCover,{once:true});
    window.addEventListener('catlak:data-refreshed',releaseStartCover,{once:true});
    window.__catlakReleaseStartCover=releaseStartCover;
  })();
  </script>

  <script src="./live-game-entry-guard.js?v=live-entry-v12-no-legacy-row"></script>
  <script src="./gm-view-stability.js?v=gm-view-stability-v1"></script>
  <script src="./gm-clean-click-guard.js?v=gm-clean-click-v8-no-ghost"></script>
  <script src="./gm-ui-polish-v1.js?v=gm-ui-polish-v5"></script>
  <script src="./gm-nav-canonical.js?v=gm-nav-canonical-v1"></script>
  <script src="./app-action-stability.js?v=action-stability-v3-no-race-conflict"></script>

  <script>
  (function(){
    'use strict';
    var app=document.getElementById('app');
    var cover=document.getElementById('cc-start-cover');
    var started=false,addonsStarted=false,uiReady=false,bootTimer=null,revealFallback=null;

    function reveal(){
      if(uiReady)return;uiReady=true;clearTimeout(revealFallback);
      requestAnimationFrame(function(){requestAnimationFrame(function(){if(!cover)return;cover.classList.add('cc-done');setTimeout(function(){cover?.remove()},180)})});
    }
    function clearLocalSession(){
      try{Object.keys(localStorage).forEach(function(k){if(/^sb-.*-auth-token$/i.test(k))localStorage.removeItem(k)})}catch(_){}
      try{sessionStorage.removeItem('cc-boot-recovered')}catch(_){}
    }
    function fail(title,detail){
      clearTimeout(bootTimer);clearTimeout(revealFallback);document.documentElement.classList.remove('cc-player-critical-pending');cover?.remove();uiReady=true;
      app.innerHTML='<main id="cc-safe-boot"><div><h1>Çatlak Çağı</h1><h2>'+title+'</h2><p>'+String(detail||'Uygulama başlatılamadı.').replace(/[<>]/g,'')+'</p><button id="cc-reload">Yeniden Yükle</button><button id="cc-reset">Oturumu Temizle</button></div></main>';
      document.getElementById('cc-reload').onclick=function(){location.replace(location.pathname+'?reload='+Date.now())};
      document.getElementById('cc-reset').onclick=function(){clearLocalSession();location.replace(location.pathname+'?recover='+Date.now())};
    }
    function load(src,key){
      return new Promise(function(resolve){
        var old=document.querySelector('script[data-cc-addon="'+key+'"]');if(old){resolve(true);return}
        var s=document.createElement('script');s.src=src;s.async=false;s.dataset.ccAddon=key;
        s.onload=function(){resolve(true)};s.onerror=function(){console.warn('CATLAK_ADDON_LOAD_FAILED',src);resolve(false)};document.body.appendChild(s);
      });
    }
    function loadParallel(list){return Promise.all(list.map(function(x){return load(x[0],x[1])}))}
    async function waitForRuntime(){for(var i=0;i<120;i++){if(window.__catlakSupabase)return true;await new Promise(function(r){setTimeout(r,50)})}return false}
    async function waitForRole(){for(var i=0;i<80;i++){var t=String(app.querySelector('.role')?.textContent||'').trim();if(t)return t;await new Promise(function(r){setTimeout(r,25)})}return String(app.querySelector('.role')?.textContent||'').trim()}
    async function waitForPlayerSheet(){for(var i=0;i<120;i++){if(app.querySelector('main .cc-character-stack'))return true;await new Promise(function(r){setTimeout(r,20)})}return !!app.querySelector('main .cc-character-stack')}
    function twoFrames(){return new Promise(function(resolve){requestAnimationFrame(function(){requestAnimationFrame(resolve)})})}
    async function awaitMaybe(x){if(x&&typeof x.then==='function')await x}
    async function awaitLimited(x,ms){if(!x||typeof x.then!=='function')return x;return await Promise.race([x,new Promise(function(resolve){setTimeout(function(){resolve(false)},ms||900)})])}

    async function loadPlayerCritical(){
      document.documentElement.classList.add('cc-player-critical-pending');
      try{
        await load('./player-sheet-hard-recovery.js?v=player-hard-recovery-v21-race-ability-live','player-hard-recovery');
        if(app.querySelector('.nav [data-tab="sheet"].on')){
          try{await awaitLimited(window.__catlakPlayerSheetHardRecovery?.recover?.(),3200)}catch(e){console.warn('CATLAK_PLAYER_HARD_START',e)}
          await Promise.race([waitForPlayerSheet(),new Promise(function(resolve){setTimeout(function(){resolve(false)},1800)})]);
        }
        await twoFrames();
      }finally{
        document.documentElement.classList.remove('cc-player-critical-pending');
      }
    }

    async function loadPlayerBackground(){
      // Enhanced battle runtime loads first; the Savaş Odası nav is created only afterwards.
      // This prevents the legacy/base battle layout from flashing before v3/v4 enhancement.
      await load('./battle-room-v3-patch.js?v=battle-v4-stable-local-target','battle-room-v3');
      await loadParallel([
        ['./presence-patch.js?v=player-bg-v4-single-owner','presence'],
        ['./room-guard-patch.js?v=player-bg-v4-single-owner','room-guard'],
        ['./room-system-patch.js?v=player-bg-v9-enhanced-first','rooms'],
        ['./party-roster-patch.js?v=player-bg-v4-single-owner','party-roster'],
        ['./battle-party-membership-guard.js?v=player-bg-v6-party-only','battle-party-guard']
      ]);
    }

    async function loadGmCore(){
      await loadParallel([
        ['./gm-tools-patch.js?v=clean-gm-tools-v3-fast','gm-tools'],
        ['./quality-of-life-patch.js?v=clean-qol-v3-fast','qol'],
        ['./gm-campaign-state-patch.js?v=clean-campaign-v3-fast','gm-campaign-state'],
        ['./party-room-stable-v2.js?v=party-room-clean-v7-party-source','party-room-clean']
      ]);
      await loadParallel([
        ['./seal-character-controls-patch.js?v=clean-seal-controls-v3-fast','seal-character-controls'],
        ['./gm-clean-router-v1.js?v=gm-clean-router-v6-stable-hp','gm-clean-router'],
        ['./gm-live-compact-v1.js?v=gm-live-compact-v10-combat-only','gm-live-compact']
      ]);
      await load('./live-combat-center-loader.js?v=livecombat-loader-v9-repaired-live-board','live-combat-loader');
      try{window.__catlakGmCleanRouter?.ensure?.();window.__catlakPartyEeliotHotfix?.ensureNav?.();window.__catlakGmUiPolish?.maintain?.();window.__catlakGmLiveCompact?.maintain?.();window.__catlakLiveGameEntryGuard?.maintain?.()}catch(e){console.warn('CATLAK_CLEAN_GM_REFRESH',e)}
    }

    async function loadGmBackground(){
      await loadParallel([
        ['./class-bonus-patch.js?v=classbonus-v1','class-bonus'],
        ['./special-character-abilities.js?v=special-char-v1','special-character-abilities'],
        ['./visual-archive-map-flow-patch.js?v=visual-flow-v2-safe','visual-map-flow'],
        ['./gm-controls-patch.js?v=recovery-3','gm-controls'],
        ['./presence-patch.js?v=recovery-3','presence'],
        ['./dice-ux-patch.js?v=recovery-3','dice'],
        ['./item-system-patch.js?v=item-system-v5-direct-slots','items'],
        ['./event-rolls-patch.js?v=recovery-3','events'],
        ['./room-guard-patch.js?v=recovery-3','room-guard'],
        ['./room-system-patch.js?v=recovery-9-enhanced-first','rooms'],
        ['./party-roster-patch.js?v=recovery-3','party-roster'],
        ['./battle-party-membership-guard.js?v=battle-party-v4-party-only','battle-party-guard'],
        ['./session-log-delete-fix.js?v=session-log-v4-clean-route','session-log-delete']
      ]);
    }

    async function loadSafeAddons(){
      if(addonsStarted)return;addonsStarted=true;
      var runtimeReady=await waitForRuntime();if(!runtimeReady){console.warn('CATLAK_SAFE_ADDONS_SKIPPED');reveal();return}
      var role=await waitForRole();
      if(role==='GM'){
        await loadGmCore();
        await loadGmBackground();
        try{
          window.__catlakGmCleanRouter?.ensure?.();
          window.__catlakLiveCombatCenter?.render?.();
          window.__catlakGmUiPolish?.maintain?.();
          window.__catlakGmLiveCompact?.maintain?.();
          window.__catlakLiveGameEntryGuard?.maintain?.();
          window.__catlakGmLivePlayerState?.refresh?.(true);
          if(app.querySelector('.nav [data-tab="gm"].on'))window.__catlakLiveGameEntryGuard?.begin?.();
        }catch(_){}
        reveal();
        return;
      }
      await loadPlayerCritical();
      reveal();
      loadPlayerBackground().catch(function(e){console.warn('CATLAK_PLAYER_BACKGROUND',e)});
    }

    window.addEventListener('error',function(e){if(!started&&String(e&&e.message||'').trim())fail('Başlangıç hatası',e.message)},true);
    window.addEventListener('unhandledrejection',function(e){if(!started){var r=e&&e.reason;fail('Başlangıç hatası',r&&r.message?r.message:String(r||'Bilinmeyen hata'))}});

    var core=document.createElement('script');core.src='./browser-app.js?v=recovery-core-15-hard-projection-owner';core.async=false;
    core.onload=function(){started=true;clearTimeout(bootTimer);loadSafeAddons().catch(function(e){console.warn('CATLAK_ADDON_BOOT_FAILED',e);document.documentElement.classList.remove('cc-player-critical-pending');reveal()});revealFallback=setTimeout(function(){document.documentElement.classList.remove('cc-player-critical-pending');reveal()},9000)};
    core.onerror=function(){fail('Ana uygulama dosyası yüklenemedi','browser-app.js alınamadı. Tarayıcı önbelleğini temizleyip tekrar deneyebilirsin.')};
    document.body.appendChild(core);
    bootTimer=setTimeout(function(){if(document.getElementById('cc-safe-boot'))fail('Başlangıç tamamlanamadı','Ana uygulama yanıt verdi ancak ekran oluşturulamadı. Oturumu temizleyip tekrar deneyebilirsin.')},10000);
  })();
  </script>
</body>
</html>
