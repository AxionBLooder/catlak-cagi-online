<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta name="theme-color" content="#071019">
  <title>Çatlak Çağı</title>
  <link rel="preconnect" href="https://ygbereitlhjvoqgqlwfe.supabase.co" crossorigin>
  <link rel="dns-prefetch" href="https://ygbereitlhjvoqgqlwfe.supabase.co">
  <style>
    html,body{margin:0;min-height:100%;background:#071019;color:#edf6ff;font-family:Inter,system-ui,Segoe UI,Arial,sans-serif}
    #cc-safe-boot{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
    #cc-safe-boot>div{max-width:620px;text-align:center}
    #cc-safe-boot h1{margin:0 0 10px;font-size:clamp(2rem,6vw,4rem)}
    #cc-safe-boot p{color:#91a7bb;line-height:1.6}
    #cc-safe-boot button{margin:6px;padding:10px 14px;border:1px solid #36536e;border-radius:8px;background:#10283a;color:#edf6ff;cursor:pointer}
  </style>
</head>
<body>
  <div id="app">
    <main id="cc-safe-boot">
      <div>
        <h1>Çatlak Çağı</h1>
        <p>Uygulama açılıyor…</p>
      </div>
    </main>
  </div>
  <div id="toast" class="toast hidden"></div>

  <script>
  (function(){
    'use strict';
    var app=document.getElementById('app');
    var started=false;
    var addonsStarted=false;
    var bootTimer=null;

    function clearLocalSession(){
      try{Object.keys(localStorage).forEach(function(k){if(/^sb-.*-auth-token$/i.test(k))localStorage.removeItem(k)})}catch(_){ }
      try{sessionStorage.removeItem('cc-boot-recovered')}catch(_){ }
    }

    function fail(title,detail){
      clearTimeout(bootTimer);
      app.innerHTML='<main id="cc-safe-boot"><div><h1>Çatlak Çağı</h1><h2>'+title+'</h2><p>'+String(detail||'Uygulama başlatılamadı.').replace(/[<>]/g,'')+'</p><button id="cc-reload">Yeniden Yükle</button><button id="cc-reset">Oturumu Temizle</button></div></main>';
      document.getElementById('cc-reload').onclick=function(){location.replace(location.pathname+'?reload='+Date.now())};
      document.getElementById('cc-reset').onclick=function(){clearLocalSession();location.replace(location.pathname+'?recover='+Date.now())};
    }

    function load(src,key){
      return new Promise(function(resolve){
        var old=document.querySelector('script[data-cc-addon="'+key+'"]');
        if(old){resolve(true);return}
        var s=document.createElement('script');
        s.src=src;
        s.async=false;
        s.dataset.ccAddon=key;
        s.onload=function(){resolve(true)};
        s.onerror=function(){console.warn('CATLAK_ADDON_LOAD_FAILED',src);resolve(false)};
        document.body.appendChild(s);
      });
    }

    function loadParallel(list){
      list.forEach(function(x){load(x[0],x[1])});
    }

    async function loadGmCore(){
      // GM Merkezi için sıra önemlidir: eski araçlar -> merkez motoru -> yönlendirici.
      await load('./gm-tools-patch.js?v=recovery-gm-2','gm-tools');
      await load('./quality-of-life-patch.js?v=recovery-gm-2','qol');
      await load('./gm-hub-v2-patch.js?v=recovery-gm-2','gm-hub');
      await load('./gm-center-router-core.js?v=recovery-gm-2','gm-router');
      load('./gm-nav-cleanup-patch.js?v=recovery-gm-2','gm-nav-cleanup');
      try{window.__catlakGmHubV2Test?.chrome?.();window.__catlakGmCenterRouterCore?.ensureEntry?.()}catch(e){console.warn('CATLAK_GM_CORE_REFRESH',e)}
    }

    function loadSafeAddons(){
      if(addonsStarted)return;
      addonsStarted=true;
      var tries=0;
      (function waitCore(){
        if(window.__catlakSupabase){
          loadGmCore().then(function(){
            loadParallel([
              ['./gm-controls-patch.js?v=recovery-2','gm-controls'],
              ['./presence-patch.js?v=recovery-2','presence'],
              ['./dice-ux-patch.js?v=recovery-2','dice'],
              ['./item-system-patch.js?v=recovery-2','items'],
              ['./event-rolls-patch.js?v=recovery-2','events'],
              ['./room-guard-patch.js?v=recovery-2','room-guard'],
              ['./room-system-patch.js?v=recovery-2','rooms'],
              ['./party-roster-patch.js?v=recovery-2','party-roster'],
              ['./invite-visibility-patch.js?v=recovery-2','invites'],
              ['./player-sheet-patch.js?v=recovery-2','player-sheet'],
              ['./player-sheet-equipment-abilities-patch.js?v=recovery-2','player-equip'],
              ['./player-live-actions-patch.js?v=recovery-2','player-actions'],
              ['./gm-item-slot-patch.js?v=recovery-2','gm-items'],
              ['./stat-roll-patch.js?v=recovery-2','stat-roll']
            ]);
          });
          return;
        }
        if(++tries<120)setTimeout(waitCore,50);
        else console.warn('CATLAK_SAFE_ADDONS_SKIPPED');
      })();
    }

    window.addEventListener('error',function(e){
      if(!started&&String(e && e.message || '').trim())fail('Başlangıç hatası',e.message);
    },true);
    window.addEventListener('unhandledrejection',function(e){
      if(!started){var r=e&&e.reason;fail('Başlangıç hatası',r&&r.message?r.message:String(r||'Bilinmeyen hata'));}
    });

    var core=document.createElement('script');
    core.src='./browser-app.js?v=recovery-core-2';
    core.async=false;
    core.onload=function(){
      started=true;
      clearTimeout(bootTimer);
      loadSafeAddons();
    };
    core.onerror=function(){fail('Ana uygulama dosyası yüklenemedi','browser-app.js alınamadı. Tarayıcı önbelleğini temizleyip tekrar deneyebilirsin.')};
    document.body.appendChild(core);

    bootTimer=setTimeout(function(){
      if(document.getElementById('cc-safe-boot'))fail('Başlangıç tamamlanamadı','Ana uygulama yanıt verdi ancak ekran oluşturulamadı. Oturumu temizleyip tekrar deneyebilirsin.');
    },8000);
  })();
  </script>
</body>
</html>
